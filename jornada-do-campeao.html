    'Você anda pelo salão sem destino. Isso é uma habilidade — parecer que você está indo a algum lugar.',
    '"...ele paga adiantado, sempre." / "Eu não quero saber o que tem na caixa." / "Se descarrega em Celadon, não é problema de Vermilion."',
    'Um homem de cinquenta anos, sozinho numa mesa, com três taças vazias, te chama com a mão.',
    '"Você é novo." Não é pergunta. "Senta. Eu pago a sua bebida e você me ouve reclamar. É um bom negócio pra você."'
  ],
  escolhas:[
    {texto:'Sentar e ouvir.', vai:'c8_homem_mesa'},
    {texto:'Ir para o torneio.', vai:'c8_torneio'},
    {texto:'Ir para o camarote 40.', vai:'c8_camarote'}
  ]
},

c8_homem_mesa:{
  texto:[
    'Ele trabalhou dezoito anos na Silph. Saiu ano passado.',
    '"Eu não vou dizer por quê. Mas vou dizer uma coisa: quando uma empresa começa a chamar o setor de pesquisa de \'setor de recursos\', você atualiza o currículo."',
    'Ele bebe. "Você já ouviu falar do que tinha em Cinnabar?"',
    d=>d.flags.leu_caderno ? '"Pela sua cara, já."' : '"Ninguém ouviu. Esse é o ponto."',
    '"Cinnabar fechou. O trabalho não fechou. Ele mudou de andar, é isso que acontece com trabalho desse tipo."'
  ],
  ef:{flag:'dica_silph', npc:{nome:'Ex-Silph', opiniao:2, memoria:'Te contou, bêbado, que o trabalho de Cinnabar continuou na Silph.'},
      registrar:'Ficou sabendo que a pesquisa de Cinnabar migrou para a Silph em Saffron.'},
  escolhas:[
    {texto:'Perguntar o nome do projeto.', vai:'c8_nome_projeto'},
    {texto:'Agradecer e ir ao torneio.', vai:'c8_torneio'}
  ]
},

c8_nome_projeto:{
  texto:[
    'Ele ri sem alegria nenhuma e escreve num guardanapo.',
    'Não é nome de projeto. É um número de andar: **11**.',
    '"A Silph tem dez andares." Ele empurra o guardanapo pra você. "Boa noite."'
  ],
  ef:{flag:'sabe_do_andar_11', registrar:'Recebeu um guardanapo com o número 11. A Silph tem dez andares.'},
  escolhas:[{texto:'Guardar o guardanapo.', vai:'c8_torneio'}]
},

c8_torneio:{
  texto:[
    'O torneio do S.S. Anne é exibição de gente rica. A bolsa é alta o suficiente pra atrair treinadores de verdade e o público é gente que nunca lutou.',
    'Sua primeira luta é contra um garoto de dezessete anos com roupa cara e um Raticate que ele claramente não treinou.',
    'Ele perde em dois turnos e o pai dele fala alto demais no meio do salão.',
    'A segunda luta é diferente.'
  ],
  batalha:{dex:53, nivel:32, tipo:'treinador', treinador:'Cavalheiro Aurélio', fuga:false,
           timeExtra:[{dex:59, nivel:34}],
           vitoria:'c8_ganhou_torneio', derrota:'c8_perdeu_torneio', gameover:'gameover'}
},

c8_ganhou_torneio:{
  texto:[
    'Você ganha. O salão aplaude do jeito que gente rica aplaude — com as pontas dos dedos.',
    'A bolsa é entregue num envelope, em dinheiro.',
    'E enquanto você guarda o envelope, um homem de terno claro para do seu lado sem pedir licença.',
    '"Bonito." Ele olha o seu time, não você. "Eu compro."'
  ],
  ef:{dinheiro:9000, rep:{eixo:'bom',delta:1,motivo:'Venceu o torneio do S.S. Anne'},
      itens:{'Ultra Ball':2}, flag:'venceu_torneio'},
  escolhas:[
    {texto:'"Não está à venda."', vai:'c8_recusa_venda',
     ef:{rep:{eixo:'bom',delta:1,motivo:'Recusou vender o time diante da plateia'}, moral:10}},
    {texto:'"Quanto?"', vai:'c8_preco'},
    {texto:'"Quem é você?"', vai:'c8_quem_e'}
  ]
},

c8_perdeu_torneio:{
  texto:[
    'Você perde na segunda luta. O salão aplaude o vencedor e esquece você em nove segundos.',
    'Sentado fora da arena, alguém te estende uma toalha. É o homem de terno claro.',
    '"Time bom, treinador em formação." Ele senta do seu lado sem pedir licença. "Eu compro os dois."'
  ],
  ef:{dinheiro:1200},
  escolhas:[
    {texto:'"Não está à venda."', vai:'c8_recusa_venda',
     ef:{rep:{eixo:'bom',delta:1,motivo:'Recusou vender o time'}, moral:10}},
    {texto:'"Quanto?"', vai:'c8_preco'},
    {texto:'"Quem é você?"', vai:'c8_quem_e'}
  ]
},

c8_recusa_venda:{
  texto:[
    '"Não está à venda."',
    'Ele recebe isso com um sorriso que não muda nada no rosto.',
    '"Todo mundo diz isso." Ele ajeita o paletó. "E eu compro de quase todo mundo, seis meses depois, por menos."',
    '"Não é ameaça", ele acrescenta, e é verdade — é constatação, e é pior.',
    'Ele deixa um cartão na mesa ao lado sem te entregar na mão. Sem nome. Só um endereço em Celadon e um horário: depois das 23h.'
  ],
  ef:{flag:'cartao_celadon',
      npc:{nome:'Homem de terno claro', opiniao:0, memoria:'Ofereceu comprar seu time no S.S. Anne. Você recusou; ele deixou o cartão mesmo assim.'},
      registrar:'Recusou vender o time no S.S. Anne. Ficou com um endereço em Celadon.'},
  escolhas:[
    {texto:'Pegar o cartão mesmo assim.', vai:'c8_camarote'},
    {texto:'Deixar o cartão na mesa.', vai:'c8_camarote',
     ef:{limpaFlag:'cartao_celadon', rep:{eixo:'bom',delta:1,motivo:'Deixou o cartão do traficante em cima da mesa'}}}
  ]
},

c8_quem_e:{
  texto:[
    '"Ninguém importante." Ele sorri. "Eu compro e eu vendo. Kanto inteira compra e vende; eu só admito."',
    'Ele te dá um cartão. Sem nome. Só um endereço em Celadon e um horário: **depois das 23h**.',
    '"Se você mudar de ideia sobre qualquer coisa — qualquer coisa mesmo — aparece."'
  ],
  ef:{flag:'cartao_celadon', npc:{nome:'Homem de terno claro', opiniao:1, memoria:'Te deu um cartão com um endereço em Celadon.'},
      registrar:'Recebeu um endereço em Celadon, para depois das 23h.'},
  escolhas:[
    {texto:'Guardar o cartão.', vai:'c8_camarote'},
    {texto:'Rasgar o cartão na frente dele.', vai:'c8_rasgou',
     ef:{limpaFlag:'cartao_celadon', rep:{eixo:'bom',delta:1,motivo:'Recusou publicamente um traficante'},
         npc:{nome:'Homem de terno claro', opiniao:-4, memoria:'Você rasgou o cartão dele na cara dele, no salão.'}}}
  ]
},

c8_rasgou:{
  texto:[
    'Ele olha os pedaços no chão. Depois olha você, com um interesse genuinamente novo.',
    '"Ah, você é um desses." Ele se levanta e ajeita o paletó. "Eu gosto de vocês. Vocês duram menos, mas rendem histórias melhores."',
    'Ele vai embora. Você não viu a última vez que viu esse homem.'
  ],
  escolhas:[{texto:'Ir ao camarote 40.', vai:'c8_camarote'}]
},

c8_preco:{
  texto:[
    'Ele diz um número. O número é grotesco.',
    'Não é grotesco de tão baixo. É grotesco porque é alto o suficiente pra você hesitar, e ele sabia que seria, e é exatamente por isso que ele disse esse número e não outro.'
  ],
  escolhas:[
    {texto:'Vender um do time.', vai:'c8_vendeu_no_navio', vendaTime:true},
    {texto:'"Não." Depois de pensar. Que é pior do que não pensar.', vai:'c8_camarote',
     ef:{rep:{eixo:'bom',delta:1,motivo:'Hesitou, mas recusou'}, moral:-5, flag:'hesitou_vender'}}
  ]
},

c8_vendeu_no_navio:{
  texto:[
    'A transação acontece num salão com lustre, entre duas taças de champanhe.',
    'Ele guarda a bola no bolso interno do paletó, do lado do coração, o que é a piada mais cruel possível.',
    '"Prazer em fazer negócio." Ele te dá o cartão. "Celadon. Depois das 23h. Sempre tem mais."'
  ],
  ef:{flag:['cartao_celadon','vendeu_no_navio'],
      npc:{nome:'Homem de terno claro', opiniao:5, memoria:'Comprou um Pokémon seu no S.S. Anne. Ele te considera fornecedor.'}},
  escolhas:[{texto:'Ir ao camarote 40.', vai:'c8_camarote'}]
},

c8_porao:{
  texto:[
    'Você desce no meio da festa, quando o porão está vazio.',
    'Três caixas. Furo de ventilação. Etiqueta de destino: Celadon.',
    'Uma delas se mexe quando você chega perto.'
  ],
  ef:{flag:'achou_caixas'},
  escolhas:[
    {texto:'Abrir.', vai:'c8_abriu_caixa'},
    {texto:'Fotografar a etiqueta e sair.', vai:'c8_fotografou'},
    {texto:'Subir e fingir que não viu.', vai:'c8_camarote',
     ef:{rep:{eixo:'ruim',delta:1,motivo:'Viu a carga viva e deixou passar'}, flag:'ignorou_caixas'}}
  ]
},

c8_abriu_caixa:{
  texto:[
    'Dentro da primeira: cinco Pokémon, sedados, empilhados com espaçador de isopor entre eles como se fossem louça.',
    'Estão vivos. Três acordam devagar com a luz.',
    'A segunda caixa é igual. A terceira tem quatro e um espaço vazio, e o espaço vazio é a coisa que mais te incomoda no navio inteiro.'
  ],
  ef:{registrar:'Abriu as caixas do porão do S.S. Anne. Quatorze Pokémon sedados.'},
  escolhas:[
    {texto:'Soltar todos agora, no meio do oceano. Eles que se virem.', vai:'c8_soltou_caixas'},
    {texto:'Fechar, subir e denunciar ao capitão.', vai:'c8_capitao'},
    {texto:'Fechar e não fazer nada. Você está num navio no meio do mar.', vai:'c8_camarote',
     ef:{rep:{eixo:'ruim',delta:1,motivo:'Viu quatorze Pokémon em caixas e fechou a tampa'}, flag:'fechou_a_tampa'}}
  ]
},

c8_soltou_caixas:{
  texto:[
    'Você abre as três. Quatorze Pokémon sedados num porão de navio em movimento.',
    'Não vira uma fuga heroica. Vira caos: bicho drogado batendo em parede de aço, dois se machucando na escada, um caindo no compartimento de máquinas.',
    'O alarme toca em quatro minutos. A tripulação leva uma hora pra conter tudo.',
    'Nove são recapturados pela própria tripulação — e devolvidos às caixas. Três somem no navio. Dois morrem.',
    'Você fez alguma coisa. Foi melhor que nada e foi muito pior do que devia ter sido.'
  ],
  ef:{rep:{eixo:'bom',delta:1,motivo:'Libertou uma carga de Pokémon traficados — de um jeito desastroso'},
      flag:'soltou_carga', instabilidade:1,
      registrar:'Soltou a carga do porão. Dois Pokémon morreram no caos.'},
  escolhas:[{texto:'Sumir antes que perguntem.', vai:'c8_camarote'}]
},

c8_fotografou:{
  texto:[
    'Você fotografa a etiqueta, o furo, o interior. Três fotos. Sobe sem fazer barulho.',
    'Você não salvou ninguém hoje. Mas agora existe prova, e prova é uma coisa que sobrevive a você.'
  ],
  ef:{flag:'provas_navio', rep:{eixo:'bom',delta:1,motivo:'Documentou o tráfico no S.S. Anne'},
      registrar:'Guardou fotos das caixas do S.S. Anne.'},
  escolhas:[
    {texto:'Levar ao capitão.', vai:'c8_capitao'},
    {texto:'Guardar para usar em Celadon.', vai:'c8_camarote'}
  ]
},

c8_capitao:{
  texto:[
    'O capitão do S.S. Anne te recebe na cabine com uma xícara na mão e não se levanta.',
    'Ele ouve tudo. Olha as fotos, se você tiver. Depois fica em silêncio por bastante tempo.',
    '"Eu sei", ele diz.',
    'A xícara na mão dele não treme. "Esse navio faz doze travessias por ano. Em dez delas tem carga que eu não pergunto. Se eu perguntar, o navio para, setecentos empregos param, e a carga vai de caminhão, que é pior pra elas."',
    '"Isso é uma explicação, não uma desculpa. Eu sei a diferença. Eu escolhi a explicação faz nove anos."'
  ],
  ef:{npc:{nome:'Capitão do S.S. Anne', opiniao:0, memoria:'Admitiu, na sua frente, que sabe da carga viva há nove anos.'},
      flag:'capitao_admitiu', registrar:'O capitão admitiu que sabe do tráfico a bordo.'},
  escolhas:[
    {texto:'"Então eu conto pra quem não escolheu a explicação."', vai:'c8_vai_contar',
     ef:{rep:{eixo:'bom',delta:2,motivo:'Prometeu expor o tráfico do S.S. Anne'}, flag:'promessa_expor_navio'}},
    {texto:'"Quanto vale eu esquecer isso?"', vai:'c8_chantagem'},
    {texto:'Sair sem dizer nada.', vai:'c8_camarote', ef:{flag:'calou_sobre_navio'}}
  ]
},

c8_vai_contar:{
  texto:[
    'Ele assente devagar, como quem confirma uma previsão do tempo.',
    '"Vai." Ele finalmente bebe da xícara. "E quando nada acontecer, volta aqui e a gente conversa de novo."',
    'Você odeia que ele tenha dito isso, porque você já suspeitava.'
  ],
  escolhas:[{texto:'Sair.', vai:'c8_camarote'}]
},

c8_chantagem:{
  texto:[
    'O capitão te olha pela primeira vez com atenção total.',
    '"Ah." Uma pausa longa. "Você é rápido. Isso é uma pena."',
    'Ele abre uma gaveta e conta o dinheiro na mesa. Não discute o valor. Isso te diz exatamente quantas vezes ele já fez isso.'
  ],
  ef:{dinheiro:7000, rep:{eixo:'ruim',delta:3,motivo:'Chantageou o capitão do S.S. Anne'},
      flag:'chantageou_capitao',
      npc:{nome:'Capitão do S.S. Anne', opiniao:-5, memoria:'Você o chantageou. Ele pagou e anotou o seu nome.'},
      registrar:'Chantageou o capitão do S.S. Anne.'},
  escolhas:[{texto:'Sair com o envelope.', vai:'c8_camarote'}]
},

c8_camarote:{
  texto:[
    'O corredor dos camarotes é acarpetado e silencioso. O 40 continua com um segurança na porta.',
    d=>d.flags.uniforme_tripulacao ? 'De uniforme, você passa. O segurança até abre espaço — tripulação circula.' :
       d.flags.venceu_torneio ? 'O segurança te reconhece do torneio. Isso compra três segundos de indecisão.' :
       'O segurança te vê no fim do corredor e endireita as costas.'
  ],
  escolhas:[
    {texto:'Entrar direto.', vai:'c8_dentro_camarote', cond:d=>!!d.flags.uniforme_tripulacao},
    {texto:'Conversar com o segurança.', vai:'c8_segu'},
    {texto:'Esperar ele sair para fumar.', vai:'c8_esperar'},
    {texto:'Deixar pra lá. Ir dormir.', vai:'c8_fim_navio'}
  ]
},

c8_segu:{
  texto:['"Boa noite. Meu amigo tá no 40, ele me chamou."'],
  teste:{status:'carisma', dificuldade:8, nomeStatus:'Carisma',
         critico:'c8_dentro_camarote', sucesso:'c8_dentro_camarote', parcial:'c8_esperar', falha:'c8_segu_nao'}
},

c8_segu_nao:{
  texto:[
    '"Não tem amigo seu no 40."',
    'Ele não grita, não empurra. Só diz isso, e continua olhando pra você até você ir embora.',
    'Alguém dentro do camarote ouve a conversa. A porta é aberta um dedo, e fechada.'
  ],
  ef:{flag:'camarote_alertado'},
  escolhas:[
    {texto:'Esperar ele sair para fumar.', vai:'c8_esperar'},
    {texto:'Desistir.', vai:'c8_fim_navio'}
  ]
},

c8_esperar:{
  texto:[
    'Você espera duas horas e quarenta no fim do corredor, fingindo mexer no celular.',
    'Às 2h10 ele sai. Cinco minutos, no máximo.'
  ],
  ef:{flag:'entrou_de_madrugada'},
  escolhas:[{texto:'Entrar.', vai:'c8_dentro_camarote'}]
},

c8_dentro_camarote:{
  texto:[
    'O camarote 40 é uma suíte. Tem banheira. Tem varanda.',
    'E tem seis bolas numa caixa de veludo em cima da cama — a mesma caixa, do mesmo tipo, que você viu na ponte de Cerulean.',
    d=>d.flags.camarote_alertado ? 'A caixa está fechada, e alguém arrumou a cama depois de sair com pressa.' : 'A caixa está aberta.',
    'Na mesinha, um caderno de couro com lista de nomes, espécies e valores. E, na última página, uma anotação diferente das outras:',
    '"Celadon — 23h — entrega à Terceira. Confirmar o número de peças antes de descarregar."',
    '"Terceira" está com inicial maiúscula. Não é um número. É um nome.'
  ],
  ef:{flag:['viu_caderno_camarote','sabe_da_terceira'],
      registrar:'Descobriu que a carga é entregue em Celadon a alguém chamado "a Terceira".'},
  escolhas:[
    {texto:'Levar a caixa de veludo.', vai:'c8_roubou_caixa'},
    {texto:'Levar só o caderno — é a prova.', vai:'c8_pegou_caderno_couro',
     ef:{flag:'caderno_do_trafico', rep:{eixo:'bom',delta:1,motivo:'Roubou o livro-caixa de um traficante'}}},
    {texto:'Soltar os seis aqui, agora.', vai:'c8_soltou_camarote'},
    {texto:'Não tocar em nada. Saber já é o suficiente.', vai:'c8_fim_navio'}
  ]
},

c8_roubou_caixa:{
  texto:[
    'Você sai do camarote com seis Pokémon que não são seus e um caderno que também não é.',
    'No corredor, o segurança está voltando. Vocês se olham.',
    'Ele olha a caixa de veludo na sua mão. Depois olha a sua cara. Depois abre espaço.',
    '"Não vi nada", ele diz, e é a última coisa que ele diz nesta história.'
  ],
  ef:{flag:['roubou_a_caixa','caderno_do_trafico'],
      executar:d=>{
        const avisos=[];
        const opcoes=[52,58,63,66,84,96,104,109,116,118,123,127,137];
        for (let i=0;i<2;i++){
          const p = criarPokemon(Dados.escolher(opcoes), Dados.entre(22,30),
            {moral:15, historia:'Estava numa caixa de veludo no camarote 40 do S.S. Anne.'});
          Estado.adicionar(p);
          avisos.push({tipo:'pokemon', texto:`${p.nome} (Nv ${p.nivel}) — moral 15. Ele não sabe o que você é ainda.`});
        }
        avisos.push({tipo:'mundo', texto:'Os outros quatro você soltou no convés. Eles pularam no mar sem hesitar.'});
        return avisos;
      },
      rep:{eixo:'bom',delta:1,motivo:'Roubou a carga de um traficante'},
      npc:{nome:'Homem de terno claro', opiniao:-6, memoria:'Você roubou a caixa de veludo dele. Ele vai te procurar em Celadon.'},
      registrar:'Roubou a caixa de veludo do camarote 40.'},
  escolhas:[{texto:'Sumir do corredor.', vai:'c8_fim_navio'}]
},

c8_pegou_caderno_couro:{
  texto:[
    'Você deixa a caixa e leva o caderno.',
    'É a escolha mais difícil das duas, porque a caixa tem seis vidas dentro e o caderno tem só papel.',
    'Mas o caderno tem trinta e uma páginas de nomes, e cada nome é uma caixa em algum lugar.'
  ],
  escolhas:[{texto:'Sair.', vai:'c8_fim_navio'}]
},

c8_soltou_camarote:{
  texto:[
    'Você abre as seis na varanda do camarote, de frente pro mar aberto.',
    'Quatro pulam sem pensar. Um voa. O sexto fica — olha pra você, olha o mar, e não sai do lugar.',
    'Ele não sabe fazer mais nada. Passou tempo demais na caixa.'
  ],
  ef:{rep:{eixo:'bom',delta:2,motivo:'Libertou seis Pokémon de um traficante'},
      pokemon:{dex:137, nivel:26, opcoes:{moral:10, natureza:'Bashful', historia:'Não soube o que fazer quando você abriu a bola de frente pro mar.'}},
      flag:'soltou_camarote',
      npc:{nome:'Homem de terno claro', opiniao:-6, memoria:'Você soltou a mercadoria dele no mar.'},
      registrar:'Soltou os seis do camarote 40 no mar aberto.'},
  escolhas:[{texto:'Sair antes que voltem.', vai:'c8_fim_navio'}]
},

c8_fim_navio:{
  texto:[
    'O S.S. Anne atraca em Vermilion de novo ao amanhecer — ele faz a volta. Ninguém te falou isso.',
    'A carga desce por um portão lateral, em três caminhões, com destino escrito na lateral: CELADON.',
    d=>{
      if (d.flags.roubou_a_caixa) return 'Um dos caminhões parte antes dos outros, com pressa. Alguém já deu falta da caixa.';
      if (d.flags.provas_navio || d.flags.caderno_do_trafico) return 'Você tem prova no bolso. Prova sem lugar pra entregar ainda é só papel.';
      if (d.flags.chantageou_capitao) return 'Você tem sete mil no bolso e uma sensação estranha de que comprou alguma coisa, não vendeu.';
      return 'Você viu tudo e não tem nada nas mãos. Isso vai virar uma coisa que você conta em voz baixa, anos depois.';
    },
    'Celadon fica a dois dias a pé. Os caminhões chegam em quatro horas.'
  ],
  fim:true, resumo:'Capítulo 8 concluído — a carga vai para Celadon. E você também.'
},

c8_fim_porto:{
  texto:[
    'Você dorme no porto, embaixo de uma lona, com o time em volta.',
    'De madrugada, o S.S. Anne solta as amarras e sai. Da lona dá pra ver as janelas acesas indo embora.',
    'De manhã, três caminhões saem do portão de carga lateral com destino escrito na lateral: CELADON.',
    'Você não sabe o que tinha dentro. Você nunca vai saber com certeza, e vai suspeitar pelo resto da vida.'
  ],
  ef:{flag:'perdeu_o_navio', registrar:'Não embarcou no S.S. Anne.'},
  fim:true, resumo:'Capítulo 8 concluído — o navio foi embora sem você.'
}
}},

/* ══════════════════════════════════════════════════════════
   CAPÍTULO 9 — A CIDADE QUE COMPRA
   PONTO DE VIRADA: aqui a sua rota é definida.
   ══════════════════════════════════════════════════════════ */
{
num:9, titulo:'A Cidade que Compra', local:'Celadon', ambiente:'cidade', nivelArea:32,
tom:'muito sombrio', inicio:'c9_chegada',
proximo:d=>{
  // a rota escolhida aqui muda o que vem depois
  if (d.via === 'foragido') return 10;
  return 10;
},
cenas:{

c9_chegada:{
  texto:[
    'Celadon é a maior cidade de Kanto e a única que não finge ser outra coisa.',
    'O shopping tem sete andares. O cassino tem três. A diferença entre os dois é menos clara do que deveria.',
    d=>{
      const r = Estado.nomeRep();
      if (Estado.rep.eixo==='bom' && Estado.rep.bom>=5) return `Numa banca de jornal, seu nome aparece num canto de página três. "${r}", diz alguém no ponto de ônibus, apontando com o queixo. Não é elogio nem ofensa. É só constatação.`;
      if (Estado.rep.eixo==='ruim' && Estado.rep.ruim>=5) return 'Um guarda de shopping fala no rádio quando você entra. Ele te segue a quinze metros pelo térreo inteiro.';
      return 'Cidade grande tem essa gentileza: ninguém tem tempo de saber quem você é.';
    },
    d=>d.flags.roubou_a_caixa ? 'E em algum lugar desta cidade tem um homem de terno claro contando uma caixa de veludo que está faltando.' :
       d.flags.sabe_da_terceira ? 'Em algum lugar desta cidade, às 23h, alguém chamado "a Terceira" vai receber três caminhões.' :
       'Três caminhões de Vermilion descarregaram aqui hoje de manhã. Você não sabe onde.'
  ],
  ef:{registrar:'Chegou a Celadon.'},
  escolhas:[
    {texto:'Ir ao endereço do cartão. (depois das 23h)', vai:'c9_endereco', cond:d=>!!d.flags.cartao_celadon},
    {texto:'Procurar os caminhões. Alguém viu onde descarregaram.', vai:'c9_procurar'},
    {texto:'Ir ao cassino. Tudo em Celadon passa pelo cassino.', vai:'c9_cassino'},
    {texto:'Ligar para a Dra. Ivone.', vai:'c9_ivone', cond:d=>!!d.flags.cartao_ivone},
    {texto:'Entregar o que você tem à Liga Pokémon.', vai:'c9_liga_celadon',
     cond:d=>!!(d.flags.provas_navio||d.flags.caderno_do_trafico)}
  ]
},

c9_procurar:{
  texto:['Você passa a tarde perguntando. Em cidade grande, perguntar é um esporte de risco.'],
  teste:{status:'percepcao', dificuldade:7, nomeStatus:'Percepção',
         critico:'c9_achou_deposito', sucesso:'c9_achou_deposito', parcial:'c9_achou_meio', falha:'c9_perdido'}
},

c9_achou_deposito:{
  texto:[
    'Um entregador de gás te dá em três minutos o que a sua tarde inteira não deu: o depósito atrás do cassino, rua de serviço, portão azul.',
    '"Chega caminhão de madrugada e sai de madrugada. Todo mês." Ele dá de ombros. "Ninguém pergunta porque paga bem não perguntar."'
  ],
  ef:{flag:'sabe_do_deposito'},
  escolhas:[{texto:'Ir ao depósito.', vai:'c9_deposito'}]
},

c9_achou_meio:{
  texto:[
    'Você descobre a região — atrás do cassino, na zona de serviço — mas não o prédio.',
    'E descobre também que perguntar demais em Celadon faz alguém perguntar de volta.',
    'Um homem que você nunca viu pergunta o seu nome num ponto de ônibus. Você não responde. Ele anota alguma coisa mesmo assim.'
  ],
  ef:{flag:['sabe_da_zona','foi_notado_celadon']},
  escolhas:[
    {texto:'Procurar mais.', vai:'c9_deposito'},
    {texto:'Recuar e ir ao cassino.', vai:'c9_cassino'}
  ]
},

c9_perdido:{
  texto:[
    'Você passa seis horas andando e não descobre nada.',
    'Descobre uma coisa, na verdade: que as pessoas em Celadon respondem muito rápido, muito educadamente, e sem dizer absolutamente nada.',
    'À noite, um bilhete aparece embaixo da porta do seu quarto no Centro Pokémon.',
    '"Para de perguntar. Isso é um favor. O próximo não é."'
  ],
  ef:{flag:'ameacado_celadon', rep:{eixo:'ruim',delta:0,motivo:''},
      registrar:'Recebeu uma ameaça escrita em Celadon.'},
  escolhas:[
    {texto:'Ignorar o bilhete e continuar.', vai:'c9_cassino', ef:{flag:'ignorou_ameaca'}},
    {texto:'Parar. Tem hora de parar.', vai:'c9_desistiu'}
  ]
},

c9_desistiu:{
  texto:[
    'Você para. Não é covardia — é aritmética: você tem quinze anos e eles têm uma cidade.',
    'Você fica três dias em Celadon fazendo coisa nenhuma. Treina no parque. Compra roupa nova. Dorme.',
    'No terceiro dia, na primeira página do jornal de Celadon: um depósito na zona de serviço pegou fogo. Sem vítimas humanas.',
    '"Sem vítimas humanas" é uma expressão que você vai ouvir de forma diferente pelo resto da vida.'
  ],
  ef:{flag:'recuou_celadon', instabilidade:1,
      rep:{eixo:'ruim',delta:1,motivo:'Recuou quando tinha informação e podia agir'},
      registrar:'Recuou em Celadon. O depósito queimou com a carga dentro.'},
  escolhas:[{texto:'Seguir viagem.', vai:'c9_fim'}]
},

c9_cassino:{
  texto:[
    'O Rocket Game Corner mudou de nome duas vezes desde que a Rocket caiu. Agora se chama "Celadon Palace" e tem a mesma carpete.',
    'Todo mundo aqui sabe de tudo e não fala nada, de graça.',
    'A gerente do salão é uma mulher de uns quarenta anos que anda pelo cassino como se fosse a sala da casa dela. Porque é.',
    'Ela para na sua frente antes de você decidir se quer falar com ela.',
    '"Você é o de Pewter." Ela acende um cigarro dentro de um lugar onde não se pode fumar. "Ou o do Monte da Lua. As histórias se misturam."'
  ],
  ef:{npc:{nome:'A Terceira', opiniao:0, memoria:'Te abordou no cassino de Celadon antes de você abordá-la.'},
      flag:'conheceu_terceira', registrar:'Conheceu a mulher que comanda o esquema de Celadon.'},
  escolhas:[
    {texto:'"Você é a Terceira."', vai:'c9_terceira_sim', cond:d=>!!d.flags.sabe_da_terceira},
    {texto:'"Quem é você?"', vai:'c9_quem_terceira'},
    {texto:'Atacar. Sem conversa.', vai:'c9_ataque_cedo'},
    {texto:'Sair do cassino.', vai:'c9_chegada'}
  ]
},

c9_quem_terceira:{
  texto:[
    '"Terceira." Ela solta a fumaça pro lado. "Não é apelido de origem interessante. Giovanni era o primeiro. O segundo durou nove meses."',
    '"Eu sou a terceira. E, diferente dos dois, eu não quero Kanto. Kanto dá muito trabalho."',
    '"Eu quero logística."'
  ],
  ef:{flag:'sabe_da_terceira'},
  escolhas:[
    {texto:'Ouvir o resto.', vai:'c9_proposta_terceira'},
    {texto:'Atacar.', vai:'c9_ataque_cedo'}
  ]
},

c9_terceira_sim:{
  texto:[
    'Ela não nega, não confirma, não muda de expressão.',
    '"Você andou lendo caderno dos outros." A brasa do cigarro sobe. "Isso é educação ruim e instinto bom."',
    '"Senta. Eu explico o negócio inteiro pra você em quatro minutos, porque gente informada toma decisão melhor, e eu prefiro gente que decidiu a gente que obedeceu."'
  ],
  escolhas:[{texto:'Sentar.', vai:'c9_proposta_terceira'}]
},

c9_proposta_terceira:{
  texto:[
    '"A Rocket caiu porque queria governar. Governo é caro."',
    '"O que sobrou é isso aqui: uma rede de distribuição. Pokémon sai de rota e chega em coleção particular. Fóssil sai de caverna e chega em leilão. Ninguém morre, ninguém apanha, ninguém faz discurso."',
    '"Isso é crime? É. Isso é pior que o que a Liga faz quando confisca um bicho e deixa ele três anos num depósito legalizado? Não."',
    'Ela apaga o cigarro numa xícara.',
    d=>{
      if (d.flags.trabalhou_rocket) return '"E você já carregou caixa pra mim uma vez, no Monte da Lua. Você só não sabia que era pra mim."';
      if (d.flags.destruiu_operacao || d.flags.expos_operacao) return '"E você já me custou uma operação inteira no Monte da Lua. Eu sei quem você é. Estou falando com você mesmo assim — isso devia te dizer alguma coisa."';
      return '"E você chegou até aqui sozinho, com quinze anos. Isso é currículo."';
    },
    '"Eu tenho três coisas pra te oferecer. Escolhe uma, ou escolhe nenhuma e a gente se despede sem drama."'
  ],
  escolhas:[
    {texto:'"Trabalhar pra você." — dinheiro, rotas, proteção.', vai:'c9_via_mercenario'},
    {texto:'"Nada. Eu vim acabar com isso." — e sair para atacar o depósito.', vai:'c9_via_heroi'},
    {texto:'"Me dá tudo. Eu quero o lugar." — a rede inteira.', vai:'c9_via_foragido'},
    {texto:'"Só quero entender." — perguntar, anotar, não escolher lado.', vai:'c9_via_pesquisador'},
    {texto:'Levantar e ir embora sem responder.', vai:'c9_neutro'}
  ]
},

/* ---------------- AS QUATRO ROTAS ---------------- */

c9_via_mercenario:{
  texto:[
    'Ela não comemora. Empurra um envelope pela mesa como quem paga uma conta.',
    '"Regra única: você não pergunta o que tem na caixa, e eu não pergunto o que você faz com o dinheiro."',
    '"Você vai carregar em rota, porque treinador em rota é invisível. Você vai ter proteção nas cidades. E se a Liga te parar, você me liga antes de abrir a boca."',
    'O envelope é grosso. O primeiro sempre é.'
  ],
  ef:{dinheiro:12000, itens:{'Ultra Ball':3,'Hyper Potion':3,'Full Heal':2},
      rep:{eixo:'ruim',delta:3,motivo:'Entrou para a rede de tráfico de Celadon'},
      flag:['via_definida','trabalha_para_terceira'], moral:-20,
      npc:{nome:'A Terceira', opiniao:5, memoria:'Você trabalha para ela desde Celadon.'},
      executar:d=>{ Historia.definirVia('mercenario','entrou para a rede da Terceira'); return [{tipo:'mundo', texto:'ROTA: Mercenário. Cidades vão te tratar como alguém que se resolve com dinheiro.'}]; },
      registrar:'Entrou para a rede da Terceira como transportador.'},
  escolhas:[{texto:'Guardar o envelope.', vai:'c9_fim'}]
},

c9_via_heroi:{
  texto:[
    '"Eu vim acabar com isso."',
    'Ela ouve a frase inteira sem interromper. Depois faz uma coisa que você não esperava: ela diz onde é.',
    '"Zona de serviço, portão azul, atrás daqui. Vai hoje, porque amanhã de manhã descarrega e eu não vou poder te prometer nada."',
    '"Eu não vou te ajudar. Mas eu não vou te esconder o endereço, porque se você morrer num beco procurando, isso dá mais problema pra mim do que o depósito inteiro."',
    'Ela acende outro cigarro. "Boa sorte. Sério."'
  ],
  ef:{flag:['via_definida','sabe_do_deposito','terceira_te_respeita'],
      rep:{eixo:'bom',delta:2,motivo:'Recusou a rede de Celadon na cara da chefe'},
      npc:{nome:'A Terceira', opiniao:1, memoria:'Você recusou o emprego e ela te deu o endereço mesmo assim.'},
      executar:d=>{ Historia.definirVia('heroi','recusou a rede e foi atrás do depósito'); return [{tipo:'mundo', texto:'ROTA: Herói. As pessoas vão passar a esperar que você apareça quando tudo der errado.'}]; }},
  escolhas:[{texto:'Ir ao depósito.', vai:'c9_deposito'}]
},

c9_via_foragido:{
  texto:[
    '"Me dá tudo. Eu quero o lugar."',
    'O cassino continua barulhento em volta de vocês dois. Ela não pisca.',
    '"Você tem quinze anos."',
    '"E você tem uma rede que sobreviveu à queda da Rocket porque é pequena. Pequena demais pra uma pessoa só defender."',
    'Silêncio. Ela apaga o cigarro.',
    '"Certo." Ela se levanta. "Aqui é como funciona: eu não entrego nada. Você toma. Se você tomar, é seu — e todo mundo que trabalha pra mim vai trabalhar pra você amanhã, porque ninguém aqui é leal, todo mundo aqui é pago."',
    '"O depósito é atrás daqui. Portão azul. Vai lá tomar."'
  ],
  ef:{flag:['via_definida','sabe_do_deposito','quer_a_rede'],
      rep:{eixo:'ruim',delta:2,motivo:'Anunciou que vai tomar uma rede criminosa para si'},
      npc:{nome:'A Terceira', opiniao:-2, memoria:'Você disse, na cara dela, que queria o lugar dela.'},
      executar:d=>{ Historia.definirVia('foragido','anunciou que quer a rede'); return [{tipo:'mundo', texto:'ROTA: Foragido. Você não vai ser tratado como treinador de novo.'}]; }},
  escolhas:[{texto:'Ir ao depósito.', vai:'c9_deposito'}]
},

c9_via_pesquisador:{
  texto:[
    '"Só quero entender."',
    'Ela ri — de verdade, curto, surpresa. "Essa é nova."',
    '"Então entende: nada disso funcionaria se não tivesse comprador. Você acha que eu sou o problema? Eu sou o meio de campo."',
    '"O problema é um senhor de Saffron que quer um Kabutops na sala porque o vizinho tem. O problema é uma empresa que precisa de material biológico e não quer assinar formulário."',
    'Ela escreve dois endereços num guardanapo. Um é o depósito. O outro é um prédio em Saffron.',
    '"Vai nos dois. Depois volta aqui e me diz qual dos dois te assustou mais. Eu tenho uma aposta comigo mesma."'
  ],
  ef:{flag:['via_definida','sabe_do_deposito','sabe_da_silph','guardanapo_terceira'],
      rep:{eixo:'bom',delta:1,motivo:'Escolheu entender antes de julgar'},
      npc:{nome:'A Terceira', opiniao:3, memoria:'Você disse que só queria entender. Ela achou isso interessante demais para mentir.'},
      executar:d=>{ Historia.definirVia('pesquisador','escolheu entender a rede inteira'); return [{tipo:'mundo', texto:'ROTA: Pesquisador. Você vai enxergar coisas que os outros caminhos não mostram — e vai demorar mais para agir.'}]; },
      registrar:'Escolheu investigar em vez de escolher lado.'},
  escolhas:[
    {texto:'Ir ao depósito primeiro.', vai:'c9_deposito'},
    {texto:'Ir direto para Saffron.', vai:'c9_fim', ef:{flag:'pulou_deposito'}}
  ]
},

c9_neutro:{
  texto:[
    'Você levanta e vai embora no meio da frase dela.',
    'Ela não te impede. Não manda ninguém atrás. Só volta a andar pelo cassino como se a conversa nunca tivesse acontecido.',
    'Isso te incomoda mais do que ameaça incomodaria.'
  ],
  ef:{flag:'recusou_terceira', npc:{nome:'A Terceira', opiniao:0, memoria:'Você saiu no meio da conversa dela. Ela achou isso pouco interessante.'}},
  escolhas:[
    {texto:'Procurar o depósito por conta própria.', vai:'c9_procurar'},
    {texto:'Sair de Celadon.', vai:'c9_fim'}
  ]
},

c9_ataque_cedo:{
  texto:[
    'Você saca uma bola no meio do cassino.',
    'Três seguranças estão em cima de você antes da bola abrir. A mulher nem se mexe.',
    '"Aqui não", ela diz, sem irritação. "Tem câmera, tem cliente, tem seguro. Lá fora eu não me importo."',
    'Eles te levam pela porta de serviço e te deixam no beco. Sem violência — o que é assustador de um jeito próprio.'
  ],
  ef:{hp:-3, causa:'Expulso do cassino de Celadon', flag:'atacou_no_cassino',
      npc:{nome:'A Terceira', opiniao:-3, memoria:'Você sacou uma bola no salão dela. Ela te achou desorganizado.'}},
  escolhas:[
    {texto:'Procurar o depósito.', vai:'c9_procurar'},
    {texto:'Voltar e conversar direito.', vai:'c9_cassino'}
  ]
},

/* ---------------- O DEPÓSITO ---------------- */

c9_deposito:{
  texto:[
    'Zona de serviço, 23h40. Portão azul, sem placa, com câmera nova.',
    'Dá pra ouvir de fora: motor de gerador, e por baixo dele um som contínuo que não é máquina.',
    d=>Historia.via()==='foragido' ? 'Você não veio fechar isso. Você veio pegar isso. É uma diferença que muda tudo o que você vai fazer nos próximos vinte minutos.' :
       Historia.via()==='pesquisador' ? 'Você veio ver. Se você só ver, vai ter que viver com isso. Se você agir, vai perder o que ainda não entendeu.' :
       'São quatro pessoas lá dentro, no mínimo. Você é um.'
  ],
  escolhas:[
    {texto:'Entrar pela frente. Sem plano.', vai:'c9_frente'},
    {texto:'Procurar outra entrada.', vai:'c9_lateral'},
    {texto:'Esperar o caminhão chegar e entrar junto com a carga.', vai:'c9_caminhao'},
    {texto:'Chamar a Liga agora e esperar.', vai:'c9_liga_deposito'},
    {texto:'Ir embora.', vai:'c9_fim', ef:{flag:'desistiu_deposito', rep:{eixo:'ruim',delta:1,motivo:'Chegou até a porta e voltou'}}}
  ]
},

c9_lateral:{
  texto:['Você dá a volta no quarteirão procurando um jeito que não seja o portão azul.'],
  teste:{status:'percepcao', dificuldade:7, nomeStatus:'Percepção',
         critico:'c9_dentro_limpo', sucesso:'c9_dentro_limpo', parcial:'c9_dentro_visto', falha:'c9_frente'}
},

c9_caminhao:{
  texto:['O caminhão chega às 23h58. Você tem quatro segundos entre o portão abrir e o farol varrer a rua.'],
  teste:{status:'sorte', dificuldade:7, nomeStatus:'Sorte',
         critico:'c9_dentro_limpo', sucesso:'c9_dentro_limpo', parcial:'c9_dentro_visto', falha:'c9_dentro_visto'}
},

c9_dentro_limpo:{
  texto:[
    'Você entra sem ninguém ver.',
    'O depósito é maior por dentro. Prateleira industrial, empilhadeira, e no fundo — a parte que importa — três fileiras de gaiola em estrutura de aço, do chão ao teto.',
    'Quarenta e uma gaiolas. Você conta duas vezes porque não acredita na primeira.',
    'Numa mesa perto da porta: pranchetas com número de série, uma caixa de Poké Balls vazias e um livro de destino. Metade dos destinos é fora de Kanto.'
  ],
  ef:{flag:['dentro_do_deposito','contou_gaiolas'], registrar:'Entrou no depósito de Celadon. Quarenta e uma gaiolas.'},
  escolhas:[
    {texto:'Abrir todas as gaiolas de uma vez.', vai:'c9_abriu_tudo'},
    {texto:'Fotografar tudo e sair sem tocar em nada.', vai:'c9_documentou'},
    {texto:'Pegar o livro de destinos e sair.', vai:'c9_livro'},
    {texto:'Cortar a energia do prédio primeiro.', vai:'c9_energia'},
    {texto:'Assumir o lugar: chamar os funcionários e dar uma ordem.', vai:'c9_tomou', cond:d=>!!d.flags.quer_a_rede}
  ]
},

c9_dentro_visto:{
  texto:[
    'Você entra, e na terceira fileira de gaiolas alguém acende a luz do corredor.',
    '"Ô." Voz calma. "Você não é da equipe."',
    'Três homens. Um deles já tem a bola na mão.'
  ],
  ef:{flag:'dentro_do_deposito'},
  escolhas:[
    {texto:'Lutar.', vai:'c9_luta_deposito'},
    {texto:'"A Terceira me mandou." Blefar.', vai:'c9_blefe'},
    {texto:'Correr para as gaiolas e abrir o máximo que der.', vai:'c9_corrida_gaiolas'}
  ]
},

c9_frente:{
  texto:[
    'Você bate no portão azul.',
    'Silêncio de cinco segundos. Depois ele abre, e tem quatro pessoas do outro lado que claramente não esperavam ninguém bater.',
    '"Boa noite", diz o mais velho. Ele não parece bravo. Parece contrariado, como quem vai ter que refazer uma planilha.'
  ],
  escolhas:[
    {texto:'Lutar.', vai:'c9_luta_deposito'},
    {texto:'"A Terceira me mandou." Blefar.', vai:'c9_blefe'},
    {texto:'"Eu vim comprar." Blefar para o outro lado.', vai:'c9_blefe_comprador'}
  ]
},

c9_blefe:{
  texto:['"A Terceira me mandou."'],
  teste:{status:'carisma', dificuldade:8, nomeStatus:'Carisma',
         critico:'c9_blefe_ok', sucesso:'c9_blefe_ok', parcial:'c9_blefe_meio', falha:'c9_luta_deposito'}
},

c9_blefe_ok:{
  texto:[
    'Funciona. Funciona porque ninguém ali quer ser a pessoa que barrou alguém que a chefe mandou.',
    '"Ela podia avisar." O mais velho já está voltando pro que estava fazendo. "Fica longe da fileira C, tá com bicho novo e eles mordem."',
    'Você tem, talvez, dez minutos antes de alguém pensar melhor.'
  ],
  ef:{flag:['dentro_do_deposito','blefou_bem']},
  escolhas:[
    {texto:'Abrir todas as gaiolas de uma vez.', vai:'c9_abriu_tudo'},
    {texto:'Fotografar tudo e sair.', vai:'c9_documentou'},
    {texto:'Pegar o livro de destinos.', vai:'c9_livro'},
    {texto:'Cortar a energia.', vai:'c9_energia'}
  ]
},

c9_blefe_meio:{
  texto:[
    'Eles quase acreditam. "Quase" aqui significa que um deles sai da sala pra ligar.',
    'Você tem o tempo de uma ligação.'
  ],
  ef:{flag:['dentro_do_deposito','tempo_curto']},
  escolhas:[
    {texto:'Abrir as gaiolas agora, rápido.', vai:'c9_corrida_gaiolas'},
    {texto:'Cortar a energia.', vai:'c9_energia'},
    {texto:'Sair enquanto dá.', vai:'c9_saiu_cedo'}
  ]
},

c9_blefe_comprador:{
  texto:[
    '"Eu vim comprar."',
    'O mais velho te mede da cabeça ao pé — roupa de rota, mochila surrada, quinze anos.',
    '"Comprar." Ele não ri, o que é pior. "Com quê?"'
  ],
  escolhas:[
    {texto:'Mostrar o dinheiro. (precisa de 10.000 ₽)', vai:'c9_comprador_ok', cond:d=>d.jogador.dinheiro>=10000},
    {texto:'Blefar mais.', vai:'c9_blefe'},
    {texto:'Desistir do blefe e lutar.', vai:'c9_luta_deposito'}
  ]
},

c9_comprador_ok:{
  texto:[
    'Você mostra o maço. O clima muda instantaneamente — dinheiro é a única identidade que esse lugar reconhece.',
    'Eles te deixam andar entre as gaiolas escolhendo, com uma prancheta, como quem escolhe fruta.',
    'Quarenta e uma gaiolas. Você anda por todas. Isso vai ficar com você.'
  ],
  ef:{flag:['dentro_do_deposito','andou_entre_as_gaiolas']},
  escolhas:[
    {texto:'Comprar um. Tirar pelo menos um dali. (10.000 ₽)', vai:'c9_comprou_um'},
    {texto:'Fingir que desistiu, sair, e voltar pela lateral.', vai:'c9_lateral'},
    {texto:'Largar o dinheiro no chão e abrir todas as gaiolas.', vai:'c9_abriu_tudo',
     ef:{dinheiro:-10000, rep:{eixo:'bom',delta:2,motivo:'Trocou todo o dinheiro por um instante de caos'}}}
  ]
},

c9_comprou_um:{

  ef:{executar:d=>{ Estado.lend(145).encontros++; return []; },
      registrar:'Encontrou Zapdos na usina abandonada.'},
  escolhas:[
    {texto:'Sair de fininho. Não mexer com isso.', vai:'c10_saiu'},
    {texto:'Ficar parado e observar até ele terminar.', vai:'c10_observar_zapdos'},
    {texto:'Atacar. Uma ave lendária vale mais que um ano de jornada.', vai:'c10_zapdos'},
    {texto:'Oferecer comida.', vai:'c10_comida_zapdos', cond:d=>Estado.contaItem('Ração')>0},
    {texto:'Coletar os Voltorb parados — eles nem reagem.', vai:'c10_coleta',
     cond:d=>['mercenario','foragido'].includes(Historia.via())}
  ]
},

c10_coleta:{
  texto:[
    'Eles não reagem. Você pega um. Depois outro.',
    'Na terceira bola, um Magnemite do fundo do galpão vira lentamente a cabeça na sua direção.',
    'Depois todos viram. Todos os outros quarenta e poucos, ao mesmo tempo, com o mesmo som de servo motor.',
    'Eles não atacam. Só olham. E lá em cima, na viga, Zapdos para de carregar.'
  ],
  ef:{flag:'coletou_na_usina',
      executar:d=>{
        const avisos=[];
        for (let i=0;i<2;i++){
          const p = criarPokemon(Dados.escolher([100,81]), Dados.entre(28,34),
            {moral:10, historia:'Recolhido do chão da usina enquanto olhava para Zapdos.'});
          Estado.adicionar(p);
          avisos.push({tipo:'pokemon', texto:`${p.nome} (Nv ${p.nivel}) foi recolhido. Ele não resistiu, o que é pior.`});
        }
        const L=Estado.lend(145); L.disposicao='hostil';
        avisos.push({tipo:'perigo', texto:'Zapdos parou de carregar. Ele te viu fazer isso.'});
        return avisos;
      },
      rep:{eixo:'ruim',delta:2,motivo:'Recolheu Pokémon paralisados como quem cata sucata'},
      registrar:'Coletou Pokémon indefesos na usina, na frente de Zapdos.'},
  escolhas:[{texto:'Encarar o que vem.', vai:'c10_zapdos'}]
},

c10_observar_zapdos:{
  texto:[
    'Você senta no chão do galpão, entre os Voltorb, e espera.',
    'Leva quarenta minutos. Zapdos puxa energia do prédio inteiro em ciclos — a luz das lâmpadas de emergência apaga e acende no ritmo dele.',
    'Quando termina, ele desce da viga. Anda pelo chão como uma ave comum, entre os Voltorb, que abrem espaço.',
    'Ele passa a três metros de você. Vira a cabeça. Olha.',
    'Depois sai pelo buraco do teto, e o galpão inteiro escurece de uma vez.'
  ],
  ef:{executar:d=>{ const L=Estado.lend(145); if(L.disposicao!=='hostil') L.disposicao='passivo';
        return [{tipo:'mundo', texto:'Zapdos te considera parte da paisagem. Isso é o mais perto de aprovação que uma ave lendária chega.'}]; },
      rep:{eixo:'bom',delta:2,motivo:'Encontrou uma Ave Lendária e escolheu só olhar'},
      flag:'respeitou_zapdos', registrar:'Observou Zapdos carregar e não interferiu.'},
  escolhas:[{texto:'Sair da usina.', vai:'c10_depois'}]
},

c10_comida_zapdos:{
  texto:[
    'Você coloca a ração no chão de concreto e recua.',
    'Zapdos olha a comida do alto da viga por um tempo humilhante.',
    'Depois desce — não pela comida. Ele pousa do lado da ração, ignora completamente, e olha pra você.',
    'Ele não come ração. Ele come corrente elétrica. O gesto não significou nada pra ele.',
    'E ainda assim ele desceu. Ele desceu porque alguém tentou.'
  ],
  ef:{executar:d=>{ Estado.usarItem('Ração'); const L=Estado.lend(145); if(L.disposicao!=='hostil') L.disposicao='passivo'; return []; },
      rep:{eixo:'bom',delta:1,motivo:'Tentou um gesto inútil e sincero com um lendário'},
      flag:'zapdos_desceu'},
  escolhas:[
    {texto:'Ficar parado.', vai:'c10_observar_zapdos'},
    {texto:'Aproveitar que ele desceu e jogar a bola.', vai:'c10_traicao_zapdos'}
  ]
},

c10_traicao_zapdos:{
  texto:[
    'Você joga a bola no segundo em que ele baixa a guarda.',
    'Não importa se prende. O gesto já aconteceu, e ele já entendeu o que foi.'
  ],
  ef:{executar:d=>{ const L=Estado.lend(145); L.disposicao='hostil'; L.ataquesSofridos+=2; return []; },
      rep:{eixo:'ruim',delta:2,motivo:'Traiu a confiança de um lendário'},
      flag:'traiu_zapdos'},
  escolhas:[{texto:'Encarar o que vem.', vai:'c10_zapdos'}]
},

c10_zapdos:{
  texto:[
    'O galpão inteiro se ilumina de baixo pra cima.',
    'Os Voltorb no chão começam a brilhar em sequência, como uma pista de pouso, e todos apontam pra você.'
  ],
  batalha:{dex:145, nivel:50, tipo:'lendario', fuga:true, ambiente:'ruina',
           vitoria:'c10_pos_zapdos', derrota:'c10_pos_zapdos', fuga2:'c10_fugiu_zapdos',
           captura:'c10_capturou_zapdos', gameover:'gameover'}
},

c10_pos_zapdos:{
  texto:[
    'Ele volta pra viga. Não terminou, não fugiu, não perdeu — só voltou a fazer o que estava fazendo.',
    'Para uma coisa como Zapdos, você foi uma interrupção. Não uma ameaça.',
    'Isso devia ser humilhante e, por algum motivo, é um alívio.'
  ],
  ef:{executar:d=>{
        const L=Estado.lend(145); L.ataquesSofridos++;
        if (L.ataquesSofridos>=2){ L.disposicao='hostil'; return [{tipo:'perigo', texto:'Zapdos passou a te caçar. Céu limpo não é mais seguro pra você.'}]; }
        return [];
      },
      rep:{eixo:'ruim',delta:1,motivo:'Atacou uma Ave Lendária'}},
  escolhas:[
    {texto:'Tentar de novo.', vai:'c10_zapdos'},
    {texto:'Parar.', vai:'c10_depois'}
  ]
},

c10_fugiu_zapdos:{
  texto:[
    'Você corre pelo pátio com o cabelo em pé e o gosto de metal na boca.',
    'Ele não persegue. Aves lendárias não perseguem — elas lembram.'
  ],
  escolhas:[{texto:'Sair da usina.', vai:'c10_depois'}]
},

c10_capturou_zapdos:{
  texto:[
    'A bola fecha e os quarenta e poucos Voltorb do chão apagam ao mesmo tempo.',
    'O galpão fica escuro, silencioso, e — pela primeira vez em onze anos — desligado de verdade.',
    'Lá fora, no céu limpo, uma nuvem começa a se formar exatamente sobre a usina. E outra no norte. E outra no sul.'
  ],
  ef:{instabilidade:2, registrar:'Capturou Zapdos na usina.'},
  escolhas:[
    {texto:'Soltar. Agora, antes de sair daqui.', vai:'c10_soltou_zapdos'},
    {texto:'Sair com ele.', vai:'c10_depois', ef:{flag:'levou_zapdos'}}
  ]
},

c10_soltou_zapdos:{
  texto:['Você abre a bola apontando pro buraco do teto.'],
  ef:{executar:d=>{
        const p=[...d.time,...d.pc].find(x=>x.dex===145);
        return p ? Captura.soltar(p).map(e=>({tipo:e.tipo,texto:e.texto})) : [];
      }},
  escolhas:[{texto:'Sair.', vai:'c10_depois'}]
},

c10_saiu:{
  texto:[
    'Você sai de costas, devagar, sem tirar o olho da viga.',
    'Nenhum dos Voltorb reage à sua saída. Eles nem sabiam que você estava lá.',
    'No portão, você olha pra trás uma última vez e entende uma coisa: aquilo não estava escondido. Estava só num lugar onde ninguém vai.'
  ],
  ef:{flag:'saiu_da_usina', rep:{eixo:'bom',delta:1,motivo:'Encontrou um lendário e escolheu não mexer'}},
  escolhas:[{texto:'Seguir.', vai:'c10_depois'}]
},

c10_depois:{
  texto:[
    'No portão da usina tem alguém esperando.',
    d=>{
      const via = Historia.via();
      if (via==='mercenario' || via==='foragido') return 'Dois homens com uma van. "A Terceira mandou perguntar se deu certo." Eles olham a sua mochila. Eles sabem contar bolas.';
      if (via==='pesquisador') return 'A Dra. Ivone, encostada num carro emprestado, com uma garrafa térmica. "Eu vi o relâmpago da estrada. Sobe aí, você tá com cara de quem precisa sentar."';
      if (via==='heroi') return 'Três pessoas de Cerulean, que vieram a pé, porque alguém falou que tinha um treinador na usina. Eles não sabem o que perguntar. Só queriam saber se era verdade.';
      return 'Um técnico da companhia elétrica, aposentado, que vem aqui uma vez por mês por conta própria. "Você viu?" Ele não precisa dizer o quê.';
    }
  ],
  escolhas:[
    {texto:'Contar tudo.', vai:'c10_contou',
     ef:{rep:{eixo:'bom',delta:1,motivo:'Contou a verdade sobre o que viu na usina'}}},
    {texto:'Mentir.', vai:'c10_mentiu', ef:{flag:'mentiu_sobre_usina'}},
    {texto:'Não dizer nada e seguir andando.', vai:'c10_fim'}
  ]
},

c10_contou:{
  texto:[
    'Você conta. Sem enfeitar.',
    'Quem está ouvindo reage de um jeito que você não esperava: ninguém duvida. Nem por um segundo.',
    '"A gente sabia", diz um deles. "A gente só não tinha quem falasse."'
  ],
  ef:{flag:'contou_da_usina', registrar:'Contou publicamente o que viu na usina.'},
  escolhas:[{texto:'Seguir para Saffron.', vai:'c10_fim'}]
},

c10_mentiu:{
  texto:[
    '"Não tinha nada lá."',
    'Eles aceitam. Ou fingem aceitar, o que num contexto desses dá exatamente no mesmo.',
    'Você segue estrada com a sensação estranha de ter roubado uma coisa que não era sua: a certeza deles.'
  ],
  ef:{rep:{eixo:'ruim',delta:1,motivo:'Mentiu sobre o que viu na usina'}},
  escolhas:[{texto:'Seguir para Saffron.', vai:'c10_fim'}]
},

c10_fim:{
  texto:[
    'A estrada pra Saffron atravessa a Rota 5 e é a única de Kanto com asfalto o caminho inteiro.',
    'Saffron aparece antes do que você espera — e aparece por cima: os prédios são visíveis de dezenove quilômetros.',
    'O mais alto deles é azul e tem o logotipo da Silph no topo.',
    d=>d.flags.sabe_do_andar_11 ? 'Você conta os andares da estrada, andando. Conta dez. Conta de novo. Dez.' : 'Você conta os andares da estrada, sem motivo nenhum. Dez.'
  ],
  fim:true, resumo:'Capítulo 10 concluído — a usina te mostrou que os lendários não estão escondidos.'
}
}},

/* ══════════════════════════════════════════════════════════
   CAPÍTULO 11 — A TORRE DE VIDRO
   ══════════════════════════════════════════════════════════ */
{
num:11, titulo:'A Torre de Vidro', local:'Saffron / Silph Co.', ambiente:'cidade', nivelArea:38,
tom:'muito sombrio', inicio:'c11_saffron',
cenas:{

c11_saffron:{
  texto:[
    'Saffron não tem rota, não tem mato, não tem rio. É concreto até onde a vista alcança.',
    'A Silph Co. ocupa um quarteirão inteiro. Recepção com catraca, crachá, câmera, e uma mulher no balcão que atende com um sorriso impecável.',
    'E o ginásio de Saffron está fechado há três semanas, com um papel na porta: "SUSPENSO POR TEMPO INDETERMINADO — S."',
    d=>{
      const via = Historia.via();
      if (via==='pesquisador') return 'Você tem um guardanapo com o número 11 e um livro que diz SPH-11 sete vezes. É o suficiente pra saber onde procurar e insuficiente pra qualquer outra coisa.';
      if (via==='mercenario') return 'A Terceira te mandou fazer uma entrega aqui. Você é o entregador. Você tem acesso pela doca de carga — o que é mais do que a Liga conseguiu em nove meses.';
      if (via==='foragido') return 'Você herdou um cliente quando herdou a rede. O cliente é este prédio. Você veio renegociar.';
      if (via==='heroi') return 'Você não tem crachá, não tem mandado e não tem plano. Tem um livro de destinos e raiva suficiente pra atravessar uma catraca.';
      return 'Você não sabe direito por que veio. Sabe que veio.';
    }
  ],
  ef:{registrar:'Chegou a Saffron.'},
  escolhas:[
    {texto:'Entrar pela recepção, na cara de pau.', vai:'c11_recepcao'},
    {texto:'Entrar pela doca de carga.', vai:'c11_doca'},
    {texto:'Procurar o ginásio fechado primeiro.', vai:'c11_ginasio'},
    {texto:'Procurar quem trabalha lá — bar, ponto de ônibus, fila do almoço.', vai:'c11_funcionarios'}
  ]
},

c11_ginasio:{
  texto:[
    'O ginásio de Saffron é um prédio baixo e sem janela, encaixado entre dois arranha-céus.',
    'A porta está trancada. Mas a luz interna está acesa.',
    'Você bate. Ninguém responde por dois minutos inteiros. Depois a fechadura gira sozinha — do outro lado, sem ninguém tocando nela.',
    'Uma voz de mulher, dentro da sua cabeça, sem passar pelos ouvidos:',
    '"Você está pensando muito alto. Entra antes que a rua toda ouça."'
  ],
  ef:{flag:'entrou_no_ginasio_saffron'},
  escolhas:[{texto:'Entrar.', vai:'c11_sabrina'}]
},

c11_sabrina:{
  texto:[
    'Sabrina está sentada no chão do centro da arena, de olhos abertos, e não se levanta.',
    '"Eu fechei o ginásio porque não consigo mais separar." Ela diz isso sem drama, como quem relata sintoma pro médico.',
    '"Todo pensamento neste quarteirão chega em mim. Todos. Ao mesmo tempo. E tem um andar naquele prédio ali onde os pensamentos estão errados."',
    '"Não maus. Errados. Como uma frase com a gramática quebrada. Doze vozes falando na primeira pessoa do plural sobre uma coisa que é singular."',
    'Ela finalmente te olha. "Você veio por causa do andar onze."'
  ],
  ef:{npc:{nome:'Sabrina', opiniao:2, memoria:'Fechou o ginásio porque o andar 11 da Silph não a deixa em paz.'},
      flag:['sabe_do_andar_11','sabrina_avisou'],
      registrar:'Sabrina confirmou: existe um andar 11 na Silph e os pensamentos de lá estão "errados".'},
  escolhas:[
    {texto:'"Me ajuda a entrar."', vai:'c11_sabrina_ajuda'},
    {texto:'"O que tem lá?"', vai:'c11_sabrina_oque'},
    {texto:'"Por que você não entra você mesma?"', vai:'c11_sabrina_porque'}
  ]
},

c11_sabrina_oque:{
  texto:[
    '"Doze." Ela diz o número devagar. "Doze mentes que acham que são uma."',
    '"Eles não sabem que são doze. Cada um acha que é o único e que os outros onze são lembrança dele mesmo."',
    '"E tem uma décima terceira coisa lá, que não é mente, que é... molde. Como uma forma de gelatina. Eles estão sendo despejados nela."',
    'Ela para. "Eu já disse isso em voz alta pra três pessoas. Você é a primeira que não me perguntou se eu tenho dormido bem."'
  ],
  ef:{flag:'sabe_dos_doze'},
  escolhas:[
    {texto:'"Me ajuda a entrar."', vai:'c11_sabrina_ajuda'},
    {texto:'"Por que você não entra você mesma?"', vai:'c11_sabrina_porque'}
  ]
},

c11_sabrina_porque:{
  texto:[
    '"Porque se eu entrar, eu escuto de perto." Ela fala isso com um medo muito específico, de quem sabe exatamente o que teme.',
    '"Eu sou boa nisso. Boa demais. Se eu chegar a dez metros dos doze, eu viro a décima terceira."',
    '"Você não é psíquico. Você é surdo pra isso. É a sua melhor qualidade hoje."'
  ],
  escolhas:[{texto:'"Então me ajuda a entrar."', vai:'c11_sabrina_ajuda'}]
},

c11_sabrina_ajuda:{
  texto:[
    'Ela levanta pela primeira vez. Tira um crachá do bolso — crachá de manutenção, vencido, com foto de um homem de sessenta anos.',
    '"Isso era do zelador do prédio. Ele me deu e pediu demissão no mesmo dia."',
    '"Uma coisa mais." Ela encosta dois dedos na sua testa, rápido, antes que você recue. "Pronto. Se você ficar sem saber quem você é lá dentro, vai lembrar de uma coisa idiota e específica e isso vai te trazer de volta."',
    '"Qual coisa?"',
    '"Você vai descobrir. Tem que ser surpresa, senão não funciona."'
  ],
  ef:{flag:['crachas_sabrina','ancora_mental'], itens:{'Full Heal':2},
      npc:{nome:'Sabrina', opiniao:5, memoria:'Te deu o crachá do zelador e uma âncora mental antes de você subir.'},
      rep:{eixo:'bom',delta:1,motivo:'Conseguiu a confiança da líder de Saffron'}},
  escolhas:[{texto:'Ir para a Silph.', vai:'c11_recepcao'}]
},

c11_funcionarios:{
  texto:[
    'A fila da lanchonete em frente à Silph, 12h15. Quarenta pessoas de crachá.',
    'Ninguém fala de trabalho. Isso é normal. O que não é normal é que ninguém fala do prédio, nem pra reclamar — e gente de escritório reclama do prédio.',
    'Uma mulher de uns trinta anos, sozinha, come em pé olhando o celular. Crachá azul. Os outros são brancos.'
  ],
  escolhas:[
    {texto:'Puxar conversa com ela.', vai:'c11_crachaz_azul'},
    {texto:'Ouvir a fila em silêncio.', vai:'c11_fila'}
  ]
},

c11_fila:{
  texto:[
    'Você fica vinte minutos ouvindo. Colhe três coisas:',
    '— crachá branco vai até o andar 8; crachá azul vai até o 10;',
    '— o elevador de serviço não tem botão pro 11, mas a escada de incêndio tem o patamar;',
    '— toda quinta-feira, 19h, sobe uma entrega pela doca que ninguém do administrativo registra.',
    'Hoje é quinta.'
  ],
  ef:{flag:['sabe_dos_crachas','sabe_da_quinta','sabe_do_andar_11']},
  escolhas:[
    {texto:'Falar com a mulher do crachá azul.', vai:'c11_crachaz_azul'},
    {texto:'Ir para a doca de carga.', vai:'c11_doca'}
  ]
},

c11_crachaz_azul:{
  texto:[
    'Ela te ouve sem olhar. Quando você diz "andar onze", ela finalmente levanta a cabeça.',
    '"Quem te falou disso?"',
    'Você responde. Ela ouve, fecha o celular, e fala muito baixo e muito rápido.',
    '"Eu trabalho no 9. Eu assino requisição de material biológico. Eu assino há dois anos e nunca vi o material."',
    '"Eu não sou heroína. Eu tenho filho e financiamento. Mas eu vou te falar uma coisa e depois vou embora e a gente nunca se viu."',
    '"O 11 não fica em cima do 10. Fica embaixo do subsolo. Chamaram de 11 porque era o próximo número disponível na planilha."'
  ],
  ef:{flag:['sabe_onde_e_o_11','sabe_do_andar_11'],
      npc:{nome:'Marina (crachá azul)', opiniao:2, memoria:'Te contou onde fica o andar 11 e pediu para nunca ter acontecido.'},
      registrar:'O "andar 11" da Silph fica abaixo do subsolo.'},
  escolhas:[
    {texto:'"Me leva até a porta."', vai:'c11_marina_leva'},
    {texto:'"Obrigado. Some daqui."', vai:'c11_recepcao',
     ef:{rep:{eixo:'bom',delta:1,motivo:'Protegeu quem te ajudou'}}}
  ]
},

c11_marina_leva:{
  texto:['Ela te olha por muito tempo.'],
  teste:{status:'carisma', dificuldade:9, nomeStatus:'Carisma',
         critico:'c11_marina_topa', sucesso:'c11_marina_topa', parcial:'c11_marina_meio', falha:'c11_marina_nao'}
},

c11_marina_topa:{
  texto:[
    '"Uma vez." Ela já está andando. "Eu te passo pela catraca como visita técnica, te levo até a escada de incêndio e volto pra minha mesa."',
    '"Se te pegarem, eu não te conheço."',
    '"Combinado."',
    'Na catraca, ela digita a matrícula dela pra te liberar. Ela sabe que isso fica registrado. Ela faz mesmo assim.'
  ],
  ef:{flag:['entrou_com_marina','dentro_da_silph'],
      npc:{nome:'Marina (crachá azul)', opiniao:5, memoria:'Usou a própria matrícula pra te passar pela catraca da Silph.'},
      rep:{eixo:'bom',delta:1,motivo:'Convenceu alguém a arriscar o emprego pelo certo'}},
  escolhas:[{texto:'Descer para a escada de incêndio.', vai:'c11_escada'}]
},

c11_marina_meio:{
  texto:[
    '"Não." Ela pega a bolsa. "Mas eu esqueci meu crachá reserva no bolso desse casaco aqui, que eu vou deixar nessa cadeira, porque eu sou distraída."',
    'Ela vai embora sem olhar pra trás.',
    'O casaco fica na cadeira. O crachá está no bolso.'
  ],
  ef:{flag:['cracha_roubado','dentro_da_silph'],
      npc:{nome:'Marina (crachá azul)', opiniao:3, memoria:'Deixou o crachá reserva num casaco para você, sem admitir.'}},
  escolhas:[{texto:'Entrar.', vai:'c11_recepcao'}]
},

c11_marina_nao:{
  texto:[
    '"Não." Ela levanta. "Eu já falei demais. Boa sorte, sério."',
    'Ela vai embora rápido, e na esquina olha pra trás uma vez — não pra você, pro prédio.'
  ],
  escolhas:[
    {texto:'Entrar pela recepção.', vai:'c11_recepcao'},
    {texto:'Entrar pela doca.', vai:'c11_doca'}
  ]
},

c11_recepcao:{
  texto:[
    'A recepção da Silph tem pé-direito de doze metros e uma catraca que abre com crachá.',
    d=>{
      if (d.flags.entrou_com_marina) return 'Marina já te passou. Você está do lado de dentro, com um crachá de visitante e quinze minutos de plausibilidade.';
      if (d.flags.crachas_sabrina) return 'O crachá do zelador é vencido, mas a catraca da Silph lê o chip, não a data. Ela abre.';
      if (d.flags.cracha_roubado) return 'O crachá reserva de Marina abre a catraca no primeiro toque.';
      return 'Você não tem crachá. A recepcionista sorri e pergunta com quem você tem hora marcada.';
    }
  ],
  escolhas:[
    {texto:'Subir pela escada de incêndio.', vai:'c11_escada',
     cond:d=>!!(d.flags.entrou_com_marina||d.flags.crachas_sabrina||d.flags.cracha_roubado||d.flags.dentro_da_silph)},
    {texto:'Inventar uma reunião.', vai:'c11_inventar'},
    {texto:'Ir pela doca de carga.', vai:'c11_doca'},
    {texto:'Desistir do prédio.', vai:'c11_desistiu'}
  ]
},

c11_inventar:{
  texto:['"Eu tenho reunião no nono andar. Requisição de material biológico."'],
  teste:{status:'intelecto', dificuldade:9, nomeStatus:'Intelecto',
         critico:'c11_entrou_blefe', sucesso:'c11_entrou_blefe', parcial:'c11_barrado', falha:'c11_barrado'}
},

c11_entrou_blefe:{
  texto:[
    'Você usou as palavras exatas, na ordem exata, com a segurança de quem já falou isso cem vezes.',
    'A recepcionista digita, franze a testa meio segundo, e imprime um crachá de visitante.',
    '"Nono andar. Elevador da direita."',
    'O elevador da direita passa pelo subsolo.'
  ],
  ef:{flag:'dentro_da_silph', rep:{eixo:'bom',delta:0,motivo:''}},
  escolhas:[{texto:'Descer no subsolo em vez de subir.', vai:'c11_escada'}]
},

c11_barrado:{
  texto:[
    'Ela sorri, digita, e o sorriso não muda nem um milímetro enquanto ela aperta um botão embaixo do balcão.',
    'A segurança chega em quarenta segundos. Dois homens grandes e muito educados.',
    '"O senhor precisa se retirar."'
  ],
  ef:{flag:'barrado_na_silph'},
  escolhas:[
    {texto:'Sair e tentar a doca.', vai:'c11_doca'},
    {texto:'Reagir.', vai:'c11_reagiu_seguranca'}
  ]
},

c11_reagiu_seguranca:{
  texto:[
    'Você reage no saguão de uma empresa, sob quatro câmeras.',
    'Isso não é uma batalha Pokémon — é uma ocorrência policial com registro audiovisual.'
  ],
  batalha:{dex:82, nivel:36, tipo:'treinador', treinador:'Segurança da Silph', fuga:true,
           timeExtra:[{dex:57, nivel:36}],
           vitoria:'c11_venceu_seguranca', derrota:'c11_expulso', fuga2:'c11_doca', gameover:'gameover'}
},

c11_venceu_seguranca:{
  texto:[
    'Você derruba os dois. No saguão. Na frente da recepção, de doze funcionários e de quatro câmeras.',
    'A catraca não te impede — segurança derrubada não tranca porta.',
    'Mas a partir de agora existe um vídeo seu, com data e hora, invadindo uma empresa.'
  ],
  ef:{flag:['dentro_da_silph','video_da_silph'],
      rep:{eixo:'ruim',delta:2,motivo:'Invadiu a Silph à força, gravado por quatro câmeras'},
      executar:d=>{ d.liga.avisos++; return [{tipo:'liga', texto:'A Silph vai acionar a Liga. Isso é questão de horas.'}]; }},
  escolhas:[{texto:'Descer pela escada de incêndio.', vai:'c11_escada'}]
},

c11_expulso:{
  texto:[
    'Eles te tiram do saguão com uma eficiência que sugere prática.',
    'Você acorda na calçada, sem nada quebrado e com a mochila do lado.',
    'A porta de vidro atrás de você reflete a rua inteira e não mostra nada do que tem dentro.'
  ],
  ef:{hp:-5, causa:'Retirado à força da Silph', flag:'expulso_da_silph'},
  escolhas:[
    {texto:'Tentar a doca de carga.', vai:'c11_doca'},
    {texto:'Desistir do prédio.', vai:'c11_desistiu'}
  ]
},

c11_doca:{
  texto:[
    'A doca de carga fica na lateral e funciona até tarde. Quinta-feira, 19h.',
    'Um caminhão sem identificação encosta. A carga é uma só: uma caixa branca de um metro e meio, com trava e etiqueta de material biológico.',
    d=>{
      const via = Historia.via();
      if (via==='mercenario'||via==='foragido') return 'Você conhece essa caixa. Você provavelmente ajudou a carregar uma igual em algum lugar.';
      return 'Dois funcionários descem pra buscar. Nenhum dos dois assina nada.';
    }
  ],
  escolhas:[
    {texto:'Entrar junto com a caixa.', vai:'c11_com_a_caixa'},
    {texto:'Abrir a caixa ali mesmo, na doca.', vai:'c11_abriu_caixa_silph'},
    {texto:'Se passar por entregador.', vai:'c11_entregador'},
    {texto:'Voltar para a recepção.', vai:'c11_recepcao'}
  ]
},

c11_entregador:{
  texto:['"Chegou mais uma. Cadê o responsável pra assinar?"'],
  teste:{status:'carisma', dificuldade:7, nomeStatus:'Carisma',
         critico:'c11_com_a_caixa', sucesso:'c11_com_a_caixa', parcial:'c11_com_a_caixa', falha:'c11_barrado'}
},

c11_abriu_caixa_silph:{
  texto:[
    'Você abre a trava na doca, com dois funcionários a dez metros de distância.',
    'Dentro: um Ditto. Vivo, sedado, com um monitor colado no dorso.',
    'E, embaixo dele, separados por espuma, mais quatro. Todos Ditto. Todos com monitor.',
    'Ditto copia. É a única coisa que Ditto faz.',
    'Você entende o experimento inteiro em dois segundos e queria muito não ter entendido.'
  ],
  ef:{flag:['viu_os_dittos','entendeu_o_projeto'],
      registrar:'A Silph recebe Dittos sedados semanalmente. Eles estão copiando alguma coisa.'},
  escolhas:[
    {texto:'Levar a caixa inteira e correr.', vai:'c11_roubou_caixa_silph'},
    {texto:'Fechar e entrar junto com ela.', vai:'c11_com_a_caixa'},
    {texto:'Soltar os cinco ali mesmo.', vai:'c11_soltou_dittos'}
  ]
},

c11_soltou_dittos:{
  texto:[
    'Você tira os cinco e coloca no chão da doca.',
    'Sedados, eles levam quase um minuto pra reagir. Quando reagem, fazem a única coisa que sabem: copiam o que está por perto.',
    'Quatro deles copiam você.',
    'Você fica cara a cara com quatro cópias suas, de crachá e mochila, na doca de carga da Silph, às sete da noite de uma quinta-feira.',
    'Nenhum funcionário sabe qual dos cinco perseguir. É a distração mais eficiente e mais perturbadora possível.'
  ],
  ef:{flag:['soltou_dittos','dentro_da_silph'],
      rep:{eixo:'bom',delta:2,motivo:'Libertou os Dittos da entrega semanal da Silph'},
      registrar:'Soltou cinco Dittos na doca da Silph. Quatro copiaram você.'},
  escolhas:[{texto:'Entrar enquanto eles se confundem.', vai:'c11_escada'}]
},

c11_roubou_caixa_silph:{
  texto:[
    'Você pega a caixa e corre. Ela pesa vinte e dois quilos.',
    'Você corre quatro quarteirões com vinte e dois quilos e some numa galeria.',
    'Dentro, cinco Dittos. E a certeza de que a Silph vai receber outra caixa igual na quinta que vem.'
  ],
  ef:{flag:'roubou_caixa_silph', hp:-3, causa:'Fuga com vinte e dois quilos',
      rep:{eixo:'bom',delta:1,motivo:'Interceptou uma entrega da Silph'},
      pokemon:{dex:132, nivel:30, opcoes:{moral:30, historia:'Estava numa caixa branca com monitor colado no dorso, a caminho do andar 11 da Silph.'}},
      registrar:'Roubou a caixa de Dittos da doca da Silph.'},
  escolhas:[
    {texto:'Voltar ao prédio mesmo assim.', vai:'c11_escada'},
    {texto:'Ir embora de Saffron com os Dittos.', vai:'c11_fim'}
  ]
},

c11_com_a_caixa:{
  texto:[
    'Você entra empurrando o carrinho, de cabeça baixa, como quem faz isso toda semana.',
    'Ninguém questiona um carrinho.',
    'O elevador de carga desce — não sobe. Subsolo. Depois continua descendo.',
    'O painel tem oito botões. O último não tem número, só uma etiqueta de fita crepe escrita à mão.'
  ],
  ef:{flag:'dentro_da_silph'},
  escolhas:[{texto:'Apertar o último botão.', vai:'c11_onze'}]
},

c11_escada:{
  texto:[
    'A escada de incêndio da Silph desce mais do que sobe. Isso é a primeira coisa errada.',
    'Subsolo 1: garagem. Subsolo 2: arquivo. Subsolo 3: sala de máquinas.',
    'Subsolo 4 não está na placa e a escada continua.',
    'No patamar seguinte, uma porta de aço com fechadura biométrica e, colada nela, uma folha A4 impressa em fonte padrão:',
    '"ANDAR 11 — ACESSO RESTRITO — NÍVEL 3"'
  ],
  ef:{flag:'chegou_no_11', registrar:'Chegou à porta do andar 11 da Silph.'},
  escolhas:[
    {texto:'Forçar a porta.', vai:'c11_forcou'},
    {texto:'Esperar alguém sair.', vai:'c11_esperou_11'},
    {texto:'Usar o crachá do zelador.', vai:'c11_onze', cond:d=>!!d.flags.crachas_sabrina},
    {texto:'Voltar. Ainda dá tempo de não saber.', vai:'c11_desistiu'}
  ]
},

c11_forcou:{
  texto:['Fechadura biométrica não se força. O que se força é a dobradiça.'],
  teste:{status:'forca', dificuldade:9, nomeStatus:'Força',
         critico:'c11_onze', sucesso:'c11_onze', parcial:'c11_esperou_11', falha:'c11_alarme'}
},

c11_alarme:{
  texto:[
    'A porta não cede e o alarme dispara.',
    'Não é sirene. É uma luz azul girando em silêncio, o que é infinitamente pior.',
    'Você ouve o elevador de carga sendo chamado três andares acima.'
  ],
  ef:{flag:'alarme_silph'},
  escolhas:[
    {texto:'Esconder e esperar eles abrirem.', vai:'c11_onze'},
    {texto:'Correr escada acima.', vai:'c11_desistiu'}
  ]
},

c11_esperou_11:{
  texto:[
    'Você espera no patamar de cima, agachado, por duas horas e meia.',
    'Às 22h40 a porta abre e sai uma mulher de jaleco, sozinha, falando ao telefone.',
    '"...não, o quarto ciclo também não pegou. A matriz rejeita." Pausa. "Eu sei o que custa. Eu também sei o que custa explicar sete Dittos por semana."',
    'Ela sobe. A porta leva onze segundos pra fechar sozinha.'
  ],
  ef:{flag:'ouviu_a_cientista'},
  escolhas:[{texto:'Entrar nos onze segundos.', vai:'c11_onze'}]
},

c11_onze:{
  texto:[
    'O andar 11 é branco, iluminado e absolutamente silencioso.',
    'Não tem mesa, não tem cadeira, não tem computador à vista. Tem doze tanques.',
    'Doze tanques cilíndricos de dois metros, em duas fileiras de seis, cheios de líquido claro.',
    'Onze deles têm alguma coisa dentro. Todas as onze coisas são a mesma coisa em estágios diferentes de terminado.',
    'O décimo segundo tanque está vazio e limpo, e a placa dele diz "MATRIZ — VAGO".',
    'Na parede do fundo, num quadro branco, uma anotação em caneta preta:',
    '"O original respondeu. Nenhuma cópia responde. Conclusão provisória: não é o material. É o tempo de fala."'
  ],
  ef:{flag:['viu_os_doze','entendeu_o_projeto'], instabilidade:2,
      registrar:'Viu os doze tanques do andar 11 da Silph. Estão tentando refazer Mewtwo.'},
  escolhas:[
    {texto:'Ler o resto do quadro.', vai:'c11_quadro'},
    {texto:'Abrir os tanques.', vai:'c11_abrir_tanques'},
    {texto:'Fotografar tudo e sair.', vai:'c11_fotografou_11'},
    {texto:'Destruir o andar inteiro.', vai:'c11_destruir'},
    {texto:'Sair. Você não devia ter visto isso.', vai:'c11_saiu_11'}
  ]
},

c11_quadro:{
  texto:[
    'O quadro tem uma linha do tempo.',
    '"Aquisição do material — Cinnabar, arquivo morto." / "Primeira série: falha estrutural." / "Segunda série: viável, sem cognição." / "Terceira série: cognição parcial, sem vontade."',
    'E embaixo, numa letra diferente, mais nova, quase raivosa:',
    '"O DR. FUJI CONVERSOU COM ELE POR 241 DIAS. NÓS NÃO TEMOS 241 DIAS. O CONSELHO QUER RESULTADO EM 90."',
    'E no canto, apagado pela metade e reescrito por cima três vezes, o mesmo rabisco:',
    '"eles não falam porque ninguém pergunta"'
  ],
  ef:{flag:'leu_o_quadro',
      registrar:'O quadro do andar 11: as cópias não falam porque ninguém pergunta.'},
  escolhas:[
    {texto:'Perguntar alguma coisa. Em voz alta. Para os tanques.', vai:'c11_perguntou'},
    {texto:'Abrir os tanques.', vai:'c11_abrir_tanques'},
    {texto:'Fotografar e sair.', vai:'c11_fotografou_11'},
    {texto:'Destruir o andar.', vai:'c11_destruir'}
  ]
},

c11_perguntou:{
  texto:[
    'Você se sente ridículo por três segundos inteiros.',
    'Depois fala, em voz alta, numa sala branca com onze corpos em tanques:',
    '"Vocês estão aí?"',
    'O líquido do quarto tanque se move.',
    'Não é uma resposta em palavra. É uma pressão atrás dos seus olhos, e uma sensação que você reconhece imediatamente porque todo mundo reconhece: o alívio de alguém que passou muito tempo esperando ser chamado.',
    'Onze pressões. Uma depois da outra. Em ordem, do primeiro tanque ao décimo primeiro.',
    d=>d.flags.ancora_mental ? 'Alguma coisa começa a puxar você pra dentro daquilo, e aí você lembra — de um jeito absurdo e nítido — do cheiro da cozinha da sua casa no capítulo um. A âncora da Sabrina. Você volta.' : 'Alguma coisa começa a puxar você pra dentro daquilo e você não tem nada pra se segurar.'
  ],
  ef:{flag:'falou_com_os_doze',
      executar:d=>{
        if (!d.flags.ancora_mental){
          const morreu = Estado.ferir(9, 'Contato mental com o andar 11');
          return [{tipo:'dano', texto:'Você perdeu 9 de HP. Ficou vinte minutos sem saber seu próprio nome.'}];
        }
        return [{tipo:'info', texto:'A âncora da Sabrina funcionou. Você voltou inteiro.'}];
      },
      rep:{eixo:'bom',delta:2,motivo:'Foi a primeira pessoa a perguntar alguma coisa às cópias'},
      registrar:'Falou com as onze cópias. Elas responderam.'},
  escolhas:[
    {texto:'Abrir os tanques.', vai:'c11_abrir_tanques'},
    {texto:'Fotografar e sair — a prova vale mais que onze vidas.', vai:'c11_fotografou_11'},
    {texto:'Prometer voltar.', vai:'c11_prometeu_voltar'}
  ]
},

c11_prometeu_voltar:{
  texto:[
    '"Eu volto."',
    'Você diz isso em voz alta numa sala branca, para onze coisas em tanques, e não tem a menor ideia de como vai cumprir.',
    'As onze pressões respondem ao mesmo tempo, e dessa vez você entende a textura do que elas mandam: não é esperança.',
    'É registro. Elas anotaram.'
  ],
  ef:{flag:['prometeu_aos_doze','divida_com_os_doze'],
      rep:{eixo:'bom',delta:1,motivo:'Prometeu a onze pessoas que ninguém considera pessoa'},
      registrar:'Prometeu voltar ao andar 11. Eles anotaram.'},
  escolhas:[{texto:'Sair.', vai:'c11_saiu_11'}]
},

c11_abrir_tanques:{
  texto:[
    'O painel de dreno é analógico e tem uma alavanca por tanque. Isso é projeto de gente que não achava que alguém fosse querer abrir.',
    'Você abre os onze.',
    'O líquido desce em noventa segundos. Sete não se mexem — nunca iam se mexer.',
    'Três se mexem e não conseguem ficar de pé.',
    'Um fica de pé.',
    'Ele tem mais ou menos a sua altura, a pele clara demais, e olha em volta de um jeito que você reconhece: primeira vez.'
  ],
  ef:{flag:'abriu_os_tanques', instabilidade:2,
      registrar:'Abriu os onze tanques do andar 11. Um ficou de pé.'},
  escolhas:[
    {texto:'Levar ele com você.', vai:'c11_levou_copia'},
    {texto:'Mostrar a saída e deixar ele escolher.', vai:'c11_deixou_escolher'},
    {texto:'Fugir. Você não sabe o que é isso.', vai:'c11_fugiu_do_11'}
  ]
},

c11_levou_copia:{
  texto:[
    'Você estende a mão. Ele olha a mão, olha você, e não entende o gesto — ninguém nunca estendeu nada pra ele.',
    'Você pega no braço dele, com cuidado, e puxa. Ele vem.',
    'Vocês sobem quatro lances de escada de incêndio com um alarme azul girando em silêncio.',
    'Na rua, ele para. Olha o céu pela primeira vez na vida e trava completamente.',
    'Você tem que puxar de novo.'
  ],
  ef:{flag:['levou_uma_copia','tem_uma_copia'],
      pokemon:{dex:150, nivel:25, opcoes:{apelido:'Décimo Segundo', natureza:'Bashful', moral:40,
        historia:'Cópia incompleta feita no andar 11 da Silph. Ficou de pé quando você abriu o tanque. Não é Mewtwo — é uma tentativa de Mewtwo.'}},
      rep:{eixo:'bom',delta:2,motivo:'Tirou uma cópia viva do andar 11'},
      registrar:'Tirou o Décimo Segundo do andar 11 da Silph.'},
  escolhas:[{texto:'Sumir de Saffron.', vai:'c11_fim'}]
},

c11_deixou_escolher:{
  texto:[
    'Você aponta a porta da escada e recua.',
    'Ele olha a porta por quarenta segundos. Depois olha os três no chão que não conseguem levantar.',
    'Depois senta no chão, ao lado deles.',
    'Ele escolheu. A primeira escolha da vida dele foi ficar com os outros três.',
    'Você sai sozinho e essa imagem vai te acompanhar até o último capítulo.'
  ],
  ef:{flag:['deixou_a_copia','divida_com_os_doze'],
      rep:{eixo:'bom',delta:3,motivo:'Deu a alguém a primeira escolha da vida dele'},
      registrar:'A cópia escolheu ficar com os outros três. Você saiu sozinho.'},
  escolhas:[{texto:'Sair.', vai:'c11_fim'}]
},

c11_fugiu_do_11:{
  texto:[
    'Você sobe a escada correndo com quatro coisas vivas atrás de você num chão molhado.',
    'Nenhuma te persegue. Elas não sabem correr.',
    'Você fecha a porta de aço do lado de fora e ela tranca sozinha.'
  ],
  ef:{flag:'fechou_a_porta_do_11',
      rep:{eixo:'ruim',delta:1,motivo:'Abriu os tanques e fugiu'},
      registrar:'Abriu os tanques e trancou a porta atrás de si.'},
  escolhas:[{texto:'Sair do prédio.', vai:'c11_fim'}]
},

c11_fotografou_11:{
  texto:[
    'Você fotografa os doze tanques, o quadro branco, a etiqueta "MATRIZ — VAGO", a linha do tempo, o rabisco no canto.',
    'Vinte e três fotos.',
    'Depois sai sem abrir nenhum tanque, porque uma foto de onze corpos em tanque fecha uma empresa, e onze corpos soltos numa escada de incêndio fecham só uma noite.',
    'Você faz a conta friamente e sai, e a frieza é a parte que te assusta.'
  ],
  ef:{flag:['provas_do_11','escolha_fria'],
      rep:{eixo:'bom',delta:2,motivo:'Documentou o andar 11 inteiro'},
      registrar:'Fotografou o andar 11: 23 fotos.'},
  escolhas:[
    {texto:'Levar à Dra. Ivone.', vai:'c11_entregou_ivone', cond:d=>!!d.flags.cartao_ivone},
    {texto:'Levar à Liga.', vai:'c11_entregou_liga'},
    {texto:'Levar à Sabrina.', vai:'c11_entregou_sabrina', cond:d=>!!d.flags.sabrina_avisou},
    {texto:'Guardar. Você decide depois.', vai:'c11_fim', ef:{flag:'guardou_provas_11'}}
  ]
},

c11_entregou_ivone:{
  texto:[
    'A Dra. Ivone olha as vinte e três fotos em silêncio absoluto.',
    'Na foto do quadro branco — a do "241 dias" — ela tira os óculos e esfrega os olhos por muito tempo.',
    '"Eu conheci o Fuji." Ela diz isso do nada. "Na faculdade. Ele era o mais gentil da turma."',
    '"Isso aqui não é a Silph sendo má. Isso é a Silph tendo prazo."',
    'Ela liga pra três pessoas naquela noite. Duas atendem.'
  ],
  ef:{rep:{eixo:'bom',delta:3,motivo:'Entregou o andar 11 a quem sabia o que fazer com aquilo'},
      npc:{nome:'Dra. Ivone', opiniao:10, memoria:'Recebeu as 23 fotos do andar 11. Conhecia o Dr. Fuji da faculdade.'},
      flag:'ivone_tem_o_11', instabilidade:-1,
      registrar:'Dra. Ivone recebeu as provas do andar 11.'},
  escolhas:[{texto:'Sair de Saffron.', vai:'c11_fim'}]
},

c11_entregou_liga:{
  texto:[
    'A Liga age rápido dessa vez. Rápido demais, na verdade.',
    'Em nove horas tem gente de terno na Silph. Em dezoito, um comunicado oficial: "irregularidades administrativas em unidade de pesquisa".',
    'Em trinta e seis horas, o andar 11 não existe mais. Esvaziado, limpo, lacrado.',
    'Ninguém diz o que aconteceu com o conteúdo dos tanques. Você pergunta três vezes. Três respostas diferentes.'
  ],
  ef:{rep:{eixo:'bom',delta:2,motivo:'Entregou o andar 11 à Liga Pokémon'},
      flag:'liga_lacrou_o_11', instabilidade:1,
      executar:d=>{ d.liga.avisos = Math.max(0, d.liga.avisos-1); return [{tipo:'liga', texto:'A Liga passou a te dever um favor. Isso é uma moeda estranha.'}]; },
      registrar:'A Liga lacrou o andar 11 em 36 horas. Ninguém explicou o destino dos tanques.'},
  escolhas:[{texto:'Sair de Saffron.', vai:'c11_fim'}]
},

c11_entregou_sabrina:{
  texto:[
    'Sabrina olha três fotos e para.',
    '"Eu não preciso ver o resto. Eu já ouvi o resto todo dia durante três semanas."',
    'Ela devolve o celular. "Você perguntou pra eles?"',
    d=>d.flags.falou_com_os_doze ? '"Perguntei."\n"Eu sei. Eu senti daqui." Ela fecha os olhos. "Onze coisas sentiram alívio ao mesmo tempo e eu quase caí no chão da arena."' :
       '"Não."\n"Ah." Ela olha pro lado. "Então volta lá um dia e pergunta. É a única coisa que ninguém tentou."',
    'Ela reabre o ginásio na semana seguinte. Não porque melhorou — porque agora ela sabe que tem alguém a par.'
  ],
  ef:{rep:{eixo:'bom',delta:2,motivo:'Compartilhou a verdade com quem estava sozinha nela'},
      npc:{nome:'Sabrina', opiniao:8, memoria:'Reabriu o ginásio depois que você confirmou o que ela ouvia.'},
      flag:'sabrina_aliada'},
  escolhas:[{texto:'Sair de Saffron.', vai:'c11_fim'}]
},

c11_destruir:{
