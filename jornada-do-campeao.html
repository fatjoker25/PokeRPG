<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jornada do Campeão — RPG de Kanto</title>
<meta name="description" content="RPG de mesa de Pokémon em Kanto: começa leve e vai ficando sombrio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
/* ============================================================
   POKÉMON RPG — JORNADA DO CAMPEÃO
   A paleta escurece conforme a história escurece.
   ============================================================ */
:root{
  --bg:#12161d;
  --bg-2:#1a2029;
  --painel:#1e252f;
  --borda:#2e3743;
  --texto:#dfe4ea;
  --texto-fraco:#8b97a6;
  --destaque:#e8b84b;
  --destaque-2:#6fa8dc;
  --bom:#5fb85f;
  --ruim:#c0563c;
  --perigo:#e04f3d;
  --hp:#5fb85f;
  --hp-medio:#e8c23c;
  --hp-baixo:#e04f3d;
  --sombra:0 8px 28px rgba(0,0,0,.45);
  --raio:10px;
  --fonte:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
/* tons por capítulo */
body[data-tom="leve"]        { --bg:#182029; --bg-2:#1f2732; --painel:#232c38; --destaque:#f0c860; }
body[data-tom="inquieto"]    { --bg:#141a21; --bg-2:#1a2028; --painel:#1e252e; --destaque:#e8b84b; }
body[data-tom="sombrio"]     { --bg:#0f1319; --bg-2:#141920; --painel:#171d25; --destaque:#d9a13f; }
body[data-tom="muito sombrio"]{ --bg:#0a0d11; --bg-2:#0e1217; --painel:#11161c; --destaque:#c08a35; --texto:#c9d0d8; }
body[data-tom="final"]       { --bg:#07090c; --bg-2:#0a0d10; --painel:#0d1116; --destaque:#b07f7f; --texto:#c4c9d0; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--texto); font-family:var(--fonte);
  line-height:1.65; font-size:16px; min-height:100vh;
  transition:background .8s ease,color .8s ease;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:980px;margin:0 auto;padding:16px 16px 72px}

/* ---------- topo ---------- */
.topo{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--painel);border:1px solid var(--borda);
  border-radius:var(--raio);margin-bottom:14px;position:sticky;top:8px;z-index:20;
  box-shadow:var(--sombra)
}
.topo h1{font-size:15px;margin:0;letter-spacing:.04em;font-weight:600}
.topo .sub{font-size:12px;color:var(--texto-fraco);margin-top:2px}
.topo-acoes{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- botões ---------- */
button{font-family:inherit;font-size:14px;cursor:pointer;transition:.15s}
.btn{
  background:var(--bg-2);color:var(--texto);border:1px solid var(--borda);
  padding:8px 14px;border-radius:8px
}
.btn:hover:not(:disabled){border-color:var(--destaque);color:var(--destaque)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.mini{padding:5px 10px;font-size:12.5px}
.btn.destaque{background:var(--destaque);color:#15181d;border-color:var(--destaque);font-weight:600}
.btn.destaque:hover{filter:brightness(1.12);color:#15181d}
.btn.perigo{border-color:var(--perigo);color:var(--perigo)}
.btn.perigo:hover:not(:disabled){background:var(--perigo);color:#fff}

/* ---------- painéis ---------- */
.painel{
  background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--sombra)
}
.painel h2{margin:0 0 12px;font-size:16px;letter-spacing:.05em;color:var(--destaque);font-weight:600}
.painel h3{margin:16px 0 8px;font-size:13.5px;color:var(--texto-fraco);
  text-transform:uppercase;letter-spacing:.09em;font-weight:600}

/* ---------- narrativa ---------- */
.cap-cabecalho{border-left:3px solid var(--destaque);padding-left:14px;margin-bottom:18px}
.cap-cabecalho .num{font-size:11.5px;letter-spacing:.18em;color:var(--texto-fraco);text-transform:uppercase}
.cap-cabecalho .tit{font-size:22px;font-weight:600;margin:3px 0}
.cap-cabecalho .loc{font-size:13px;color:var(--texto-fraco);font-style:italic}

.narrativa p{margin:0 0 15px;animation:aparece .5s ease both}
.narrativa p:nth-child(1){animation-delay:.02s}
.narrativa p:nth-child(2){animation-delay:.16s}
.narrativa p:nth-child(3){animation-delay:.3s}
.narrativa p:nth-child(4){animation-delay:.44s}
.narrativa p:nth-child(5){animation-delay:.58s}
.narrativa p:nth-child(6){animation-delay:.72s}
.narrativa p:nth-child(n+7){animation-delay:.86s}
@keyframes aparece{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.escolhas{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.escolha{
  text-align:left;background:var(--bg-2);border:1px solid var(--borda);color:var(--texto);
  padding:13px 16px;border-radius:8px;line-height:1.5;position:relative;padding-left:38px
}
.escolha::before{
  content:'›';position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--texto-fraco);font-size:19px;line-height:1
}
.escolha:hover{border-color:var(--destaque);background:var(--painel)}
.escolha:hover::before{color:var(--destaque)}

/* ---------- avisos / consequências ---------- */
.avisos{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.aviso{
  font-size:13.5px;padding:9px 13px;border-radius:7px;border-left:3px solid var(--borda);
  background:var(--bg-2);animation:aparece .35s ease both
}
.aviso.rep{border-left-color:var(--destaque);color:var(--destaque)}
.aviso.item,.aviso.pokemon,.aviso.cura,.aviso.insignia{border-left-color:var(--bom);color:var(--bom)}
.aviso.dano,.aviso.morte,.aviso.gameover{border-left-color:var(--perigo);color:var(--perigo)}
.aviso.mundo{border-left-color:var(--destaque-2);color:var(--destaque-2);font-style:italic}
.aviso.liga{border-left-color:#b07fd0;color:#b07fd0}
.aviso.perigo{border-left-color:var(--perigo);color:var(--perigo);font-weight:600}

/* ---------- dados ---------- */
.dado-caixa{
  display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);
  border:1px solid var(--borda);border-radius:7px;padding:5px 11px;
  font-family:var(--mono);font-size:12.5px;margin:3px 5px 3px 0
}
.dado-caixa .val{color:var(--destaque);font-weight:700;font-size:15px}
.dado-caixa .mot{color:var(--texto-fraco)}
.dado-caixa.max .val{color:var(--bom)}
.dado-caixa.min .val{color:var(--perigo)}

/* ---------- combate ---------- */
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:620px){.arena{grid-template-columns:1fr}}
.lutador{background:var(--bg-2);border:1px solid var(--borda);border-radius:9px;padding:13px 15px}
.lutador.inimigo{border-color:#4a2f2f}
.lutador .nome{font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lutador .nv{font-size:12px;color:var(--texto-fraco);font-family:var(--mono)}
.lutador .meta{font-size:12px;color:var(--texto-fraco);margin-top:3px}
.barra{height:9px;background:#0a0d11;border-radius:5px;overflow:hidden;margin:9px 0 5px;border:1px solid var(--borda)}
.barra i{display:block;height:100%;background:var(--hp);transition:width .45s ease;border-radius:4px}
.barra.medio i{background:var(--hp-medio)} .barra.baixo i{background:var(--hp-baixo)}
.hp-num{font-family:var(--mono);font-size:12px;color:var(--texto-fraco)}

.tipo-tag{
  display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;
  color:#0e1116;font-weight:700;margin-right:4px;letter-spacing:.03em
}
.status-tag{
  display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;
  background:#3a2a2a;color:#e8a05c;margin-left:5px;text-transform:uppercase;letter-spacing:.05em
}

.log-combate{
  background:#0a0d11;border:1px solid var(--borda);border-radius:8px;padding:12px 14px;
  max-height:290px;overflow-y:auto;font-size:13.5px;margin-bottom:14px;scroll-behavior:smooth
}
.log-combate .l{padding:3px 0;animation:aparece .3s ease both}
.log-combate .l.golpe{color:var(--destaque)}
.log-combate .l.dano{color:#e89a8a}
.log-combate .l.danoJogador{color:var(--perigo);font-weight:600}
.log-combate .l.cura,.log-combate .l.exp{color:var(--bom)}
.log-combate .l.status,.log-combate .l.natureza{color:var(--destaque-2);font-style:italic}
.log-combate .l.erro{color:var(--texto-fraco)}
.log-combate .l.perigo,.log-combate .l.gameover{color:var(--perigo);font-weight:700}
.log-combate .l.vitoria,.log-combate .l.nivel,.log-combate .l.evolucao,.log-combate .l.captura{color:var(--bom);font-weight:600}
.log-combate .l.turno{color:var(--texto-fraco);border-top:1px solid var(--borda);margin-top:7px;padding-top:7px;font-family:var(--mono);font-size:12px}
.log-combate .l.inicio{color:var(--destaque);font-weight:600;font-size:14.5px}

.acoes-combate{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:620px){.acoes-combate{grid-template-columns:1fr}}
.golpe-btn{
  text-align:left;background:var(--bg-2);border:1px solid var(--borda);color:var(--texto);
  padding:10px 13px;border-radius:8px;display:flex;justify-content:space-between;
  align-items:center;gap:9px
}
.golpe-btn:hover:not(:disabled){border-color:var(--destaque)}
.golpe-btn .pp{font-family:var(--mono);font-size:11.5px;color:var(--texto-fraco)}
.golpe-btn .pd{font-size:11px;color:var(--texto-fraco)}

/* ---------- ficha / listas ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.carta{background:var(--bg-2);border:1px solid var(--borda);border-radius:8px;padding:12px 14px;font-size:13.5px}
.carta.morto{opacity:.55;border-style:dashed;border-color:var(--perigo)}
.carta .t{font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;gap:6px}
.linha{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--borda);font-size:13.5px}
.linha:last-child{border-bottom:none}
.linha .k{color:var(--texto-fraco)}
.linha .v{font-family:var(--mono)}

.status-linha{display:flex;align-items:center;gap:10px;padding:7px 0}
.status-linha .nome{width:112px;font-size:13.5px}
.status-pontos{display:flex;gap:4px;flex:1}
.status-pontos i{width:13px;height:13px;border-radius:3px;background:var(--bg);border:1px solid var(--borda)}
.status-pontos i.on{background:var(--destaque);border-color:var(--destaque)}

.rep-barra{height:7px;background:var(--bg);border:1px solid var(--borda);border-radius:4px;overflow:hidden;margin-top:7px}
.rep-barra i{display:block;height:100%;transition:width .5s}
.rep-barra.bom i{background:var(--bom)} .rep-barra.ruim i{background:var(--ruim)}

/* ---------- criação ---------- */
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12.5px;color:var(--texto-fraco);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.07em}
.campo input,.campo select,.campo textarea{
  width:100%;background:var(--bg);border:1px solid var(--borda);color:var(--texto);
  padding:10px 13px;border-radius:7px;font-family:inherit;font-size:15px
}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--destaque)}
.campo textarea{resize:vertical;min-height:62px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.dois{grid-template-columns:1fr}}
.opcoes-radio{display:flex;flex-wrap:wrap;gap:8px}
.opcoes-radio button{
  background:var(--bg);border:1px solid var(--borda);color:var(--texto);
  padding:9px 15px;border-radius:7px
}
.opcoes-radio button.sel{border-color:var(--destaque);color:var(--destaque);background:var(--bg-2)}

/* ---------- modal ---------- */
.modal-fundo{
  position:fixed;inset:0;background:rgba(4,6,9,.82);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:100;animation:aparece .2s ease both
}
.modal{
  background:var(--painel);border:1px solid var(--borda);border-radius:12px;padding:22px;
  max-width:620px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--sombra)
}
.modal h2{margin-top:0}

/* ---------- final ---------- */
.final{text-align:center;padding:42px 26px}
.final .tit{font-size:30px;letter-spacing:.14em;color:var(--destaque);margin-bottom:26px;font-weight:300}
.final p{max-width:610px;margin:0 auto 17px;text-align:left}

.gameover{text-align:center;padding:56px 24px}
.gameover .tit{font-size:36px;color:var(--perigo);letter-spacing:.2em;margin-bottom:18px;font-weight:300}

.sussurro{color:var(--texto-fraco);font-size:13px;font-style:italic;margin-top:10px}
.fraco{color:var(--texto-fraco);font-size:12.5px}
.carta.ginasio{display:flex;flex-direction:column}
.carta.ginasio .t{align-items:center}
.carta.ginasio .rodape{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.carta.ginasio .cidade{color:var(--texto-fraco);font-weight:400;font-size:13px}
.centro{text-align:center}
.mono{font-family:var(--mono)}
.nada{color:var(--texto-fraco);font-style:italic;font-size:13.5px}

/* ---------- ação livre ---------- */
.acao-livre{
  margin-top:16px;padding:14px 16px;border:1px dashed var(--borda);
  border-radius:9px;background:var(--bg-2)
}
.acao-livre label{
  display:block;font-size:12px;color:var(--texto-fraco);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.08em
}
.linha-acao{display:flex;gap:8px}
.linha-acao input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--borda);color:var(--texto);
  padding:10px 13px;border-radius:7px;font-family:inherit;font-size:15px
}
.linha-acao input:focus{outline:none;border-color:var(--destaque)}
.acao-livre .sussurro{margin-top:9px;font-size:12px}
.eco{
  border-left:3px solid var(--destaque-2);padding:6px 0 6px 13px;margin:0 0 14px;
  color:var(--destaque-2);font-style:italic
}

</style>
</head>

<div id="app"></div>

<script>
/* ===== js/data/types.js ===== */
/* ============================================================
   TIPOS — Tabela de eficácia (1ª Geração, 15 tipos)
   ============================================================ */
const TIPOS = ['Normal','Fogo','Água','Elétrico','Grama','Gelo','Lutador','Venenoso','Terrestre','Voador','Psíquico','Inseto','Pedra','Fantasma','Dragão'];

const COR_TIPO = {
  'Normal':'#9aa0a6','Fogo':'#e8603c','Água':'#4a90d9','Elétrico':'#e8c23c',
  'Grama':'#5fb85f','Gelo':'#7fd4e0','Lutador':'#c0392b','Venenoso':'#9b59b6',
  'Terrestre':'#c9a227','Voador':'#8fa8dd','Psíquico':'#e0568a','Inseto':'#8fb020',
  'Pedra':'#a89060','Fantasma':'#6a5acd','Dragão':'#5a4fcf'
};

/* Multiplicadores: TABELA[atacante][defensor] — ausente = 1x */
const TABELA_TIPOS = {
  'Normal':    { 'Pedra':0.5, 'Fantasma':0 },
  'Fogo':      { 'Fogo':0.5, 'Água':0.5, 'Grama':2, 'Gelo':2, 'Inseto':2, 'Pedra':0.5, 'Dragão':0.5 },
  'Água':      { 'Fogo':2, 'Água':0.5, 'Grama':0.5, 'Terrestre':2, 'Pedra':2, 'Dragão':0.5 },
  'Elétrico':  { 'Água':2, 'Elétrico':0.5, 'Grama':0.5, 'Terrestre':0, 'Voador':2, 'Dragão':0.5 },
  'Grama':     { 'Fogo':0.5, 'Água':2, 'Grama':0.5, 'Venenoso':0.5, 'Terrestre':2, 'Voador':0.5, 'Inseto':0.5, 'Pedra':2, 'Dragão':0.5 },
  'Gelo':      { 'Água':0.5, 'Grama':2, 'Gelo':0.5, 'Terrestre':2, 'Voador':2, 'Dragão':2 },
  'Lutador':   { 'Normal':2, 'Gelo':2, 'Venenoso':0.5, 'Voador':0.5, 'Psíquico':0.5, 'Inseto':0.5, 'Pedra':2, 'Fantasma':0 },
  'Venenoso':  { 'Grama':2, 'Venenoso':0.5, 'Terrestre':0.5, 'Inseto':2, 'Pedra':0.5, 'Fantasma':0.5 },
  'Terrestre': { 'Fogo':2, 'Elétrico':2, 'Grama':0.5, 'Venenoso':2, 'Voador':0, 'Inseto':0.5, 'Pedra':2 },
  'Voador':    { 'Elétrico':0.5, 'Grama':2, 'Lutador':2, 'Inseto':2, 'Pedra':0.5 },
  'Psíquico':  { 'Lutador':2, 'Venenoso':2, 'Psíquico':0.5 },
  'Inseto':    { 'Fogo':0.5, 'Grama':2, 'Lutador':0.5, 'Venenoso':2, 'Voador':0.5, 'Psíquico':2, 'Fantasma':0.5 },
  'Pedra':     { 'Fogo':2, 'Gelo':2, 'Lutador':0.5, 'Terrestre':0.5, 'Voador':2, 'Inseto':2 },
  'Fantasma':  { 'Normal':0, 'Psíquico':2, 'Fantasma':2 },
  'Dragão':    { 'Dragão':2 }
};

function eficacia(tipoGolpe, tiposAlvo){
  let m = 1;
  const linha = TABELA_TIPOS[tipoGolpe] || {};
  for (const t of tiposAlvo){ if (linha[t] !== undefined) m *= linha[t]; }
  return m;
}

function textoEficacia(m){
  if (m === 0) return 'Não afeta o alvo...';
  if (m >= 4) return 'Devastador! (4x)';
  if (m >= 2) return 'É super efetivo! (2x)';
  if (m <= 0.25) return 'Quase não arranha... (0.25x)';
  if (m <= 0.5) return 'Não é muito efetivo... (0.5x)';
  return '';
}

[17,'Pidgeotto',['Normal','Voador'],63,60,55,50,50,71,18,36],
[18,'Pidgeot',['Normal','Voador'],83,80,75,70,70,101,0,0],
[19,'Rattata',['Normal'],30,56,35,25,35,72,20,20],
[20,'Raticate',['Normal'],55,81,60,50,70,97,0,0],
[21,'Spearow',['Normal','Voador'],40,60,30,31,31,70,22,20],
[22,'Fearow',['Normal','Voador'],65,90,65,61,61,100,0,0],
[23,'Ekans',['Venenoso'],35,60,44,40,54,55,24,22],
[24,'Arbok',['Venenoso'],60,95,69,65,79,80,0,0],

const LENDARIOS = [144,145,146,150,151,243,244,245,250];
/* Quebram Poké Balls: Mewtwo e Ho-Oh */
const QUEBRA_BOLA = [150,250];
/* Grupos para consequências em cascata */
const GRUPO_AVES = [144,145,146];
const GRUPO_CAES = [243,244,245];

const DEX = {};
DEX_RAW.forEach(r => {
  const [dex,nome,tipos,hp,atk,def,spa,spd,spe,evo,nivelEvo] = r;
  DEX[dex] = {
    dex, nome, tipos,
    base:{hp,atk,def,spa,spd,spe},
    evo, nivelEvo,
    lendario: LENDARIOS.includes(dex),
    total: hp+atk+def+spa+spd+spe
  };
});

/* Taxa de captura derivada: lendários 3, fortões 45, médios 90, comuns 190 */
Object.values(DEX).forEach(p => {
  if (p.lendario) p.captura = 3;
  else if (p.total >= 490) p.captura = 45;
  else if (p.total >= 400) p.captura = 90;
  else if (p.total >= 320) p.captura = 150;
  else p.captura = 220;
});

/* Pool de encontros selvagens: tudo menos lendários e Ditto/Porygon/Mew */
const POOL_SELVAGEM = Object.values(DEX)
  .filter(p => !p.lendario && p.dex <= 151 && ![132,137].includes(p.dex))
  .map(p => p.dex);

/* Golpes por tipo, prontos para montar learnsets */
const GOLPES_POR_TIPO = {};
for (const [nome,g] of Object.entries(GOLPES)){
  (GOLPES_POR_TIPO[g.t] = GOLPES_POR_TIPO[g.t] || []).push(nome);
}

/* Golpes iniciais genéricos que qualquer um pode ter */
const GOLPES_BASICOS = ['Tackle','Scratch','Pound','Growl','Leer','Tail Whip'];

/*
  Monta 4 golpes coerentes para uma espécie em um nível:
  - prioriza golpes do(s) tipo(s) da espécie (STAB)
  - respeita a categoria dominante (Ataque vs Ataque Especial)
  - completa com Normal e com um golpe de status
*/
/* Quanto vale um golpe de status na mão da IA/do moveset */
function utilidadeStatus(g){
  const e = g.ef || {};
  if (e.tipo === 'sono') return 95;
  if (e.tipo === 'paralisia') return 85;
  if (e.grave) return 80;
  if (e.sobe && e.forte) return 75;
  if (e.tipo === 'veneno') return 70;
  if (e.tipo === 'confusao') return 65;
  if (e.cura) return 55;
  if (e.baixa && e.forte) return 50;
  if (e.sobe) return 45;
  return 35;
}

function montarGolpes(dexId, nivel){
  const esp = DEX[dexId];
  const fisico = esp.base.atk >= esp.base.spa;

  // poder efetivo: golpes de dano fixo/por nível contam como poder médio
  const poderEf = (g) => {
    if (g.c === 'status') return 0;
    if (g.p > 0) return g.p;
    if (g.ef && (g.ef.nivel || g.ef.fixo)) return 55;
    return 40;
  };

  const nota = (nome, g, stab) => {
    if (g.c === 'status') return utilidadeStatus(g) + (stab ? 10 : 0);
    let s = poderEf(g) * (g.a >= 999 ? 1 : g.a / 100);      // poder ponderado pela precisão
    if (stab) s *= 1.5;                                      // STAB pesa de verdade
    s *= (g.c === (fisico ? 'fis' : 'esp')) ? 1.25 : 0.55;   // usa o stat bom do bicho
    if (g.ef && g.ef.golpes) s *= g.ef.golpes * 0.8;
    if (g.p >= 110 && nivel < 42) s *= 0.35;                 // nada de Hyper Beam cedo
    if (g.ef && g.ef.recarga && nivel < 50) s *= 0.5;
    return s;
  };

  // hash estável: o mesmo bicho sempre aprende os mesmos golpes raros
  const hash = (str) => { let h = dexId * 131; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 100003; return h; };
  const disponivel = (nome) => {
    const g = GOLPES[nome];
    if (g.nv > nivel) return false;
    if (g.soPara && !g.soPara.includes(dexId)) return false;          // golpe de linhagem
    if (g.raro && !esp.tipos.includes(g.t) && hash(nome) % 5 !== 0) return false;  // raro, mas não pra todo mundo
    return true;
  };
  const lista = (tipo) => (GOLPES_POR_TIPO[tipo] || []).filter(disponivel);

  const escolhidos = [];
  const vistos = new Set();
  const por = (nome) => { if (nome && !vistos.has(nome) && escolhidos.length < 4){ vistos.add(nome); escolhidos.push(nome); } };

  // 1) garante o melhor golpe de dano com STAB de CADA tipo da espécie
  for (const tipo of esp.tipos){
    const melhor = lista(tipo)
      .filter(n => GOLPES[n].c !== 'status')
      .sort((a,b) => nota(b,GOLPES[b],true) - nota(a,GOLPES[a],true))[0];
    por(melhor);
  }

  // 2) preenche com o melhor restante (STAB ou Normal), sem status ainda
  const resto = [];
  for (const tipo of [...esp.tipos, 'Normal']){
    for (const n of lista(tipo)){
      if (GOLPES[n].c === 'status' || vistos.has(n)) continue;
      resto.push({n, s: nota(n, GOLPES[n], esp.tipos.includes(GOLPES[n].t))});
    }
  }
  resto.sort((a,b) => b.s - a.s);
  while (escolhidos.length < 3 && resto.length) por(resto.shift().n);

  // 3) um golpe de status, se houver espaço e nível
  if (escolhidos.length < 4 && nivel >= 8){
    const status = [];
    for (const tipo of [...esp.tipos, 'Normal']){
      for (const n of lista(tipo)){
        if (GOLPES[n].c !== 'status' || vistos.has(n)) continue;
        status.push({n, s: nota(n, GOLPES[n], true)});
      }
    }
    status.sort((a,b) => b.s - a.s);
    if (status.length) por(status[0].n);
  }

  // 4) completa o que faltar
  while (escolhidos.length < 4 && resto.length) por(resto.shift().n);
  if (!escolhidos.length) por('Tackle');

  return escolhidos.map(n => ({nome:n, pp:GOLPES[n].pp, ppMax:GOLPES[n].pp}));
}

/* ============================================================
   DADOS — todas as rolagens passam por aqui e ficam registradas
   ============================================================ */
const Dados = {
  historico: [],

  rolar(faces, motivo=''){
    const v = Math.floor(Math.random() * faces) + 1;
    const reg = {dado:'d'+faces, valor:v, motivo, faces};
    this.historico.push(reg);
    if (this.historico.length > 200) this.historico.shift();
    if (typeof UI !== 'undefined' && UI.mostrarDado) UI.mostrarDado(reg);
    return v;
  },

  d4 (m){ return this.rolar(4, m); },
  d6 (m){ return this.rolar(6, m); },
  d10(m){ return this.rolar(10, m); },
  d20(m){ return this.rolar(20, m); },

  /* escolha aleatória simples (não entra no histórico) */
  escolher(arr){ return arr[Math.floor(Math.random() * arr.length)]; },
  entre(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; },
  chance(pct){ return Math.random() * 100 < pct; },

  /* TESTE DE PERÍCIA: 1d10 + status contra dificuldade
     1-3 fracasso total | 4-6 parcial | 7-9 sucesso | 10+ crítico */
  teste(valorStatus, dificuldade, nomeStatus=''){
    const d = this.d10('Teste de ' + (nomeStatus || 'perícia'));
    const total = d + valorStatus;
    let grau, texto;
    if (total <= 3)      { grau = 'falha';    texto = 'Fracasso total'; }
    else if (total <= 6) { grau = 'parcial';  texto = 'Sucesso parcial'; }
    else if (total <= 9) { grau = 'sucesso';  texto = 'Sucesso'; }
    else                 { grau = 'critico';  texto = 'Sucesso crítico'; }
    // a dificuldade pode rebaixar o grau
    if (total < dificuldade){
      grau = (total >= dificuldade - 2) ? 'parcial' : 'falha';
      texto = (grau === 'parcial') ? 'Sucesso parcial (por pouco)' : 'Fracasso';
    }
    return {dado:d, bonus:valorStatus, total, dificuldade, grau, texto};
  }
};

   ============================================================ */
const Mundo = {
  atual(){ return LOCAIS[Estado.dados.local] || LOCAIS.pallet; },
  id(){ return Estado.dados.local; },

  iniciar(cidadeNatal){
    const mapa = {'Pallet':'pallet','Viridian':'viridian','Pewter':'pewter','Cerulean':'cerulean',
      'Vermilion':'vermilion','Lavender':'lavender','Celadon':'celadon','Fuchsia':'fuchsia',
      'Saffron':'saffron','Cinnabar':'cinnabar','Indigo':'viridian'};
    Estado.dados.local = mapa[cidadeNatal] || 'pallet';
    Estado.dados.visitados = {[Estado.dados.local]:true};
    Estado.dados.descobertas = {};
    Estado.dados.relogio.periodo = 'manhã';
  },

  visitado(id){ return !!(Estado.dados.visitados||{})[id]; },
  marcarVisitado(id){ (Estado.dados.visitados = Estado.dados.visitados || {})[id] = true; },

  /* ---------- tempo ---------- */
  passar(periodos=1){
    const d = Estado.dados.relogio;
    let i = PERIODOS.indexOf(d.periodo || 'manhã');
    for (let k=0;k<periodos;k++){
      i++;
      if (i >= PERIODOS.length){ i = 0; d.dia++; }
    }
    d.periodo = PERIODOS[i];
    return d;
  },

  /* ---------- descobertas ---------- */
  descobriu(chave){ return !!(Estado.dados.descobertas||{})[chave]; },
  descobrir(chave){ (Estado.dados.descobertas = Estado.dados.descobertas || {})[chave] = true; },

  /* ---------- vizinhos ---------- */
  vizinhos(){
    const L = this.atual();
    return (L.conexoes||[]).filter(id => {
      const v = LOCAIS[id];
      if (!v) return false;
      if (v.oculto && !this.descobriu('local_'+id)) return false;
      return true;
    });
  },

  viajar(id){
    if (!LOCAIS[id]) return null;
    Estado.dados.local = id;
    this.marcarVisitado(id);
    this.passar(1);
    Estado.registrar(`Viajou para ${LOCAIS[id].nome}.`);
    return LOCAIS[id];
  }
};

function normalizar(txt){
  return String(txt||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^\w\s]/g,' ')
    .split(/\s+/).filter(p => p && !VAZIAS.has(p));
}

/* sem acento, para casar com o texto normalizado */
const INTENCOES_NORM = {};
for (const [k,v] of Object.entries(INTENCOES)){
  INTENCOES_NORM[k] = {peso:v.peso, palavras:v.palavras.map(p =>
    p.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase())};
}

/* radical: portugues conjuga demais para casar palavra inteira */
function radical(p){
  if (p.length <= 4) return p;
  return p.slice(0, Math.min(5, Math.max(4, p.length - 3)));
}

function intencoesDe(texto){
  const bruto = normalizar(texto).join(' ');
  const radicais = normalizar(texto).map(radical);
  const marcadas = {};
  for (const [nome, def] of Object.entries(INTENCOES_NORM)){
    let n = 0;
    for (const palavra of def.palavras){
      if (palavra.includes(' ')){ if (bruto.includes(palavra.replace(/\s+/g,' '))) n += 2; continue; }
      const r = radical(palavra);
      if (radicais.some(x => x === r || x.startsWith(r) || r.startsWith(x))) n++;
    }
    if (n) marcadas[nome] = Math.min(4, n) * def.peso;
  }
  return marcadas;
}


/* Quanto o texto do jogador se parece com o texto de uma escolha */
function semelhanca(txtJogador, txtEscolha){
  const a = new Set(normalizar(txtJogador));
  const b = normalizar(txtEscolha);
  if (!a.size || !b.length) return 0;
  let comuns = 0;
  const vistos = new Set();
  for (const p of b){
    if (vistos.has(p)) continue;
    vistos.add(p);
    if (a.has(p)) comuns += 1;
    else { const rp = radical(p); for (const q of a){ const rq = radical(q); if (rp === rq || rp.startsWith(rq) || rq.startsWith(rp)){ comuns += 0.7; break; } } }
  }
  return comuns / Math.max(3, vistos.size);
}

function afinidadeIntencao(intA, intB){
  let s = 0;
  for (const k of Object.keys(intA)) if (intB[k]) s += Math.min(intA[k], intB[k]);
  return s;
}

/* ============================================================
   INTERPRETAR: casa o que o jogador escreveu com as trilhas
   ============================================================ */
const Entrada = {
  interpretar(texto, escolhas){
    const t = String(texto||'').trim();
    if (!t) return null;
    const intJog = intencoesDe(t);

    let melhor = null, melhorNota = 0;
    escolhas.forEach((e, i) => {
      const rotulo = typeof e.texto === 'function' ? txt(e.texto) : e.texto;
      const alvo = rotulo + ' ' + (e.palavras || []).join(' ');
      const nota = semelhanca(t, alvo) * 2.2
                 + afinidadeIntencao(intJog, intencoesDe(alvo)) * 0.85;
      if (nota > melhorNota){ melhorNota = nota; melhor = {indice:i, escolha:e, nota, rotulo}; }
    });

    // encaixou numa trilha existente
    if (melhor && melhorNota >= 1.05) return {tipo:'trilha', ...melhor, intencoes:intJog};

    // não encaixou: o jogo improvisa a partir da intenção
    const dominante = Object.keys(intJog).sort((a,b)=>intJog[b]-intJog[a])[0] || null;
    return {tipo:'livre', intencao:dominante, intencoes:intJog, texto:t,
            sugestao: melhor, nota: melhorNota};
  },

  /* O que acontece quando o jogador faz algo que a cena não previu */
  improviso(intencao, cena){

   ============================================================ */

/* Fórmula padrão dos jogos (IVs aleatórios, sem EVs) */
function calcularStats(base, nivel, ivs, natureza){
  const nat = NATUREZAS[natureza] || NATUREZAS['Hardy'];
  const s = {};
  s.hp = Math.floor(((2*base.hp + ivs.hp) * nivel) / 100) + nivel + 10;
  for (const k of ['atk','def','spa','spd','spe']){
    let v = Math.floor(((2*base[k] + ivs[k]) * nivel) / 100) + 5;
    if (nat.mais === k)  v = Math.floor(v * 1.1);
    if (nat.menos === k) v = Math.floor(v * 0.9);
    s[k] = v;
  }
  return s;
}

function ivsAleatorios(){
  const o = {};
  for (const k of ['hp','atk','def','spa','spd','spe']) o[k] = Dados.entre(0,31);
  return o;
}

let _uidPokemon = 1;

function criarPokemon(dexId, nivel, opcoes={}){
  const esp = DEX[dexId];
  if (!esp) throw new Error('Pokémon inexistente: ' + dexId);
  const natureza = opcoes.natureza || Dados.escolher(NOMES_NATUREZAS);
  const ivs = opcoes.ivs || ivsAleatorios();
  const stats = calcularStats(esp.base, nivel, ivs, natureza);
  return {
    uid: 'p' + (_uidPokemon++) + '_' + Date.now().toString(36),
    dex: dexId,
    nome: esp.nome,
    apelido: opcoes.apelido || null,
    tipos: esp.tipos.slice(),
    nivel,
    natureza,
    ivs,
    stats,
    hp: stats.hp,
    hpMax: stats.hp,
    golpes: opcoes.golpes || montarGolpes(dexId, nivel),
    status: null,          // 'veneno'|'queimadura'|'paralisia'|'sono'|'congelamento'
    statusTurnos: 0,
    exp: 0,
    expProx: expNecessaria(nivel),
    moral: opcoes.moral !== undefined ? opcoes.moral : 70,  // vínculo com o treinador
    lendario: esp.lendario,
    selvagem: !!opcoes.selvagem,
    morto: false,
    historia: opcoes.historia || null,
    capturadoEm: opcoes.capturadoEm || null
  };
}

function nomeExib(p){ return p.apelido ? p.apelido + ' (' + p.nome + ')' : p.nome; }

function expNecessaria(nivel){ return Math.floor(Math.pow(nivel, 3) * 0.08) + nivel * 12 + 20; }

function expGanha(vencido, venceu){
  const esp = DEX[vencido.dex];
  const bruto = Math.floor((esp.total * vencido.nivel) / 22);
  return Math.max(6, bruto);
}

/* Sobe de nível, recalcula stats, aprende golpes novos. Retorna eventos. */
function ganharExp(p, qtd){
  const eventos = [];
  if (p.morto) return eventos;
  p.exp += qtd;
  eventos.push({tipo:'exp', qtd});
  while (p.exp >= p.expProx && p.nivel < 100){
    p.exp -= p.expProx;
    p.nivel++;
    const antes = p.stats;
    p.stats = calcularStats(DEX[p.dex].base, p.nivel, p.ivs, p.natureza);
    p.hp += (p.stats.hp - antes.hp);
    p.expProx = expNecessaria(p.nivel);
    eventos.push({tipo:'nivel', nivel:p.nivel});

    // aprender golpe novo
    const ideal = montarGolpes(p.dex, p.nivel);
    const atuais = p.golpes.map(g => g.nome);
    const novo = ideal.find(g => !atuais.includes(g.nome));
    if (novo){
      if (p.golpes.length < 4){
        p.golpes.push({...novo});
        eventos.push({tipo:'golpe', golpe:novo.nome});
      } else {
        // troca o golpe mais fraco se o novo for claramente melhor
        const poder = (n) => GOLPES[n].c === 'status' ? 20 : (GOLPES[n].p || 45);
        let iPior = 0;
        p.golpes.forEach((g,i) => { if (poder(g.nome) < poder(p.golpes[iPior].nome)) iPior = i; });
        if (poder(novo.nome) > poder(p.golpes[iPior].nome) + 15){
          const velho = p.golpes[iPior].nome;
          p.golpes[iPior] = {...novo};
          eventos.push({tipo:'golpe', golpe:novo.nome, esqueceu:velho});
        }
      }
    }

    // evolução por nível
    const esp = DEX[p.dex];
    if (esp.evo && esp.nivelEvo && p.nivel >= esp.nivelEvo){
      const antigo = p.nome;
      evoluir(p, esp.evo);
      eventos.push({tipo:'evolucao', de:antigo, para:p.nome});
    }
  }
  return eventos;
}

function evoluir(p, novoDex){
  const prop = p.hp / p.hpMax;
  p.dex = novoDex;
  p.nome = DEX[novoDex].nome;
  p.tipos = DEX[novoDex].tipos.slice();
  p.stats = calcularStats(DEX[novoDex].base, p.nivel, p.ivs, p.natureza);
  p.hpMax = p.stats.hp;
  p.hp = Math.max(1, Math.round(p.hpMax * prop));
  p.moral = Math.min(100, p.moral + 5);
}

function curarTotal(p){
  if (p.morto) return;
  p.hp = p.hpMax;
  p.status = null;
  p.statusTurnos = 0;
  p.golpes.forEach(g => g.pp = g.ppMax);
}

function estaVivo(p){ return !p.morto && p.hp > 0; }

/* Encontro selvagem: espécie e nível TOTALMENTE aleatórios,
   com o ambiente apenas enviesando a probabilidade. */
function sortearSelvagem(ambiente='campo', nivelBase=8){
  const tiposPref = VIES_AMBIENTE[ambiente] || [];
  let dexId;
  if (tiposPref.length && Dados.chance(65)){
    const candidatos = POOL_SELVAGEM.filter(d => DEX[d].tipos.some(t => tiposPref.includes(t)));
    dexId = Dados.escolher(candidatos.length ? candidatos : POOL_SELVAGEM);
  } else {
    dexId = Dados.escolher(POOL_SELVAGEM);   // qualquer um, em qualquer lugar
  }
  // nível: normalmente perto da faixa da área, mas com cauda longa (Lv30 na Rota 1 acontece)
  let nivel;
  const r = Dados.d20('Nível do selvagem');
  if (r === 20)      nivel = Dados.entre(nivelBase + 12, nivelBase + 28);
  else if (r >= 17)  nivel = Dados.entre(nivelBase + 5, nivelBase + 12);
  else if (r <= 2)   nivel = Math.max(2, Dados.entre(nivelBase - 6, nivelBase - 2));
  else               nivel = Math.max(2, Dados.entre(nivelBase - 3, nivelBase + 4));
  nivel = Math.min(70, nivel);
  return criarPokemon(dexId, nivel, {selvagem:true});
}

  'Great Ball':  {tipo:'bola', mult:1.5, desc:'Melhor que a comum. Não funciona em lendários.'},

  'Ração':       {tipo:'moral', valor:10, desc:'Comida boa. +10 de moral em um Pokémon.'}
