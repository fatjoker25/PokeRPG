const Estado = {
  dados: null,

  novo(ficha){
    const resistencia = 1;
    this.dados = {
      versao: 1,
      criadoEm: Date.now(),
      jogador: {
        nome: ficha.nome,
        genero: ficha.genero,
        aparencia: ficha.aparencia,
        personalidade: ficha.personalidade,
        vestimenta: ficha.vestimenta,
        cidade: ficha.cidade,
        objetivo: ficha.objetivo,
        idade: 15,
        hp: 30, hpMax: 30,
        status: {forca:1, percepcao:1, intelecto:1, carisma:1, sorte:1, resistencia:1},
        pontos: 0,
        dinheiro: 3000,
        cargo: null,
        ferimentos: []
      },
      reputacao: {eixo:'bom', bom:1, ruim:1, historico:[]},
      time: [],
      pc: [],                 // Pokémon depositados
      cemiterio: [],          // mortes permanentes — nunca some
      itens: {'Poké Ball':5, 'Potion':3, 'Bandagem':2},
      insignias: [],
      capitulo: 0,
      cena: null,
      modo: 'cena',
      local: 'pallet',
      visitados: {},
      descobertas: {},
      flags: {},
      npcs: {},               // memória: {nome:{conhece:true, opiniao:n, viuVoce:'...'}}
      lendarios: {},          // {dex:{estado:'livre|capturado|solto|morto', disposicao:'neutro|hostil|passivo|desconfiado', encontros:n}}
      liga: {avisos:0, ordemDevolucao:false, detencao:false},
      mundo: {clima:'normal', instabilidade:0, eventos:[]},
      config: {danoMult:1, ritmo:'fiel'},   // 'fiel' = 1d10×(poder÷10) puro
      via: 'neutro',          // heroi | mercenario | foragido | pesquisador
      viaAnterior: null,
      finaisVistos: [],
      log: [],
      relogio: {dia:1, periodo:'manhã'}
    };
    return this.dados;
  },

  get j(){ return this.dados.jogador; },
  get rep(){ return this.dados.reputacao; },

  /* ---------- REPUTAÇÃO ---------- */
  nivelRep(){
    const r = this.rep;
    return r.eixo === 'bom' ? NIVEIS_BOM[r.bom-1] : NIVEIS_RUIM[r.ruim-1];
  },
  nomeRep(){ return this.nivelRep().nome; },

  mudarRep(eixo, delta, motivo){
    const r = this.rep;
    if (delta === 0) return null;
    const antes = this.nomeRep();

    if (eixo === 'bom'){
      if (r.eixo === 'ruim' && r.ruim > 1){
        // ações boas primeiro lavam o eixo ruim
        r.ruim = Math.max(1, r.ruim - delta);
        if (r.ruim === 1){ r.eixo = 'bom'; r.bom = Math.max(r.bom, 2); }
      } else {
        r.eixo = 'bom';
        r.bom = Math.min(8, r.bom + delta);
      }
    } else {
      if (r.eixo === 'bom' && r.bom > 1){
        r.bom = Math.max(1, r.bom - delta);
        if (r.bom === 1){ r.eixo = 'ruim'; r.ruim = Math.max(r.ruim, 2); }
      } else {
        r.eixo = 'ruim';
        r.ruim = Math.min(8, r.ruim + delta);
      }
    }
    const depois = this.nomeRep();
    r.historico.push({motivo, eixo, delta, de:antes, para:depois, cap:this.dados.capitulo});
    this.registrar(`Reputação: ${antes} → ${depois} (${motivo})`);
    return {de:antes, para:depois, mudou:antes !== depois};
  },

  /* ---------- MEMÓRIA ---------- */
  registrar(texto){
    this.dados.log.push({cap:this.dados.capitulo, texto, dia:this.dados.relogio.dia});
    if (this.dados.log.length > 400) this.dados.log.shift();
  },
  marcar(flag, valor=true){ this.dados.flags[flag] = valor; },
  tem(flag){ return !!this.dados.flags[flag]; },

  lembrarNPC(nome, dados){
    const n = this.dados.npcs[nome] || {nome, opiniao:0, memorias:[]};
    Object.assign(n, dados);
    if (dados.memoria){ n.memorias.push({cap:this.dados.capitulo, texto:dados.memoria}); delete n.memoria; }
    this.dados.npcs[nome] = n;
    return n;
  },
  npc(nome){ return this.dados.npcs[nome] || null; },

  /* ---------- TIME ---------- */
  adicionar(p){
    if (this.dados.time.length < 6){ this.dados.time.push(p); return 'time'; }
    this.dados.pc.push(p); return 'pc';
  },
  removerDoTime(uid){
    const i = this.dados.time.findIndex(p => p.uid === uid);
    if (i >= 0) return this.dados.time.splice(i,1)[0];
    return null;
  },
  matar(p, causa){
    p.morto = true;
    p.hp = 0;
    p.causaMorte = causa;
    p.morreuNoCap = this.dados.capitulo;
    this.removerDoTime(p.uid);
    this.dados.cemiterio.push(p);
    this.registrar(`${nomeExib(p)} morreu. Causa: ${causa}`);
  },
  timeVivo(){ return this.dados.time.filter(p => estaVivo(p)); },
  primeiroApto(){ return this.dados.time.find(p => estaVivo(p)) || null; },

  /* ---------- ITENS ---------- */
  darItem(nome, qtd=1){ this.dados.itens[nome] = (this.dados.itens[nome]||0) + qtd; },
  usarItem(nome){
    if (!this.dados.itens[nome]) return false;
    this.dados.itens[nome]--;
    if (this.dados.itens[nome] <= 0) delete this.dados.itens[nome];
    return true;
  },
  contaItem(nome){ return this.dados.itens[nome] || 0; },

  /* ---------- JOGADOR ---------- */
  hpMaxJogador(){ return 30 + (this.j.status.resistencia - 1) * 2; },
  ferir(qtd, causa){
    this.j.hp = Math.max(0, this.j.hp - qtd);
    if (causa) this.j.ferimentos.push({causa, qtd, cap:this.dados.capitulo});
    this.registrar(`Você sofreu ${qtd} de dano (${causa||'?'}). HP: ${this.j.hp}/${this.hpMaxJogador()}`);
    return this.j.hp <= 0;
  },
  curarJogador(qtd){
    this.j.hp = Math.min(this.hpMaxJogador(), this.j.hp + qtd);
  },
  subirStatus(chave){
    const st = this.j.status;
    if (st[chave] >= 10) return false;
    st[chave]++;
    if (chave === 'resistencia') this.j.hp += 2;
    return true;
  },

  /* ---------- LENDÁRIOS ---------- */
  lend(dex){
    if (!this.dados.lendarios[dex]){
      this.dados.lendarios[dex] = {dex, estado:'livre', disposicao:'neutro', encontros:0, ataquesSofridos:0};
    }
    return this.dados.lendarios[dex];
  },
  lendariosCapturados(){
    return Object.values(this.dados.lendarios).filter(l => l.estado === 'capturado');
  },

  /* Manter lendário preso pesa com o tempo. Chamado ao fim de cada capítulo. */
  tickLendarios(){
    const avisos = [];
    const presos = this.lendariosCapturados();
    for (const L of presos){
      L.turnosPreso = (L.turnosPreso || 0) + 1;
      // segredo tem prazo de validade
      if (this.tem('lendario_oculto_' + L.dex) && L.turnosPreso >= 2){
        this.marcar('lendario_oculto_' + L.dex, false);
        this.marcar('captura_vista_' + L.dex);
        avisos.push(`Alguém falou. A captura de ${DEX[L.dex].nome} deixou de ser segredo.`);
        this.mudarRep('ruim', 2, `Descobriram ${DEX[L.dex].nome} com você`);
        this.dados.liga.avisos++;
      } else if (L.turnosPreso % 2 === 0){
        avisos.push(`${DEX[L.dex].nome} continua na sua bola. O mundo continua pagando por isso.`);
        this.mudarRep('ruim', 1, `Mantém ${DEX[L.dex].nome} em cativeiro`);
        this.dados.mundo.instabilidade++;
      }
      // o próprio lendário tenta fugir
      const p = [...this.dados.time, ...this.dados.pc].find(x => x.dex === L.dex);
      if (p && p.moral < 30 && Dados.chance(15)){
        avisos.push(`${DEX[L.dex].nome} rompeu a bola durante a noite e sumiu. Não deixou nada.`);
        this.removerDoTime(p.uid);
        const i = this.dados.pc.findIndex(x => x.uid === p.uid);
        if (i >= 0) this.dados.pc.splice(i,1);
        L.estado = 'livre';
        L.disposicao = 'hostil';
      }
    }
    return avisos;
  },

  /* ---------- SAVE / LOAD ---------- */
  salvar(slot='auto'){
    try {
      localStorage.setItem('pokerpg_save_' + slot, JSON.stringify(this.dados));
      return true;
    } catch(e){ return false; }
  },
  carregar(slot='auto'){
    try {
      const raw = localStorage.getItem('pokerpg_save_' + slot);
      if (!raw) return false;
      this.dados = JSON.parse(raw);
      return true;
    } catch(e){ return false; }
  },
  existeSave(slot='auto'){
    try { return !!localStorage.getItem('pokerpg_save_' + slot); } catch(e){ return false; }
  },
  apagarSave(slot='auto'){
    try { localStorage.removeItem('pokerpg_save_' + slot); } catch(e){}
  },

  /* ---------- CÓDICE DE FINAIS (sobrevive entre partidas) ---------- */
  registrarFinal(id, titulo){
    try {
      const raw = localStorage.getItem('pokerpg_finais');
      const lista = raw ? JSON.parse(raw) : [];
      if (!lista.find(f => f.id === id)){
        lista.push({id, titulo, quando: Date.now()});
        localStorage.setItem('pokerpg_finais', JSON.stringify(lista));
      }
      return lista;
    } catch(e){ return []; }
  },
  finaisDescobertos(){
    try { const raw = localStorage.getItem('pokerpg_finais'); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
};


/* ===== js/engine/captura.js ===== */
/* ============================================================
   CAPTURA
   Comuns: Poké/Great/Ultra/Master Ball
   Lendários: SÓ Ultra Ball (1d20: 1-2 captura) e Master Ball
   Mewtwo e Ho-Oh: 1d20 antes de tudo — 1-5 a bola QUEBRA
   ============================================================ */
const Captura = {
  tentar(alvo, nomeBola, batalha){
    const eventos = [];
    const ev = (t, txt) => eventos.push({tipo:t, texto:txt});
    const esp = DEX[alvo.dex];

    if (!Estado.contaItem(nomeBola)){
      ev('erro', `Você não tem ${nomeBola}.`);
      return {eventos, capturou:false};
    }

    // ---- lendários recusam bolas fracas
    if (esp.lendario && (nomeBola === 'Poké Ball' || nomeBola === 'Great Ball')){
      Estado.usarItem(nomeBola);
      ev('erro', `A ${nomeBola} bate em ${esp.nome} e cai no chão, aberta. Ela nem chega a tentar.`);
      ev('info', 'Só Ultra Ball e Master Ball prendem um lendário.');
      const L = Estado.lend(alvo.dex);
      L.ataquesSofridos++;
      return {eventos, capturou:false};
    }

    Estado.usarItem(nomeBola);

    // ---- QUEBRA-BOLAS: Mewtwo e Ho-Oh
    if (QUEBRA_BOLA.includes(alvo.dex)){
      const d = Dados.d20('A bola aguenta?');
      ev('info', `${esp.nome} é forte demais para uma bola comum suportar. 1d20 = ${d} (1-5 quebra)`);
      if (d <= 5){
        ev('perigo', `A esfera racha no ar. Um estalo seco — e ${esp.nome} está livre, com os olhos em você.`);
        const L = Estado.lend(alvo.dex);
        L.disposicao = 'hostil';
        L.quebrouBola = true;
        Estado.marcar('lendario_furioso_' + alvo.dex);
        Estado.registrar(`${esp.nome} quebrou uma ${nomeBola} e passou a te caçar.`);
        Estado.mudarRep('ruim', 1, `Provocou ${esp.nome}`);
        return {eventos, capturou:false, enfurecido:true};
      }
      ev('info', 'A bola aguenta. Por enquanto.');
    }

    // ---- Master Ball
    if (nomeBola === 'Master Ball'){
      ev('captura', 'A Master Ball se fecha. Um clique. Só isso.');
      return this.concluir(alvo, nomeBola, eventos);
    }

    // ---- lendário com Ultra Ball: 1d20, só 1-2 prende
    if (esp.lendario){
      const d = Dados.d20('Captura de lendário');
      ev('info', `Ultra Ball em um lendário: 1d20 = ${d} — só 1 ou 2 prendem.`);
      if (d <= 2){
        ev('captura', `Contra tudo que é provável, a bola para de tremer.`);
        return this.concluir(alvo, nomeBola, eventos);
      }
      ev('erro', `${esp.nome} rompe a bola sem esforço aparente.`);
      const L = Estado.lend(alvo.dex);
      L.ataquesSofridos++;
      if (L.ataquesSofridos >= 3 && L.disposicao === 'neutro'){
        L.disposicao = 'hostil';
        ev('perigo', `${esp.nome} decorou seu rosto. Agora é pessoal.`);
        Estado.registrar(`${esp.nome} tornou-se hostil por insistência.`);
      }
      return {eventos, capturou:false};
    }

    // ---- captura comum (estilo jogos)
    const bola = ITENS_INFO[nomeBola].mult;
    const propHP = alvo.hp / alvo.hpMax;
    let bonusStatus = 1;
    if (alvo.status === 'sono' || alvo.status === 'congelamento') bonusStatus = 2;
    else if (alvo.status) bonusStatus = 1.5;

    const taxa = esp.captura;
    const a = ((3 * alvo.hpMax - 2 * alvo.hp) / (3 * alvo.hpMax)) * taxa * bola * bonusStatus;
    const chance = Math.min(100, (a / 255) * 100);

    ev('info', `HP em ${Math.round(propHP*100)}%${alvo.status ? ', com '+alvo.status : ''} — chance de captura ≈ ${Math.round(chance)}%`);

    let sacudidas = 0;
    for (let i = 0; i < 3; i++){
      const d = Dados.d20('Sacudida ' + (i+1));
      const limite = Math.max(1, Math.round((chance / 100) * 20));
      if (d <= limite) sacudidas++;
      else break;
    }
    const nomes = ['A bola balança uma vez...', 'Duas vezes...', 'Três vezes...'];
    for (let i = 0; i < sacudidas; i++) ev('info', nomes[i]);

    if (sacudidas >= 3){
      ev('captura', 'CLIQUE.');
      return this.concluir(alvo, nomeBola, eventos);
    }
    ev('erro', `${alvo.nome} escapou da bola!`);
    return {eventos, capturou:false};
  },

  concluir(alvo, nomeBola, eventos){
    const ev = (t, txt) => eventos.push({tipo:t, texto:txt});
    const esp = DEX[alvo.dex];
    alvo.selvagem = false;
    alvo.capturadoEm = {cap:Estado.dados.capitulo, bola:nomeBola, dia:Estado.dados.relogio.dia};
    alvo.moral = esp.lendario ? 10 : 40;
    const destino = Estado.adicionar(alvo);
    ev('captura', `${esp.nome} (Nv ${alvo.nivel}, ${alvo.natureza}) foi capturado!` + (destino === 'pc' ? ' Foi direto para o PC — seu time está cheio.' : ''));
    Estado.registrar(`Capturou ${esp.nome} Nv${alvo.nivel} com ${nomeBola}.`);

    if (esp.lendario) this.consequenciasLendario(alvo, eventos);
    return {eventos, capturou:true};
  },

  /* ============================================================
     CONSEQUÊNCIAS EM CASCATA
     ============================================================ */
  consequenciasLendario(alvo, eventos){
    const ev = (t, txt) => eventos.push({tipo:t, texto:txt});
    const dex = alvo.dex;
    const L = Estado.lend(dex);
    L.estado = 'capturado';
    L.disposicao = 'prisioneiro';
    Estado.dados.mundo.instabilidade++;

    // reputação: capturar lendário SEMPRE move 2 níveis
    const testemunhado = Dados.chance(60) || Estado.rep.bom >= 5 || Estado.rep.ruim >= 4;
    if (testemunhado){
      Estado.marcar('captura_vista_' + dex);
      ev('mundo', 'Alguém viu. Sempre tem alguém vendo.');
      // como a comunidade reage depende de quem você era antes disso
      if (Estado.rep.eixo === 'bom' && Estado.rep.bom >= 4){
        Estado.mudarRep('bom', 2, `Capturou ${DEX[dex].nome} — e te chamaram de herói por isso`);
        ev('mundo', 'Por enquanto, chamam de feito. Enquanto ele continuar na sua bola, vão mudar de ideia.');
      } else {
        Estado.mudarRep('ruim', 2, `Capturou ${DEX[dex].nome} diante de testemunhas`);
      }
    } else {
      // ninguém viu: nenhuma reputação ainda — mas o segredo tem prazo de validade
      Estado.marcar('lendario_oculto_' + dex);
      ev('mundo', 'Ninguém viu. Ainda assim, o mundo sentiu — e o mundo conta depois.');
    }

    // --- Cães Lendários
    if (GRUPO_CAES.includes(dex)){
      const outros = GRUPO_CAES.filter(d => d !== dex);
      const presos = GRUPO_CAES.filter(d => Estado.lend(d).estado === 'capturado');
      outros.forEach(d => {
        const o = Estado.lend(d);
        if (o.estado !== 'capturado'){ o.disposicao = 'hostil'; o.caçandoVoce = true; }
      });
      ev('mundo', `Em algum lugar de Kanto, ${outros.map(d=>DEX[d].nome).join(' e ')} param de correr ao mesmo tempo. E mudam de direção — na sua.`);
      Estado.registrar(`Cães lendários começaram a caçar você.`);
      if (presos.length === 2){
        ev('mundo', 'O terceiro cão não vai só te caçar. Vai abrir caminho até você, pelo meio do que estiver na frente.');
        Estado.dados.mundo.instabilidade += 2;
      }
      if (presos.length === 3){
        ev('mundo', 'O equilíbrio quebrou. Incêndios sem fonte. Tempestades sem nuvem. Rotas congeladas em pleno verão.');
        Estado.dados.mundo.clima = 'caotico';
        Estado.dados.mundo.instabilidade += 5;
        Estado.marcar('equilibrio_rompido');
      }
    }

    // --- Aves Lendárias
    if (GRUPO_AVES.includes(dex)){
      const outras = GRUPO_AVES.filter(d => d !== dex);
      const presas = GRUPO_AVES.filter(d => Estado.lend(d).estado === 'capturado');
      outras.forEach(d => {
        const o = Estado.lend(d);
        if (o.estado !== 'capturado'){ o.disposicao = 'hostil'; o.caçandoVoce = true; }
      });
      ev('mundo', `O céu muda de cor. ${outras.map(d=>DEX[d].nome).join(' e ')} sentiram a ausência.`);
      Estado.dados.mundo.clima = 'instavel';
      if (presas.length === 3){
        ev('mundo', 'Kanto não tem mais estações. Só episódios.');
        Estado.dados.mundo.clima = 'permanentemente instável';
        Estado.dados.mundo.instabilidade += 5;
        Estado.marcar('clima_quebrado');
      }
    }

    // --- Ho-Oh
    if (dex === 250){
      ev('mundo', 'O mundo sente a falta. Pokémon que ninguém vê há décadas aparecem em lugares errados, confusos.');
      Estado.dados.mundo.instabilidade += 3;
      Estado.marcar('ho_oh_capturado');
      ev('mundo', 'E algo enorme, que nunca pertenceu a Kanto, começa a se mover em direção à costa.');
      Estado.marcar('lugia_chamado');
    }

    // --- Mewtwo
    if (dex === 150){
      ev('mundo', 'Em Cinnabar, um computador que ninguém liga há anos acende sozinho.');
      Estado.marcar('mewtwo_capturado');
      Estado.dados.mundo.instabilidade += 4;
    }

    // --- Mew
    if (dex === 151){
      ev('mundo', 'Mew cabe na sua mão e não parece preso. Isso é pior.');
      Estado.marcar('mew_capturado');
      ev('mundo', 'Três dias depois, gente de jaleco começa a perguntar seu nome em postos de estrada.');
      Estado.marcar('cientistas_atras');
    }

    // --- A Liga reage
    if (testemunhado) this.ligaReage(eventos);
  },

  ligaReage(eventos){
    const ev = (t, txt) => eventos.push({tipo:t, texto:txt});
    const liga = Estado.dados.liga;
    liga.avisos++;
    if (liga.avisos === 1){
      ev('liga', 'A Liga Pokémon vai querer conversar. Eles sempre começam conversando.');
      Estado.marcar('liga_aviso_1');
    } else if (liga.avisos === 2){
      liga.ordemDevolucao = true;
      ev('liga', 'Segunda vez. Ordem formal de devolução — e alguém de terno te seguindo a três quarteirões de distância.');
      Estado.marcar('liga_aviso_2');
    } else if (liga.avisos >= 3){
      liga.detencao = true;
      ev('liga', 'Terceira vez. Ordem de detenção emitida. Treinadores da Liga estão autorizados a te capturar.');
      Estado.marcar('liga_detencao');
      Estado.mudarRep('ruim', 1, 'Ordem de detenção da Liga');
    }
  },

  /* ---------- soltar um lendário ---------- */
  soltar(p){
    const eventos = [];
    const ev = (t, txt) => eventos.push({tipo:t, texto:txt});
    const esp = DEX[p.dex];
    Estado.removerDoTime(p.uid);
    const i = Estado.dados.pc.findIndex(x => x.uid === p.uid);
    if (i >= 0) Estado.dados.pc.splice(i,1);

    if (esp.lendario){
      const L = Estado.lend(p.dex);
      L.estado = 'solto';
      L.disposicao = 'desconfiado';
      Estado.dados.mundo.instabilidade = Math.max(0, Estado.dados.mundo.instabilidade - 1);
      ev('mundo', `${esp.nome} sai da bola e não ataca. Fica parado, te olhando, tempo demais. Depois vai embora.`);
      ev('mundo', 'Ele não vai te ajudar. Mas também não vai te caçar.');
      // os outros do grupo param de caçar, mas não esquecem
      [...GRUPO_CAES, ...GRUPO_AVES].forEach(d => {
        const o = Estado.dados.lendarios[d];
        if (o && o.caçandoVoce && Estado.lend(d).estado !== 'capturado'){
          o.caçandoVoce = false;
          o.disposicao = 'desconfiado';
        }
      });
      Estado.mudarRep('bom', 1, `Libertou ${esp.nome}`);
      ev('mundo', 'A notícia corre mais rápido que a da captura. Mas o trauma fica — as pessoas lembram das duas coisas.');
      Estado.registrar(`Soltou ${esp.nome}.`);
      Estado.marcar('soltou_lendario_' + p.dex);
    } else {
      ev('info', `${nomeExib(p)} foi solto. Ele olha para trás uma vez antes de sumir.`);
      Estado.registrar(`Soltou ${nomeExib(p)}.`);
    }
    return eventos;
  }
};


/* ===== js/engine/batalha.js ===== */
/* ============================================================
   COMBATE — turnos por Velocidade, tipos, PP, status, dados
   Dano: 1d10 × (poder ÷ 10), modificado por stats, tipo, STAB, crítico
   Precisão: 1d20 > (100-precisão)/5
   Crítico: 1d20 = 20 → ×1.5
   ============================================================ */

const ESTAGIO_MULT = {'-6':0.25,'-5':0.28,'-4':0.33,'-3':0.4,'-2':0.5,'-1':0.66,'0':1,'1':1.5,'2':2,'3':2.5,'4':3,'5':3.5,'6':4};

const Batalha = {
  ativo:false, aliado:null, inimigo:null, tipo:'selvagem',
  turno:0, fuga:true, eventos:[], fim:null, fase:'normal',
  estAliado:null, estInimigo:null, aoTerminar:null, contexto:null,

  /* ---------- ciclo de vida ---------- */
  iniciar(aliado, inimigo, opts={}){
    this.ativo = true;
    this.aliado = aliado;
    this.inimigo = inimigo;
    this.tipo = opts.tipo || 'selvagem';
    this.fuga = opts.fuga !== false;
    this.turno = 0;
    this.fim = null;
    this.fase = 'normal';
    this.eventos = [];
    this.aoTerminar = opts.aoTerminar || null;
    this.contexto = opts.contexto || null;
    this.treinador = opts.treinador || null;
    this.timeInimigo = opts.timeInimigo || null;
    this.estAliado = this.novoEstado();
    this.estInimigo = this.novoEstado();
    this.ev('inicio', opts.introducao || this.introPadrao());
    return this.eventos;
  },

  novoEstado(){
    return {atk:0, def:0, spa:0, spd:0, spe:0, precisao:0, confuso:0, preso:0, carregando:null, recarregando:false};
  },

  introPadrao(){
    if (this.tipo === 'selvagem') return `Um ${this.inimigo.nome} selvagem (Nv ${this.inimigo.nivel}, ${this.inimigo.natureza}) aparece!`;
    if (this.tipo === 'lendario') return `${this.inimigo.nome} encara você. O ar fica pesado.`;
    return `${this.treinador || 'Um treinador'} enviou ${this.inimigo.nome} (Nv ${this.inimigo.nivel})!`;
  },

  ev(tipo, texto, extra){ this.eventos.push(Object.assign({tipo, texto}, extra||{})); },

  /* ---------- utilidades ---------- */
  mult(est, chave){ return ESTAGIO_MULT[String(Math.max(-6, Math.min(6, est[chave])))] || 1; },

  statEfetivo(p, est, chave){
    let v = p.stats[chave] * this.mult(est, chave);
    if (chave === 'spe' && p.status === 'paralisia') v *= 0.5;
    if (chave === 'atk' && p.status === 'queimadura') v *= 0.75;
    return Math.max(1, Math.floor(v));
  },

  /* ---------- naturezas: o bicho tem vontade própria ---------- */
  vontade(p, golpeNome, souAliado){
    const nat = NATUREZAS[p.natureza] || {};
    const g = GOLPES[golpeNome];
    const moral = souAliado ? (p.moral !== undefined ? p.moral : 70) : 50;
    // cada insígnia conquistada faz o time confiar mais nas suas ordens
    const insignias = (Estado.dados && Estado.dados.insignias) ? Estado.dados.insignias.length : 0;
    const desobedienciaBase = souAliado ? Math.max(0, (60 - moral) / 2 - insignias * 3) : 0;

    if (p.natureza === 'Brave' && g.c === 'esp' && Dados.chance(35))
      return {recusa:true, texto:`${nomeExib(p)} é Brave — recusa o golpe especial. Quer sentir o impacto.`};
    if (p.natureza === 'Timid' && g.c === 'fis' && Dados.chance(30))
      return {recusa:true, texto:`${nomeExib(p)} é Timid — hesita em chegar perto e não ataca.`};
    if (p.natureza === 'Naughty' && Dados.chance(18))
      return {trocaAlvo:true, texto:`${nomeExib(p)} é Naughty — usa o golpe do jeito errado, de propósito.`};
    if ((p.natureza === 'Hasty' || p.natureza === 'Lonely') && Dados.chance(15))
      return {outroGolpe:true, texto:`${nomeExib(p)} não espera o comando e ataca por conta própria.`};
    if (desobedienciaBase > 0 && Dados.chance(desobedienciaBase))
      return {recusa:true, texto:`${nomeExib(p)} ignora sua ordem. O vínculo entre vocês está fraco.`};
    return null;
  },

  /* ---------- pode agir? ---------- */
  podeAgir(p, est, souAliado){
    if (p.status === 'sono'){
      p.statusTurnos--;
      if (p.statusTurnos <= 0){ p.status = null; this.ev('status', `${nomeExib(p)} acordou!`); }
      else { this.ev('status', `${nomeExib(p)} está dormindo profundamente.`); return false; }
    }
    if (p.status === 'congelamento'){
      if (Dados.chance(20)){ p.status = null; this.ev('status', `${nomeExib(p)} descongelou!`); }
      else { this.ev('status', `${nomeExib(p)} está congelado e não consegue se mover.`); return false; }
    }
    if (p.status === 'paralisia' && Dados.chance(25)){
      this.ev('status', `${nomeExib(p)} está paralisado! Não conseguiu se mover.`); return false;
    }
    if (est.recarregando){
      est.recarregando = false;
      this.ev('status', `${nomeExib(p)} precisa se recuperar do golpe anterior.`); return false;
    }
    if (est.confuso > 0){
      est.confuso--;
      if (est.confuso === 0) this.ev('status', `${nomeExib(p)} saiu da confusão.`);
      else if (Dados.chance(33)){
        const d = Math.max(1, Math.round(Dados.d10('Dano de confusão') * 4 * (p.stats.atk / Math.max(1,p.stats.def))));
        p.hp = Math.max(0, p.hp - d);
        this.ev('dano', `${nomeExib(p)} está confuso e se machucou sozinho! (${d} de dano)`);
        return false;
      } else {
        this.ev('status', `${nomeExib(p)} está confuso...`);
      }
    }
    return true;
  },

  /* ---------- dano ---------- */
  calcularDano(atk, def, estAtk, estDef, golpeNome){
    const g = GOLPES[golpeNome];
    const res = {dano:0, critico:false, efic:1, msgs:[]};

    res.efic = eficacia(g.t, def.tipos);
    if (res.efic === 0){
      res.msgs.push(`Não afeta ${nomeExib(def)}...`);
      return res;
    }

    if (g.ef && g.ef.nivel){                      // Seismic Toss / Night Shade
      res.dano = atk.nivel;
      res.msgs.push(`Dano igual ao nível: ${res.dano}`);
      return res;
    }
    if (g.ef && g.ef.fixo){                       // Dragon Rage
      res.dano = g.ef.fixo;
      res.msgs.push(`Dano fixo: ${res.dano}`);
      return res;
    }

    const fisico = g.c === 'fis';
    const a = this.statEfetivo(atk, estAtk, fisico ? 'atk' : 'spa');
    const d = this.statEfetivo(def, estDef, fisico ? 'def' : 'spd');
    const razao = Math.max(0.45, Math.min(2.2, a / Math.max(1, d)));

    const golpes = (g.ef && g.ef.golpes) ? g.ef.golpes : 1;
    let total = 0;
    for (let i = 0; i < golpes; i++){
      const d10 = Dados.d10(`Dano de ${golpeNome}`);
      total += Math.round(d10 * (g.p / 10) * razao);
    }
    if (golpes > 1) res.msgs.push(`Acertou ${golpes} vezes!`);

    const dCrit = Dados.d20('Crítico');
    if (dCrit === 20 || (g.ef && g.ef.critico && dCrit >= 18)){
      res.critico = true;
      total = Math.round(total * 1.5);
      res.msgs.push('ACERTO CRÍTICO!');
    }

    if (atk.tipos.includes(g.t)) total = Math.round(total * 1.5);   // STAB
    total = Math.round(total * res.efic);
    const txt = textoEficacia(res.efic);
    if (txt) res.msgs.push(txt);

    const cfg = (Estado.dados && Estado.dados.config) ? Estado.dados.config.danoMult : 1;
    res.dano = Math.max(1, Math.round(total * (cfg || 1)));
    return res;
  },

  acertou(golpeNome, estAtk, estDef){
    const g = GOLPES[golpeNome];
    if (g.a >= 999) return true;
    let prec = g.a;
    prec *= this.mult(estAtk, 'precisao');
    const limite = Math.floor((100 - Math.min(100, prec)) / 5);
    const d = Dados.d20(`Precisão de ${golpeNome}`);
    return d > limite;
  },

  aplicarStatus(alvo, tipoStatus, grave){
    if (tipoStatus === 'recuo') return false;
    if (alvo.status) return false;
    if (tipoStatus === 'veneno' && alvo.tipos.includes('Venenoso')) return false;
    if (tipoStatus === 'queimadura' && alvo.tipos.includes('Fogo')) return false;
    if (tipoStatus === 'congelamento' && alvo.tipos.includes('Gelo')) return false;
    if (tipoStatus === 'paralisia' && alvo.tipos.includes('Elétrico')) return false;
    alvo.status = tipoStatus;
    alvo.statusGrave = !!grave;
    alvo.statusTurnos = tipoStatus === 'sono' ? Dados.entre(1,3) : 0;
    return true;
  },

  /* ---------- um golpe ---------- */
  usarGolpe(atacante, defensor, estAtk, estDef, indiceGolpe, souAliado){
    const slot = atacante.golpes[indiceGolpe];
    if (!slot){ this.ev('info', `${nomeExib(atacante)} não tem esse golpe.`); return; }
    if (slot.pp <= 0){
      this.ev('info', `${nomeExib(atacante)} está sem PP em ${slot.nome} — usa Forcejar!`);
      const d = Math.max(1, Math.round(Dados.d10('Forcejar') * 3));
      defensor.hp = Math.max(0, defensor.hp - d);
      atacante.hp = Math.max(0, atacante.hp - Math.round(d * 0.25));
      this.ev('dano', `${nomeExib(defensor)} sofreu ${d}. ${nomeExib(atacante)} se machucou no contragolpe.`);
      return;
    }

    let nome = slot.nome;
    const v = this.vontade(atacante, nome, souAliado);
    if (v){
      this.ev('natureza', v.texto);
      if (v.recusa) return;
      if (v.outroGolpe){
        const outros = atacante.golpes.filter((g,i) => i !== indiceGolpe && g.pp > 0);
        if (outros.length){ const alt = Dados.escolher(outros); nome = alt.nome; alt.pp--; }
        else slot.pp--;
      } else slot.pp--;
    } else slot.pp--;

    const g = GOLPES[nome];

    // golpes de carga (Dig, Fly, Solar Beam, Sky Attack)
    if (g.ef && g.ef.carga && estAtk.carregando !== nome){
      estAtk.carregando = nome;
      this.ev('info', `${nomeExib(atacante)} se prepara para ${nome}!`);
      return;
    }
    estAtk.carregando = null;

    this.ev('golpe', `${nomeExib(atacante)} usou ${nome}!`, {golpe:nome, tipoGolpe:g.t});

    if (!this.acertou(nome, estAtk, estDef)){
      this.ev('erro', `${nomeExib(atacante)} errou o golpe!`);
      return;
    }

    if (g.c === 'status'){
      this.efeitoStatus(atacante, defensor, estAtk, estDef, g, nome);
      return;
    }

    if (g.ef && g.ef.soDormindo && defensor.status !== 'sono'){
      this.ev('erro', `${nome} só funciona em alvos dormindo. Nada acontece.`);
      return;
    }

    const r = this.calcularDano(atacante, defensor, estAtk, estDef, nome);
    r.msgs.forEach(m => this.ev('info', m));
    if (r.efic === 0) return;

    defensor.hp = Math.max(0, defensor.hp - r.dano);
    this.ev('dano', `${nomeExib(defensor)} sofreu ${r.dano} de dano. (${defensor.hp}/${defensor.hpMax})`, {alvo:souAliado?'inimigo':'aliado', dano:r.dano});

    if (g.ef && g.ef.drena){
      const cura = Math.max(1, Math.round(r.dano * g.ef.drena));
      atacante.hp = Math.min(atacante.hpMax, atacante.hp + cura);
      this.ev('cura', `${nomeExib(atacante)} drenou ${cura} de HP.`);
    }
    if (g.ef && g.ef.recuo){
      const rec = Math.max(1, Math.round(r.dano * g.ef.recuo));
      atacante.hp = Math.max(0, atacante.hp - rec);
      this.ev('dano', `${nomeExib(atacante)} sofreu ${rec} de recuo.`);
    }
    if (g.ef && g.ef.recarga) estAtk.recarregando = true;
    if (g.ef && g.ef.confundeSe && Dados.chance(50)){
      estAtk.confuso = Dados.entre(2,4);
      this.ev('status', `${nomeExib(atacante)} ficou confuso pela própria fúria!`);
    }
    if (g.ef && g.ef.tipo && g.ef.chance && defensor.hp > 0 && Dados.chance(g.ef.chance)){
      if (g.ef.tipo === 'confusao'){
        estDef.confuso = Dados.entre(2,4);
        this.ev('status', `${nomeExib(defensor)} ficou confuso!`);
      } else if (g.ef.tipo === 'recuo'){
        estDef.recuou = true;
        this.ev('status', `${nomeExib(defensor)} se encolheu de medo!`);
      } else if (this.aplicarStatus(defensor, g.ef.tipo, g.ef.grave)){
        this.ev('status', `${nomeExib(defensor)} está com ${g.ef.tipo}!`);
      }
    }
    if (g.ef && g.ef.baixa && defensor.hp > 0){
      estDef[g.ef.baixa] = Math.max(-6, (estDef[g.ef.baixa]||0) - 1);
      this.ev('status', `${g.ef.baixa.toUpperCase()} de ${nomeExib(defensor)} caiu!`);
    }
  },

  efeitoStatus(atacante, defensor, estAtk, estDef, g, nome){
    const e = g.ef || {};
    if (e.cura){
      const antes = atacante.hp;
      atacante.hp = Math.min(atacante.hpMax, atacante.hp + Math.round(atacante.hpMax * e.cura));
      if (e.dorme){ atacante.status = 'sono'; atacante.statusTurnos = 2; }
      this.ev('cura', `${nomeExib(atacante)} recuperou ${atacante.hp - antes} de HP.`);
      return;
    }
    if (e.sobe){
      const q = e.forte ? 2 : 1;
      estAtk[e.sobe] = Math.min(6, (estAtk[e.sobe]||0) + q);
      this.ev('status', `${e.sobe.toUpperCase()} de ${nomeExib(atacante)} ${e.forte?'subiu MUITO':'subiu'}!`);
      return;
    }
    if (e.baixa){
      const q = e.forte ? 2 : 1;
      estDef[e.baixa] = Math.max(-6, (estDef[e.baixa]||0) - q);
      this.ev('status', `${e.baixa.toUpperCase()} de ${nomeExib(defensor)} ${e.forte?'despencou':'caiu'}!`);
      return;
    }
    if (e.tipo === 'confusao'){
      estDef.confuso = Dados.entre(2,4);
      this.ev('status', `${nomeExib(defensor)} ficou confuso!`);
      return;
    }
    if (e.tipo){
      if (this.aplicarStatus(defensor, e.tipo, e.grave))
        this.ev('status', `${nomeExib(defensor)} está com ${e.tipo}${e.grave?' GRAVE':''}!`);
      else
        this.ev('erro', `Não teve efeito em ${nomeExib(defensor)}.`);
    }
  },

  /* ---------- fim de turno ---------- */
  fimDeTurno(p, est, quem){
    if (p.hp <= 0) return;
    if (p.status === 'veneno'){
      const frac = p.statusGrave ? 6 : 8;
      const d = Math.max(1, Math.floor(p.hpMax / frac));
      p.hp = Math.max(0, p.hp - d);
      this.ev('dano', `${nomeExib(p)} sofre ${d} pelo veneno. (${p.hp}/${p.hpMax})`);
    }
    if (p.status === 'queimadura'){
      const d = Math.max(1, Math.floor(p.hpMax / 16));
      p.hp = Math.max(0, p.hp - d);
      this.ev('dano', `${nomeExib(p)} sofre ${d} pela queimadura. (${p.hp}/${p.hpMax})`);
    }
  },

  /* ---------- IA ---------- */
  iaEscolher(p, alvo, estP, estAlvo){
    const disponiveis = p.golpes.map((g,i) => ({i, g})).filter(x => x.g.pp > 0);
    if (!disponiveis.length) return 0;
    const nat = NATUREZAS[p.natureza] || {};
    const pontuar = (x) => {
      const G = GOLPES[x.g.nome];
      if (G.c === 'status'){
        if (alvo.status || (G.ef && G.ef.tipo && alvo.status)) return 5;
        return (p.hp / p.hpMax > 0.6) ? 45 : 20;
      }
      const ef = eficacia(G.t, alvo.tipos);
      if (ef === 0) return 0;
      const fis = G.c === 'fis';
      const a = this.statEfetivo(p, estP, fis ? 'atk' : 'spa');
      const d = this.statEfetivo(alvo, estAlvo, fis ? 'def' : 'spd');
      let s = (G.p || 45) * ef * Math.min(2.2, a / Math.max(1,d)) * (G.a >= 999 ? 1 : G.a/100);
      if (p.tipos.includes(G.t)) s *= 1.5;
      if (nat.agressiva) s *= 1.1;
      return s;
    };
    disponiveis.sort((a,b) => pontuar(b) - pontuar(a));
    // não é uma máquina perfeita: às vezes erra a escolha
    if (disponiveis.length > 1 && Dados.chance(22)) return disponiveis[1].i;
    return disponiveis[0].i;
  },

  /* ---------- AÇÃO DO JOGADOR: resolve o turno inteiro ---------- */
  acao(acao){
    this.eventos = [];
    if (!this.ativo) return {eventos:[], fim:this.fim};
    this.turno++;

    if (this.fase === 'ameaca') return this.acaoAmeaca(acao);

    // ações que não gastam o turno de golpe
    if (acao.tipo === 'fugir')  return this.tentarFugir();
    if (acao.tipo === 'bola')   return this.tentarCaptura(acao.nome);
    if (acao.tipo === 'item')   { this.usarItemEmCombate(acao.nome, acao.alvoUid); return this.turnoInimigoSozinho(); }
    if (acao.tipo === 'trocar') { this.trocarPokemon(acao.uid); return this.turnoInimigoSozinho(); }

    // ordem por velocidade (prioridade primeiro)
    const gJog = GOLPES[this.aliado.golpes[acao.indice]?.nome || 'Tackle'];
    const iIA  = this.iaEscolher(this.inimigo, this.aliado, this.estInimigo, this.estAliado);
    const gIA  = GOLPES[this.inimigo.golpes[iIA]?.nome || 'Tackle'];
    const prioJ = (gJog.ef && gJog.ef.prioridade) || 0;
    const prioI = (gIA.ef && gIA.ef.prioridade) || 0;
    const vJ = this.statEfetivo(this.aliado, this.estAliado, 'spe');
    const vI = this.statEfetivo(this.inimigo, this.estInimigo, 'spe');
    let jogadorPrimeiro;
    if (prioJ !== prioI) jogadorPrimeiro = prioJ > prioI;
    else if (vJ !== vI)  jogadorPrimeiro = vJ > vI;
    else                 jogadorPrimeiro = Dados.chance(50);

    this.ev('turno', `— Turno ${this.turno} — (Vel ${vJ} vs ${vI})`);

    const agirJogador = () => {
      if (this.aliado.hp <= 0 || this.inimigo.hp <= 0) return;
      if (this.estAliado.recuou){ this.estAliado.recuou = false; this.ev('status', `${nomeExib(this.aliado)} está encolhido e não ataca.`); return; }
      if (!this.podeAgir(this.aliado, this.estAliado, true)) return;
      this.usarGolpe(this.aliado, this.inimigo, this.estAliado, this.estInimigo, acao.indice, true);
    };
    const agirInimigo = () => {
      if (this.aliado.hp <= 0 || this.inimigo.hp <= 0) return;
      if (this.estInimigo.recuou){ this.estInimigo.recuou = false; this.ev('status', `${nomeExib(this.inimigo)} está encolhido e não ataca.`); return; }
      if (!this.podeAgir(this.inimigo, this.estInimigo, false)) return;
      this.usarGolpe(this.inimigo, this.aliado, this.estInimigo, this.estAliado, iIA, false);
    };

    if (jogadorPrimeiro){ agirJogador(); agirInimigo(); }
    else { agirInimigo(); agirJogador(); }

    if (this.aliado.hp > 0 && this.inimigo.hp > 0){
      this.fimDeTurno(this.aliado, this.estAliado, 'aliado');
      this.fimDeTurno(this.inimigo, this.estInimigo, 'inimigo');
    }
    return this.verificarFim();
  },

  turnoInimigoSozinho(){
    if (this.inimigo.hp > 0 && this.aliado.hp > 0){
      if (this.podeAgir(this.inimigo, this.estInimigo, false)){
        const i = this.iaEscolher(this.inimigo, this.aliado, this.estInimigo, this.estAliado);
        this.usarGolpe(this.inimigo, this.aliado, this.estInimigo, this.estAliado, i, false);
      }
      this.fimDeTurno(this.aliado, this.estAliado);
      this.fimDeTurno(this.inimigo, this.estInimigo);
    }
    return this.verificarFim();
  },

  /* ---------- itens e troca ---------- */
  usarItemEmCombate(nome, alvoUid){
    const info = ITENS_INFO[nome];
    if (!info || !Estado.contaItem(nome)){ this.ev('erro', 'Você não tem esse item.'); return; }
    const alvo = Estado.dados.time.find(p => p.uid === alvoUid) || this.aliado;
    if (info.tipo === 'cura'){
      if (alvo.hp <= 0 && !alvo.morto){ this.ev('erro', `${nomeExib(alvo)} está desmaiado — Potion não resolve.`); return; }
      Estado.usarItem(nome);
      const antes = alvo.hp;
      alvo.hp = Math.min(alvo.hpMax, alvo.hp + info.valor);
      this.ev('cura', `Você usou ${nome}. ${nomeExib(alvo)} recuperou ${alvo.hp - antes} de HP.`);
    } else if (info.tipo === 'revive'){
      if (alvo.morto){ this.ev('erro', `${nomeExib(alvo)} está morto. Revive não traz os mortos de volta.`); return; }
      if (alvo.hp > 0){ this.ev('erro', `${nomeExib(alvo)} não está desmaiado.`); return; }
      Estado.usarItem(nome);
      alvo.hp = Math.floor(alvo.hpMax / 2);
      this.ev('cura', `${nomeExib(alvo)} voltou a si com ${alvo.hp} de HP.`);
    } else if (info.tipo === 'status'){
      Estado.usarItem(nome);
      alvo.status = null; alvo.statusTurnos = 0;
      this.ev('cura', `${nomeExib(alvo)} teve as condições curadas.`);
    } else if (info.tipo === 'curaJogador'){
      Estado.usarItem(nome);
      Estado.curarJogador(info.valor);
      this.ev('cura', `Você se enfaixou. HP: ${Estado.j.hp}/${Estado.hpMaxJogador()}`);
    } else {
      this.ev('erro', 'Esse item não serve aqui.');
    }
  },

  trocarPokemon(uid){
    const novo = Estado.dados.time.find(p => p.uid === uid);
    if (!novo || !estaVivo(novo)){ this.ev('erro', 'Esse Pokémon não pode lutar.'); return; }
    this.ev('info', `${nomeExib(this.aliado)} volta. Vai, ${nomeExib(novo)}!`);
    this.aliado = novo;
    this.estAliado = this.novoEstado();
  },

  /* ---------- fuga ---------- */
  tentarFugir(){
    if (!this.fuga){ this.ev('erro', 'Não dá para fugir daqui.'); return this.turnoInimigoSozinho(); }
    const alvo = this.inimigo.stats.spe - this.aliado.stats.spe + 10;
    const d = Dados.d20('Fuga');
    this.ev('info', `Fuga: 1d20 = ${d} — precisa ≥ ${alvo}`);
    if (d >= alvo){
      this.ev('fuga', 'Você conseguiu escapar!');
      return this.encerrar('fuga');
    }
    this.ev('erro', 'Não deu para escapar!');
    return this.turnoInimigoSozinho();
  },

  /* ---------- captura ---------- */
  tentarCaptura(nomeBola){
    const r = Captura.tentar(this.inimigo, nomeBola, this);
    r.eventos.forEach(e => this.eventos.push(e));
    if (r.capturou) return this.encerrar('captura', {pokemon:this.inimigo, bola:nomeBola});
    if (r.enfurecido){
      this.ev('perigo', `${this.inimigo.nome} está FURIOSO. Isso não vai acabar bem.`);
      return this.turnoInimigoSozinho();
    }
    return this.turnoInimigoSozinho();
  },

  /* ---------- verificação de fim ---------- */
  verificarFim(){
    if (this.inimigo.hp <= 0){
      this.ev('vitoria', this.tipo === 'selvagem'
        ? `${this.inimigo.nome} desmaiou e fugiu para o mato. Ele vai voltar.`
        : `${this.inimigo.nome} desmaiou!`);
      const ganho = expGanha(this.inimigo, this.aliado);
      const evs = ganharExp(this.aliado, ganho);
      this.ev('exp', `${nomeExib(this.aliado)} ganhou ${ganho} de experiência.`);
      evs.forEach(e => {
        if (e.tipo === 'nivel') this.ev('nivel', `${nomeExib(this.aliado)} subiu para o nível ${e.nivel}!`);
        if (e.tipo === 'golpe') this.ev('golpeNovo', `${nomeExib(this.aliado)} aprendeu ${e.golpe}!` + (e.esqueceu ? ` (esqueceu ${e.esqueceu})` : ''));
        if (e.tipo === 'evolucao') this.ev('evolucao', `${e.de} evoluiu para ${e.para}!`);
      });
      // time adversário com mais Pokémon
      if (this.timeInimigo && this.timeInimigo.length){
        const prox = this.timeInimigo.shift();
        this.ev('info', `${this.treinador} envia ${prox.nome} (Nv ${prox.nivel})!`);
        this.inimigo = prox;
        this.estInimigo = this.novoEstado();
        return {eventos:this.eventos, fim:null};
      }
      return this.encerrar('vitoria');
    }

    if (this.aliado.hp <= 0){
      this.ev('derrota', `${nomeExib(this.aliado)} desmaiou.`);
      const reservas = Estado.dados.time.filter(p => estaVivo(p) && p.uid !== this.aliado.uid);
      if (reservas.length){
        return {eventos:this.eventos, fim:null, precisaTrocar:true, reservas:reservas.map(p=>p.uid)};
      }
      // ninguém mais pode lutar
      if (this.tipo === 'selvagem' || this.tipo === 'lendario'){
        return this.avaliarAmeaca();
      }
      this.ev('derrota', 'Você não tem mais ninguém em pé. O treinador adversário venceu.');
      return this.encerrar('derrota');
    }
    return {eventos:this.eventos, fim:null};
  },

  /* ---------- ⚠️ O SELVAGEM ATACA O TREINADOR ---------- */
  avaliarAmeaca(){
    const nat = NATUREZAS[this.inimigo.natureza] || {};
    if (!nat.agressiva){
      this.ev('info', `${this.inimigo.nome} rosna, hostil, mas não avança sobre você. Some no mato.`);
      return this.encerrar('derrota');
    }
    const d = Dados.d20('O selvagem ataca você?');
    this.ev('perigo', `Natureza ${this.inimigo.natureza} (agressiva). 1d20 = ${d} — ataca com 10+`);
    if (d < 10){
      this.ev('info', `${this.inimigo.nome} te encara por um segundo longo demais... e vai embora.`);
      return this.encerrar('derrota');
    }
    this.fase = 'ameaca';
    this.ev('perigo', `${this.inimigo.nome} avança em VOCÊ. Não tem mais Pokémon entre vocês dois.`);
    return {eventos:this.eventos, fim:null, ameaca:true};
  },

  acaoAmeaca(acao){
    if (acao.tipo === 'fugirAmeaca'){
      const d = Dados.d10('Fuga do selvagem');
      const total = d + Estado.j.status.forca;
      this.ev('info', `Fuga: 1d10(${d}) + Força(${Estado.j.status.forca}) = ${total} — precisa ≥ 7`);
      if (total >= 7){
        this.ev('fuga', 'Você corre. Os galhos cortam sua cara, mas você escapa.');
        return this.encerrar('escapou');
      }
      this.ev('erro', 'Você tropeça. Ele te alcança.');
      return this.golpeNoJogador();
    }
    if (acao.tipo === 'bola'){
      const r = Captura.tentar(this.inimigo, acao.nome, this);
      r.eventos.forEach(e => this.eventos.push(e));
      if (r.capturou) return this.encerrar('captura', {pokemon:this.inimigo, bola:acao.nome});
      return this.golpeNoJogador();
    }
    if (acao.tipo === 'item'){
      this.usarItemEmCombate(acao.nome, acao.alvoUid);
      const revivido = Estado.dados.time.find(p => estaVivo(p));
      if (revivido){
        this.ev('info', `${nomeExib(revivido)} se põe de pé entre você e ${this.inimigo.nome}.`);
        this.aliado = revivido;
        this.estAliado = this.novoEstado();
        this.fase = 'normal';
        return {eventos:this.eventos, fim:null, voltouAoCombate:true};
      }
      return this.golpeNoJogador();
    }
    if (acao.tipo === 'encarar'){
      const t = Dados.teste(Estado.j.status.carisma, 8, 'Carisma');
      this.ev('info', `Encarar: 1d10(${t.dado}) + Carisma(${t.bonus}) = ${t.total} — ${t.texto}`);
      if (t.grau === 'sucesso' || t.grau === 'critico'){
        this.ev('info', `Você não desvia o olhar. ${this.inimigo.nome} hesita — e recua para o mato.`);
        return this.encerrar('encarou');
      }
      this.ev('erro', 'Encarar um animal assustado nunca foi um bom plano.');
      return this.golpeNoJogador();
    }
    return this.golpeNoJogador();
  },

  golpeNoJogador(){
    const dano = Math.max(1, Math.round((this.inimigo.stats.atk / 10) * Dados.d10('Dano no treinador')));
    const morreu = Estado.ferir(dano, `Ataque de ${this.inimigo.nome} selvagem`);
    this.ev('danoJogador', `${this.inimigo.nome} te acerta. Você perde ${dano} de HP. (${Estado.j.hp}/${Estado.hpMaxJogador()})`, {dano});
    if (morreu){
      this.ev('gameover', 'Seu corpo cede. O mato fica quieto. Você não levanta mais.');
      return this.encerrar('gameover');
    }
    return {eventos:this.eventos, fim:null, ameaca:true};
  },

  encerrar(resultado, extra){
    this.ativo = false;
    this.fase = 'normal';
    this.fim = Object.assign({resultado}, extra||{});
    return {eventos:this.eventos, fim:this.fim};
  }
};


/* ===== js/story/motor.js ===== */
/* ============================================================
   MOTOR NARRATIVO — resolve cenas, efeitos e progressão
   ============================================================ */
const NOME_VIA = {
  neutro:'mais um treinador na estrada',
  heroi:'alguém que aparece quando as coisas dão errado',
  mercenario:'alguém que se resolve com dinheiro',
  foragido:'um problema com nome e sobrenome',
  pesquisador:'alguém que faz perguntas demais'
};

const Historia = {
  capAtual: null,
  cenaAtual: null,

  capitulo(n){ return CAPITULOS.find(c => c.num === n) || null; },

  iniciarCapitulo(n){
    const cap = this.capitulo(n);
    if (!cap) return null;
    Estado.dados.capitulo = n;
    Estado.dados.cena = cap.inicio;
    this.capAtual = cap;
    Estado.registrar(`=== Capítulo ${n}: ${cap.titulo} ===`);
    return this.ir(cap.inicio, true);
  },

  /* aplicarEfeitos: só na PRIMEIRA vez que se entra na cena.
     Re-renderizações (ação livre, observar) passam false e não repetem nada. */
  ir(idCena, aplicarEfeitos){
    const cap = this.capAtual || this.capitulo(Estado.dados.capitulo);
    this.capAtual = cap;
    const cena = cap.cenas[idCena];
    if (!cena){ console.error('Cena inexistente:', idCena); return null; }
    Estado.dados.cena = idCena;
    this.cenaAtual = Object.assign({id:idCena}, cena);
    this.avisosCena = [];
    if (aplicarEfeitos){
      if (cena.aoEntrar) this.avisosCena = this.avisosCena.concat(this.aplicar(cena.aoEntrar));
      if (cena.ef)       this.avisosCena = this.avisosCena.concat(this.aplicar(cena.ef));
    }
    return this.cenaAtual;
  },

  /* Resumo interno do estado — o Mestre "lembra" antes de narrar */
  resumo(){
    const d = Estado.dados, j = d.jogador;
    const linhas = [];
    linhas.push(`${j.nome}, ${j.idade} anos, de ${j.cidade}. ${j.personalidade}.`);
    linhas.push(`Reputação: ${Estado.nomeRep()} (eixo ${d.reputacao.eixo}). HP ${j.hp}/${Estado.hpMaxJogador()}.`);
    if (d.time.length) linhas.push(`Time: ${d.time.map(p => `${nomeExib(p)} Nv${p.nivel}${p.hp<=0?' (desmaiado)':''}`).join(', ')}.`);
    if (d.cemiterio.length) linhas.push(`Mortos: ${d.cemiterio.map(p => `${nomeExib(p)} (${p.causaMorte})`).join(', ')}. Isso não some.`);
    const presos = Estado.lendariosCapturados();
    if (presos.length) linhas.push(`Lendários em cativeiro: ${presos.map(l => DEX[l.dex].nome).join(', ')}.`);
    const caçando = Object.values(d.lendarios).filter(l => l.caçandoVoce);
    if (caçando.length) linhas.push(`Te caçando: ${caçando.map(l => DEX[l.dex].nome).join(', ')}.`);
    if (d.via && d.via !== 'neutro') linhas.push(`Kanto te trata como: ${NOME_VIA[d.via] || d.via}.`);
    if (d.liga.detencao) linhas.push('A Liga Pokémon tem uma ordem de detenção com o seu nome.');
    else if (d.liga.ordemDevolucao) linhas.push('A Liga exigiu formalmente a devolução do que você pegou.');
    if (d.mundo.clima !== 'normal') linhas.push(`O clima de Kanto está ${d.mundo.clima}.`);
    const nomesNPC = Object.keys(d.npcs);
    if (nomesNPC.length) linhas.push(`Gente que lembra de você: ${nomesNPC.join(', ')}.`);
    return linhas;
  },

  /* O que o mundo deixa escapar em vez de anunciar o que você ganhou.
     O número exato fica no Diário; aqui fica o que vem por aí. */
  presagio(tipo, ef){
    const bom = [
      'Alguém viu isso. Gente lembra desse tipo de coisa por muito mais tempo do que parece.',
      'Isso vai voltar pra você. Do jeito bom, e provavelmente quando você não estiver esperando.',
      'Uma pessoa que você nem reparou vai contar isso pra outra pessoa hoje à noite.',
      'Não muda nada agora. Muda uma coisa depois, num lugar que você ainda não conhece.'
    ];
    const ruim = [
      'Isso vai voltar. Coisa assim sempre volta, e nunca no mesmo formato.',
      'Ninguém falou nada. Todo mundo viu.',
      'Alguém vai lembrar disso numa hora em que você precisar que ninguém lembre.',
      'Você vai reencontrar essa escolha. Ela não tem pressa.'
    ];
    const item = [
      'Você guarda na mochila sem pensar muito.',
      'Entra na mochila junto com o resto.'
    ];
    if (tipo === 'bom')  return {tipo:'rep', texto: Dados.escolher(bom)};
    if (tipo === 'ruim') return {tipo:'dano', texto: Dados.escolher(ruim)};
    if (tipo === 'item') return {tipo:'info', texto: Dados.escolher(item)};
    return null;
  },

  /* ---------- EFEITOS ---------- */
  aplicar(ef){
    if (!ef) return [];
    const avisos = [];
    if (ef.flag) { (Array.isArray(ef.flag)?ef.flag:[ef.flag]).forEach(f => Estado.marcar(f)); }
    if (ef.limpaFlag){ (Array.isArray(ef.limpaFlag)?ef.limpaFlag:[ef.limpaFlag]).forEach(f => Estado.marcar(f,false)); }
    if (ef.rep){
      const r = Estado.mudarRep(ef.rep.eixo, ef.rep.delta, ef.rep.motivo);
      if (r) { const p = this.presagio(ef.rep.eixo, ef); if (p) avisos.push(p); }
    }
    if (ef.itens){
      let algum = false;
      for (const [nome,q] of Object.entries(ef.itens)){ Estado.darItem(nome,q); algum = true; }
      if (algum){ const p = this.presagio('item', ef); if (p) avisos.push(p); }
    }
    if (ef.perdeItens){
      for (const [nome,q] of Object.entries(ef.perdeItens)){
        for (let i=0;i<q;i++) Estado.usarItem(nome);
        avisos.push({tipo:'item', texto:`Perdeu ${q}× ${nome}.`});
      }
    }
    if (ef.dinheiro){
      Estado.j.dinheiro = Math.max(0, Estado.j.dinheiro + ef.dinheiro);
      Estado.registrar(`${ef.dinheiro>0?'+':''}${ef.dinheiro} ₽ (total: ${Estado.j.dinheiro} ₽)`);
    }
    if (ef.hp){
      if (ef.hp < 0){
        const morreu = Estado.ferir(-ef.hp, ef.causa || 'ferimento');
        const prop = Estado.j.hp / Estado.hpMaxJogador();
        avisos.push({tipo:'dano', texto: prop > 0.66 ? 'Dói, e vai doer mais amanhã.'
          : prop > 0.33 ? 'Você sente isso de um jeito que não passa rápido. Precisa parar em algum lugar.'
          : 'Você está mal. Mal de precisar de ajuda, não de precisar descansar.'});
        if (morreu) avisos.push({tipo:'gameover', texto:'Você não aguentou.'});
      } else {
        Estado.curarJogador(ef.hp);
        avisos.push({tipo:'cura', texto:'Alguma coisa em você assenta de volta no lugar.'});
      }
    }
    if (ef.pokemon){
      const p = criarPokemon(ef.pokemon.dex, ef.pokemon.nivel, ef.pokemon.opcoes||{});
      Estado.adicionar(p);
      avisos.push({tipo:'pokemon', texto:`${nomeExib(p)} (Nv ${p.nivel}, ${p.natureza}) entrou para o seu time.`});
      Estado.registrar(`Recebeu ${p.nome} Nv${p.nivel}.`);
    }
    if (ef.mataPrimeiro){
      const alvo = Estado.dados.time.find(p => estaVivo(p));
      if (alvo){
        Estado.matar(alvo, ef.mataPrimeiro);
        avisos.push({tipo:'morte', texto:`${nomeExib(alvo)} morreu. ${ef.mataPrimeiro}`});
      }
    }
    if (ef.mataEscolhido && ef.uidAlvo){
      const alvo = Estado.dados.time.find(p => p.uid === ef.uidAlvo);
      if (alvo){
        Estado.matar(alvo, ef.mataEscolhido);
        avisos.push({tipo:'morte', texto:`${nomeExib(alvo)} morreu. ${ef.mataEscolhido}`});
      }
    }
    if (ef.moral){
      Estado.dados.time.forEach(p => { p.moral = Math.max(0, Math.min(100, p.moral + ef.moral)); });
      avisos.push({tipo:'info', texto: ef.moral > 0 ? 'O time confia mais em você.' : 'O time te olha diferente agora.'});
    }
    if (ef.npc) Estado.lembrarNPC(ef.npc.nome, ef.npc);
    if (ef.insignia && !Estado.dados.insignias.includes(ef.insignia)){
      Estado.dados.insignias.push(ef.insignia);
      avisos.push({tipo:'insignia', texto:`Você sai com a ${ef.insignia} no bolso. Ela pesa menos do que devia.`});
    }
    if (ef.curaTime){ Estado.dados.time.forEach(curarTotal); avisos.push({tipo:'cura', texto:'Seu time foi curado por completo.'}); }
    if (ef.instabilidade){ Estado.dados.mundo.instabilidade += ef.instabilidade; }
    if (ef.registrar) Estado.registrar(ef.registrar);
    if (ef.executar) { const extra = ef.executar(Estado.dados); if (Array.isArray(extra)) extra.forEach(a => avisos.push(a)); }
    return avisos;
  },

  /* Uma escolha está disponível? */
  disponivel(escolha){
    if (!escolha.cond) return true;
    try { return !!escolha.cond(Estado.dados); } catch(e){ return false; }
  },

  /* Qual arco da história espera por você NESTE lugar, agora */
  arcoAqui(){
    const d = Estado.dados;
    let n = d.capitulo + 1;
    while (this.capitulo(n)){
      const cap = this.capitulo(n);
      if (cap.requer && !this.testaRequisito(cap)){ n++; continue; }
      const a = ANCORAS[n];
      if (!a) return null;
      if (a.local === '*' || a.local === Mundo.id()) return {num:n, chamada:a.chamada, cap};
      return null;
    }
    return null;
  },

  /* Onde o próximo arco espera — para a bússola da interface */
  proximoDestino(){
    const d = Estado.dados;
    let n = d.capitulo + 1;
    while (this.capitulo(n)){
      const cap = this.capitulo(n);
      if (cap.requer && !this.testaRequisito(cap)){ n++; continue; }
      const a = ANCORAS[n];
      return a ? {num:n, local:a.local, nome:(LOCAIS[a.local]||{}).nome} : null;
    }
    return null;
  },

  /* Fim de capítulo: 2 pontos e consequências acumuladas do mundo */
  fecharCapitulo(){
    Estado.j.pontos += 2;
    const avisos = Estado.tickLendarios();
    Estado.dados.relogio.dia += Dados.entre(2,5);
    Estado.salvar('auto');
    return avisos;
  },

  /* Próximo capítulo — respeita desvios de rota e capítulos condicionais.
     Um capítulo pode definir:
       proximo: d => numero   (desvio explícito, decidido pelas escolhas)
       requer:  d => bool     (capítulo só existe em certas rotas) */
  proximoCapitulo(){
    const atual = this.capitulo(Estado.dados.capitulo);
    if (atual && typeof atual.proximo === 'function'){
      let alvo = null;
      try { alvo = atual.proximo(Estado.dados); } catch(e){ alvo = null; }
      if (alvo && this.capitulo(alvo)) return alvo;
    }
    let n = Estado.dados.capitulo + 1;
    while (this.capitulo(n)){
      const c = this.capitulo(n);
      if (!c.requer || this.testaRequisito(c)) return n;
      Estado.registrar(`(Capítulo ${n} — "${c.titulo}" — não aconteceu nesta jornada.)`);
      n++;
    }
    return null;
  },

  testaRequisito(cap){
    try { return !!cap.requer(Estado.dados); } catch(e){ return true; }
  },

  /* Quais capítulos ficaram de fora — usado no epílogo */
  capitulosPulados(){
    return CAPITULOS.filter(c => c.requer && !this.testaRequisito(c)).map(c => c.titulo);
  },

  /* A "via" é o jeito que o mundo passou a te enxergar. Ela abre e fecha caminhos. */
  definirVia(via, motivo){
    const d = Estado.dados;
    if (d.via === via) return;
    d.viaAnterior = d.via;
    d.via = via;
    Estado.registrar(`Rota narrativa: ${via}${motivo ? ' — ' + motivo : ''}`);
  },

  via(){ return Estado.dados.via || 'neutro'; }
};

/* Resolve texto que pode ser função do estado */
function txt(t){
  if (typeof t === 'function'){ try { return t(Estado.dados); } catch(e){ return ''; } }
  return t;
}

/* ===== js/story/rival.js ===== */
/* ============================================================
   O RIVAL
   Téo, da pedra na Rota 1. Ele não é um obstáculo fixo:
   o time, o tom e o arco dele mudam conforme o que você faz —
   e, se você for longe demais, ele deixa de ser rival.
   ============================================================ */

const ARCOS_RIVAL = {
  parceiro:{
    nome:'Parceiro',
    resumo:'Ele torce por você em voz alta e sem vergonha nenhuma.',
    nivelExtra:0, moral:90
  },
  rival:{
    nome:'Rival',
    resumo:'Rivalidade saudável: ele quer te vencer e quer que você esteja bem.',
    nivelExtra:1, moral:70
  },
  ressentido:{
    nome:'Ressentido',
    resumo:'Ele treina demais, dorme pouco e não sorri mais quando te vê.',
    nivelExtra:3, moral:40
  },
  perseguidor:{
    nome:'Perseguidor',
    resumo:'Ele não quer mais te vencer. Ele quer te parar.',
    nivelExtra:5, moral:80
  },
  quebrado:{
    nome:'Quebrado',
    resumo:'Ele parou. Não de treinar — de tentar.',
    nivelExtra:-3, moral:25
  }
};

/* Inicializa o rival quando o jogador cria o personagem */
function iniciarRival(){
  const d = Estado.dados;
  // o inicial dele é o que vence o seu — como sempre foi
  const contra = {1:4, 4:7, 7:1};     // Bulbasaur->Charmander, Charmander->Squirtle, Squirtle->Bulbasaur
  const meu = d.jogador.inicialDex;
  const dele = contra[meu] || Dados.escolher([1,4,7]);
  d.rival = {
    nome:'Téo',
    inicialDex: dele,
    vitorias:0,      // vitórias DELE sobre você
    derrotas:0,      // derrotas dele
    encontros:0,
    ultimoCap:0,
    arco:'rival'
  };
  return d.rival;
}

function rival(){
  const d = Estado.dados;
  if (!d.rival) iniciarRival();
  return d.rival;
}

/* ============================================================
   ARCO — recalculado a cada encontro, a partir do que você fez
   ============================================================ */
function arcoRival(){
  const d = Estado.dados;
  const r = rival();
  const npc = d.npcs['Téo'];
  const op = npc ? npc.opiniao : 0;

  // 1) você virou uma coisa que ele precisa parar
  const monstro = (d.reputacao.eixo === 'ruim' && d.reputacao.ruim >= 5)
    || d.flags.tem_sangue_nas_maos
    || d.flags.trabalha_para_comissao
    || d.flags.conselheiro_da_comissao
    || d.flags.assumiu_a_rede
    || d.cemiterio.length >= 2;
  if (monstro && op > -8) return 'perseguidor';

  // 2) ele desistiu: perdeu muito e foi tratado mal
  if (r.derrotas >= 4 && op <= 0) return 'quebrado';

  // 3) o resto é a opinião dele sobre você
  if (op >= 5) return 'parceiro';
  if (op <= -2) return 'ressentido';
  return 'rival';
}

/* ============================================================
   TIME — escala com você e se molda ao arco
   ============================================================ */
function nivelRival(){
  const t = Estado.dados.time.filter(p => !p.morto);
  const base = t.length ? Math.round(t.reduce((s,p)=>s+p.nivel,0)/t.length) : 8;
  return Math.max(6, base + (ARCOS_RIVAL[arcoRival()].nivelExtra || 0));
}

/* linha evolutiva do inicial dele, conforme o nível */
function inicialDoRival(nivel){
  const linha = {1:[1,2,3], 4:[4,5,6], 7:[7,8,9]}[rival().inicialDex] || [1,2,3];
  if (nivel >= 36) return linha[2];
  if (nivel >= 16) return linha[1];
  return linha[0];
}

/* Contra o Perseguidor: ele treinou olhando o SEU time */
function contraSeuTime(){
  const meus = Estado.dados.time.filter(p => !p.morto);
  const tipos = {};
  meus.forEach(p => p.tipos.forEach(t => tipos[t] = (tipos[t]||0)+1));
  const ordenados = Object.keys(tipos).sort((a,b)=>tipos[b]-tipos[a]);
  const escolhidos = [];
  for (const t of ordenados){
    // acha uma espécie cujo tipo bate forte contra t
    const candidatos = POOL_SELVAGEM.filter(d => {
      const p = DEX[d];
      if (p.evo || p.total < 400) return false;
      return p.tipos.some(tp => (TABELA_TIPOS[tp]||{})[t] === 2);
    });
    if (candidatos.length){
      const dex = candidatos[(t.length * 7 + escolhidos.length * 13) % candidatos.length];
      if (!escolhidos.includes(dex)) escolhidos.push(dex);
    }
    if (escolhidos.length >= 4) break;
  }
  return escolhidos;
}

const POOL_ARCO = {
  parceiro:   [17, 20, 58, 123, 128, 131],   // Pidgeotto, Raticate, Growlithe, Scyther, Tauros, Lapras
  rival:      [17, 20, 64, 57, 128, 130],    // Pidgeotto, Raticate, Kadabra, Primeape, Tauros, Gyarados
  ressentido: [93, 110, 97, 42, 89, 94],     // Haunter, Weezing, Hypno, Golbat, Muk, Gengar
  perseguidor:[65, 68, 130, 143, 112, 149],  // Alakazam, Machamp, Gyarados, Snorlax, Rhydon, Dragonite
  quebrado:   [16, 19, 21, 41]               // Pidgey, Rattata, Spearow, Zubat — nada evoluiu
};

function timeRival(){
  const d = Estado.dados;
  const arco = arcoRival();
  const nivel = nivelRival();
  const qtd = Math.max(2, Math.min(6, 2 + Math.round(numInsignias() * 0.6)));

  let pool = POOL_ARCO[arco].slice();
  if (arco === 'perseguidor'){
    const contras = contraSeuTime();
    pool = contras.concat(pool.filter(x => !contras.includes(x)));
  }

  const time = [];
  for (let i = 0; i < qtd - 1 && i < pool.length; i++){
    time.push(criarPokemon(pool[i], Math.max(5, nivel - 2 + i), {moral: ARCOS_RIVAL[arco].moral}));
  }
  // o inicial dele entra por último e é sempre o ace
  const ini = criarPokemon(inicialDoRival(nivel), nivel + 2, {moral: ARCOS_RIVAL[arco].moral});
  if (arco === 'quebrado') ini.nivel = Math.max(5, nivel);
  time.push(ini);
  return time;
}

/* ============================================================
   ENCONTROS — ele aparece entre capítulos
   ============================================================ */
const CAPS_RIVAL = [5, 9, 13, 17, 21];

function rivalDeveAparecer(cap){
  const d = Estado.dados;
  if (!d.npcs['Téo']) return false;            // você nunca falou com ele na Rota 1
  const r = rival();
  if (r.ultimoCap === cap) return false;
  return CAPS_RIVAL.includes(cap);
}

/* ============================================================
   FALAS — mudam com o arco, o placar e o que você fez
   ============================================================ */
function falaRival(){
  const d = Estado.dados;
  const r = rival();
  const arco = arcoRival();
  const placar = r.derrotas > r.vitorias ? 'perdendo' : (r.vitorias > r.derrotas ? 'ganhando' : 'empatado');
  const L = [];

  if (arco === 'parceiro'){
    L.push('"EI!" Téo atravessa a rua correndo e quase é atropelado por uma bicicleta. "Cara, eu vi o teu nome numa parada e eu gritei no meio do Centro Pokémon."');
    if (d.insignias.length) L.push(`"${d.insignias.filter(i=>i!=='Título de Campeão').length} insígnias. ${d.insignias.length>4?'CARA.':'Já?'}"`);
    if (d.cemiterio.length) L.push(`Ele fica sério de repente. "Eu soube do ${nomeExib(d.cemiterio[0])}." Ele não sabe o que fazer com as mãos. "Desculpa. Eu não sei falar essas coisas."`);
    L.push(placar === 'perdendo'
      ? '"Eu perdi as últimas. Eu sei. Mas eu vim de novo, e eu vou vir de novo depois dessa."'
      : '"Bora? Bora. Eu tô pronto dessa vez, eu treinei de verdade."');
  }

  else if (arco === 'rival'){
    L.push('"Achei que ia te encontrar aqui." Téo já está com a mão no cinto. "Não é coincidência, eu perguntei pra umas pessoas."');
    if (d.insignias.length >= 4) L.push('"Você tá na minha frente. Tá tranquilo. Eu prefiro assim, dá menos vergonha de perder."');
    L.push(placar === 'ganhando' ? '"Eu tô ganhando a série. Você percebeu isso ou tá fingindo que não?"' : '"Bora resolver isso."');
  }

  else if (arco === 'ressentido'){
    L.push('Téo está encostado num poste e não se mexe quando você passa. Ele espera você notar.');
    L.push('"Oi." Ele não sorri. "Eu tenho treinado."');
    const npc = d.npcs['Téo'];
    const mem = npc && npc.memorias && npc.memorias.length ? npc.memorias[npc.memorias.length-1].texto : null;
    if (mem) L.push(`Ele não esqueceu. "${mem}"`);
    L.push('"Não precisa ser simpático. Eu não vim pra isso."');
  }

  else if (arco === 'perseguidor'){
    L.push('Téo está esperando no meio do caminho, e dá pra ver que ele está ali há horas.');
    L.push('"Eu não vim te desafiar."');
    if (d.cemiterio.length >= 2) L.push(`"Eu contei. Você perdeu ${d.cemiterio.length}. Isso não é acidente duas vezes."`);
    if (d.flags.trabalha_para_comissao || d.flags.conselheiro_da_comissao) L.push('"Eu li as atas. Tem o teu nome numa delas, numa lista de presença, do lado de gente que assina descarte."');
    if (d.flags.assumiu_a_rede) L.push('"Eu fui em Celadon. Eu vi o portão azul. Eu perguntei de quem era agora e eles falaram o teu nome."');
    if (Estado.rep.eixo==='ruim' && Estado.rep.ruim>=6) L.push(`"Tem gente com medo de você. Gente de verdade, não bicho."`);
    L.push('"A gente se conheceu numa pedra na Rota 1. Eu tava lá desde as seis da manhã e você foi a primeira pessoa que passou."');
    L.push('"Eu vou te parar. Eu não sei se eu consigo. Mas alguém tem que estar aqui, e quem te conhece sou eu."');
  }

  else { // quebrado
    L.push('Téo está sentado no chão do Centro Pokémon, de costas para a porta, e demora pra virar.');
    L.push('"Ah. Oi."');
    L.push(`"Eu perdi pra você ${r.derrotas} vezes." Ele diz o número sem drama. "Eu parei de contar como derrota faz um tempo. Agora eu conto como... sei lá. Estatística."`);
    L.push('"Eu vou lutar se você quiser. Eu só não vou fingir que eu acho que dá."');
  }

  return L;
}

function falaVitoriaRival(){   // você venceu
  const arco = arcoRival();
  const r = rival();
  const d = Estado.dados;
  if (arco === 'parceiro') return [
    'Téo recolhe o time e vem te abraçar antes de recolher, o que é a ordem errada e é muito a cara dele.',

  ];

    '"Sabe o que é o pior? Eu treinei. Eu treinei de verdade dessa vez."',

  ];

  ];

  ];
}

function falaDerrotaRival(){   // ele venceu
  const arco = arcoRival();
  const r = rival();
  if (arco === 'parceiro') return [
    'Téo ganha e fica genuinamente sem saber como comemorar na sua frente.',
    '"Foi sorte." Ele diz isso e nenhum dos dois acredita. "Foi sorte, cara."',
    'Ele te acompanha até o Centro Pokémon e paga a sua sopa.'
  ];
  if (arco === 'ressentido') return [
    'Ele ganha e não comemora. Fica olhando o chão por um tempo longo.',
    '"Pronto." A voz dele treme um pouco. "Pronto, agora eu ganhei uma."',
    'Ele esperou muito tempo por isso e agora não sabe o que fazer com isso.'
  ];
  if (arco === 'perseguidor') return [
    'Ele ganha, e é a primeira vez em toda a jornada que você perde uma batalha e sente que mereceu.',
    'Téo não recolhe o time. Fica de pé entre você e o caminho.',
    '"Volta." A voz dele é firme de um jeito que você nunca ouviu. "Volta pra tua cidade. Hoje."',
    'E depois, mais baixo: "Eu não sei o que eu faço se você não voltar."'
  ];
  if (arco === 'quebrado') return [
    'Téo ganha.',
    'Ele olha as bolas na mão dele como se não entendesse o que acabou de acontecer.',
    '"Espera." Ele ri, e o riso quebra no meio. "Espera, eu —"',
    'Ele não termina a frase. Ele não precisa.'
  ];
  return [
    'Téo ganha e grita alto demais para o tamanho do lugar.',
    `"${r.vitorias + 1} a ${r.derrotas}!" Ele aponta pra você. "ANOTA ISSO."`
  ];
}

/* Registra o resultado e move a opinião dele */
function registrarResultadoRival(venceuJogador){
  const r = rival();
  r.encontros++;
  r.ultimoCap = Estado.dados.capitulo;
  if (venceuJogador) r.derrotas++; else r.vitorias++;
  r.arco = arcoRival();
  Estado.registrar(`Encontro com Téo (${ARCOS_RIVAL[r.arco].nome}): ${venceuJogador ? 'você venceu' : 'ele venceu'}. Placar ${r.derrotas}×${r.vitorias}.`);
  return r;
}

/* ============================================================
   ESCALA — o líder adapta o TIME INTEIRO ao seu progresso
   Não é só nível: com poucas insígnias ele usa Pokémon não
   evoluídos; com muitas, traz a linha completa e o ace.
   ============================================================ */
const ESCALOES_NIVEL = [
  {min:0, base:10},   // novato
  {min:2, base:18},
  {min:4, base:28},
  {min:6, base:40}    // reta final
];

function escalaoDe(g, n){
  let alvo = g.escaloes[0];
  for (const e of g.escaloes) if (n >= e.min) alvo = e;
  return alvo;
}

function timeGinasio(g, nForcado){
  // ginásio ainda trancado mostra o time do momento em que ele abre
  const n = (nForcado !== undefined) ? nForcado
          : (g.requerInsignias && numInsignias() < g.requerInsignias ? g.requerInsignias : numInsignias());
  const esc = escalaoDe(g, n);
  let faixa = ESCALOES_NIVEL[0];
  for (const f of ESCALOES_NIVEL) if (n >= f.min) faixa = f;
  const base = faixa.base + (g.dificuldade || 0) + (n - faixa.min) * 3;

  // o líder não repete o mesmo time: parte dos slots varia a cada desafio
  const especies = esc.especies.slice();
  const pool = (esc.variacoes || []).filter(x => !especies.includes(x));
  for (let i = 0; i < especies.length - 1 && pool.length; i++){
    if (Dados.chance(45)){
      const j = Dados.entre(0, pool.length - 1);
      especies[i] = pool.splice(j, 1)[0];
    }
  }
  const lista = especies.map((dex, i) => ({dex, nivel: base + i}));
  if (lista.length) lista[lista.length-1].nivel += 2;   // ace, sempre o mesmo

  // Blue fecha com o inicial que vence o seu
  if (g.aceContraInicial){
    const contra = {1:6, 4:9, 7:3};
    const ace = contra[Estado.j.inicialDex] || Dados.escolher([3,6,9]);
    lista[lista.length-1] = {dex:ace, nivel: base + lista.length + 3};
  }
  return lista;
}

function faixaGinasio(g){
  const t = timeGinasio(g);
  if (!t.length) return '—';
  return `${t[0].nivel}–${t[t.length-1].nivel}`;
}

function ginasioPorId(id){ return GINASIOS.find(g => g.id === id) || null; }

/* Estado de cada ginásio para o jogador atual */
function statusGinasio(g){
  const d = Estado.dados;
  if (d.insignias.includes(g.insignia)) return {estado:'conquistado', texto:'Insígnia conquistada'};
  if (g.requerInsignias && numInsignias() < g.requerInsignias)
    return {estado:'trancado', texto:`Abre com ${g.requerInsignias} insígnias (você tem ${numInsignias()})`};
  // o ginásio da sua cidade natal está aberto desde o primeiro dia; os outros, a partir do capítulo 2
  const deCasa = GINASIO_DE_CASA[d.jogador.cidade] === g.id;
  if (!deCasa && d.capitulo < 2)
    return {estado:'distante', texto:'Você mal saiu de casa'};
  if (g.recusa){
    const r = g.recusa(d);
    if (r) return {estado:'recusado', texto:'O líder se recusa a lutar com você', fala:r};
  }
  return {estado:'disponivel', texto: deCasa && !numInsignias() ? 'O ginásio da sua cidade' : 'Disponível'};
}

function insigniasConquistadas(){
  return GINASIOS.filter(g => Estado.dados.insignias.includes(g.insignia)).length;
}

/* Monta um adversário de torneio com time escalado ao jogador */
function adversarioTorneio(rival, nivelAlvo){
  // Téo entra com o time de verdade dele, no arco em que estiver
  if (rival.nome === 'Téo' && Estado.dados.rival){
    return {nome:'Téo', fala: rival.fala, time: timeRival()};
  }
  const pool = POOL_SELVAGEM.filter(d => {
    const p = DEX[d];
    return p.tipos.some(t => rival.tipos.includes(t)) && p.total >= 380 && !p.evo;
  });
  const fallback = POOL_SELVAGEM.filter(d => DEX[d].total >= 400 && !DEX[d].evo);
  const base = pool.length >= 3 ? pool : fallback;
  const qtd = 3;
  const time = [];
  const usados = new Set();
  for (let i = 0; i < qtd; i++){
    let dex = Dados.escolher(base);
    let tentativas = 0;
    while (usados.has(dex) && tentativas++ < 12) dex = Dados.escolher(base);
    usados.add(dex);
    time.push(criarPokemon(dex, Math.max(5, nivelAlvo + Dados.entre(-2, 2)), {}));
  }
  return {nome: rival.nome, fala: rival.fala, time};
}

function nivelDoJogador(){
  const t = Estado.dados.time.filter(p => !p.morto);
  if (!t.length) return 10;
  return Math.round(t.reduce((s,p) => s + p.nivel, 0) / t.length);
}

/* Sorteia sete adversários coerentes com a sua história */
function montarChaveamento(){
  const d = Estado.dados;
  const disponiveis = RIVAIS_TORNEIO.filter(r => !r.cond || r.cond(d));
  const escolhidos = [];
  const vistos = new Set();
  // primeiro os que têm ligação com a sua história
  disponiveis.filter(r => r.cond).forEach(r => {
    if (escolhidos.length < 3 && !vistos.has(r.nome)){ escolhidos.push(r); vistos.add(r.nome); }
  });
  const resto = disponiveis.filter(r => !r.cond);
  while (escolhidos.length < 3 && resto.length){
    const r = resto.splice(Dados.entre(0, resto.length-1), 1)[0];
    if (!vistos.has(r.nome)){ escolhidos.push(r); vistos.add(r.nome); }
  }
  const nivel = nivelDoJogador();
  return escolhidos.slice(0,3).map((r,i) => adversarioTorneio(r, nivel + i*2));
}

const Cidade = {
  centro(){
    Mundo.passar(1);
    const d = Estado.dados;
    if (!d.flags.tem_licenca){
      return Exploracao.tela([
        {tipo:'info', texto:'A enfermeira olha o seu cinto, depois a sua cara, e pergunta o número da sua licença.'},
        {tipo:'dano', texto:'Você não tem número nenhum. Ela atende do mesmo jeito — mas cobra, e cobra caro, porque sem licença você é cliente e não treinador.'}
      ]);
    }
    Estado.dados.time.forEach(curarTotal);
    Estado.curarJogador(10);
    Estado.salvar('auto');
    Exploracao.tela([
      {tipo:'cura', texto:'A enfermeira leva o time pra dentro e devolve tudo certo em vinte minutos. Você dorme num quarto com seis camas e cinco desconhecidos.'},
      {tipo:'info', texto:'Amanhece.'}
    ]);
  },

  loja(){
    const catalogo = [
      ['Poké Ball',200],['Great Ball',600],['Ultra Ball',1200],
      ['Potion',300],['Super Potion',700],['Hyper Potion',1500],
      ['Revive',1500],['Antidote',250],['Full Heal',600],
      ['Bandagem',400],['Ração',350]
    ];
    UI.modal('Loja — ' + Estado.j.dinheiro + ' ₽', catalogo.map(([n,p]) =>
      `<button class="escolha" ${Estado.j.dinheiro < p ? 'disabled style="opacity:.4"':''}
        onclick="Cidade.comprar('${n}',${p})">${n} — ${p} ₽
        <span class="pd">${(ITENS_INFO[n]||{}).desc||''}</span></button>`).join(''));
  },
  comprar(nome, preco){
    if (Estado.j.dinheiro < preco) return;
    Estado.j.dinheiro -= preco;
    Estado.darItem(nome, 1);
    Estado.salvar('auto');
    this.loja();
  },

  ginasio(){
    const id = Mundo.id();
    const g = GINASIOS.find(x => x.id === id);
    if (!g) return Exploracao.tela([{tipo:'info', texto:'Não tem ginásio aqui.'}]);
    const st = statusGinasio(g);
    if (st.estado === 'conquistado')
      return Exploracao.tela([{tipo:'info', texto:'Você já tem a insígnia daqui. O líder acena de longe e volta ao que estava fazendo.'}]);
    if (st.estado === 'recusado')
      return Exploracao.tela([{tipo:'dano', texto:st.fala}]);
    if (st.estado !== 'disponivel')
      return Exploracao.tela([{tipo:'info', texto:st.texto}]);
    Jogo.voltarDeGinasio = 'exploracao';
    Jogo.desafiarGinasio(g.id);
  }
};
